    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>数字冒险 · Number Dungeon</title>\n<style>\n  :root{ --cell:80px; --gap:11px; }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  body{\n    margin:0;padding:26px 18px;min-height:100vh;\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace;\n    color:#e6f0ff;\n    background:\n      radial-gradient(820px 460px at 8% -10%, rgba(255,210,74,.08) 0%, rgba(255,233,201,0) 60%),\n      radial-gradient(700px 460px at 96% 106%, rgba(138,122,181,.10) 0%, rgba(230,220,255,0) 58%),\n      #0d0d1a;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .app{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:980px;width:100%}\n\n  /* ---------- 棋盘 ---------- */\n  .board{\n    position:relative;\n    width:calc(4 * var(--cell) + 5 * var(--gap));\n    height:calc(4 * var(--cell) + 5 * var(--gap));\n    background:#161c30;\n    border-radius:20px;\n    box-shadow:0 18px 46px rgba(0,0,0,.45), inset 0 0 0 1px #26304a;\n    flex:0 0 auto;\n    touch-action:none;\n  }\n  .layer{position:absolute;inset:var(--gap)}\n  .slot{\n    position:absolute;width:var(--cell);height:var(--cell);\n    border-radius:13px;background:#1b2136;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);\n  }\n  .tile{\n    position:absolute;width:var(--cell);height:var(--cell);\n    transition:transform .13s cubic-bezier(.3,.9,.4,1);\n    will-change:transform;\n  }\n  .tile .face{\n    width:100%;height:100%;border-radius:13px;\n    display:grid;place-items:center;\n    font-weight:800;letter-spacing:-.02em;\n    font-size:calc(var(--cell) * .37);\n    background:#1b2136;color:#93a2c0;\n    box-shadow:0 2px 0 rgba(0,0,0,.35);\n  }\n  .tile[data-v=\"2\"]    .face{background:#1e2740;color:#8b98b8}\n  .tile[data-v=\"4\"]    .face{background:#ece2cf;color:#8b98b8}\n  .tile[data-v=\"8\"]    .face{background:#f7cb8c;color:#2a1f00}\n  .tile[data-v=\"16\"]   .face{background:#f3ae67;color:#2a1f00}\n  .tile[data-v=\"32\"]   .face{background:#ef8e57;color:#fff}\n  .tile[data-v=\"64\"]   .face{background:#e86b45;color:#fff}\n  .tile[data-v=\"128\"]  .face{background:#e0a233;color:#fff;font-size:calc(var(--cell)*.31)}\n  .tile[data-v=\"256\"]  .face{background:#d59420;color:#fff;font-size:calc(var(--cell)*.31)}\n  .tile[data-v=\"512\"]  .face{background:#c87e12;color:#fff;font-size:calc(var(--cell)*.31)}\n  .tile[data-v=\"1024\"] .face{background:#b96a08;color:#fff;font-size:calc(var(--cell)*.25)}\n  .tile[data-v=\"2048\"] .face{background:#ffd24a;color:#fff;font-size:calc(var(--cell)*.25);\n                             box-shadow:0 0 22px rgba(233,69,96,.70)}\n  .tile[data-v=\"4096\"] .face{background:#7d3d05;color:#fff;font-size:calc(var(--cell)*.25);\n                             box-shadow:0 0 26px rgba(233,69,96,.85)}\n\n  .tile.rock .face{\n    background:\n      repeating-linear-gradient(45deg, #6f7d9c 0 7px, #6f7d9c 7px 14px);\n    box-shadow:inset 0 -3px 0 rgba(90,80,60,.28), inset 0 3px 0 rgba(255,255,255,.22);\n  }\n  .tile.rock .face::after{\n    content:\"\";width:34%;height:34%;border-radius:50%;\n    background:rgba(0,0,0,.35);box-shadow:0 8px 0 -4px rgba(0,0,0,.30);\n  }\n\n  .tile.pop   .face{animation:pop .2s ease}\n  .tile.spawn .face{animation:spawn .2s ease}\n  .tile.dead  .face{animation:die .22s ease forwards}\n  .tile.burst .face{animation:burst .42s ease forwards}\n  @keyframes pop  {0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}\n  @keyframes spawn{0%{transform:scale(.35);opacity:0}100%{transform:scale(1);opacity:1}}\n  @keyframes die  {to{transform:scale(.25);opacity:0}}\n  @keyframes burst{0%{transform:scale(1);opacity:1}60%{transform:scale(1.5);opacity:.85}100%{transform:scale(2.1);opacity:0}}\n\n  /* ---------- 侧栏 ---------- */\n  .panel{width:280px;flex:0 0 auto}\n  .card{background:#fff;border-radius:18px;padding:18px;border:1px solid #2b3550;box-shadow:0 10px 28px rgba(0,0,0,.30)}\n  .card + .card{margin-top:13px}\n\n  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b98b8;font-weight:700}\n  .floorRow{display:flex;align-items:baseline;gap:10px;margin-top:6px}\n  .floorRow .num{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}\n  .floorRow .unit{font-size:13px;color:#8b98b8;font-weight:600}\n\n  .door{\n    margin-top:14px;display:flex;align-items:center;gap:12px;\n    background:linear-gradient(135deg,#1b2136,#243052);\n    border:1px solid #5a4526;border-radius:14px;padding:12px 14px;\n  }\n  .door .key{font-size:24px;font-weight:800;color:#ffd24a;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n  .door .lbl{font-size:11px;color:#8b98b8;font-weight:700;letter-spacing:.08em}\n  .door .tip{font-size:11.5px;color:#8b98b8;margin-top:2px}\n\n  .barWrap{margin-top:14px}\n  .barTop{display:flex;justify-content:space-between;font-size:12px;color:#8b98b8;font-weight:600;margin-bottom:6px}\n  .bar{height:9px;border-radius:9px;background:#2b3550;overflow:hidden}\n  .bar > i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#4ecca3,#3aa882);transition:width .25s}\n  .bar.low > i{background:linear-gradient(90deg,#ff9f43,#e94560)}\n\n  .scoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}\n  .sc{background:#1b2136;border-radius:12px;padding:9px 6px;text-align:center}\n  .sc b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}\n  .sc span{font-size:11px;color:#8b98b8}\n\n  .btns{display:flex;gap:8px;margin-top:13px}\n  button{\n    flex:1;font:inherit;font-size:13px;font-weight:700;cursor:pointer;\n    border-radius:11px;padding:10px 8px;border:1px solid #2b3550;background:#fff;color:#c3d0e6;transition:.16s;\n  }\n  button:hover{background:#1b2136;transform:translateY(-1px)}\n  button.primary{background:#c87e12;border-color:#c87e12;color:#fff;box-shadow:0 6px 16px rgba(78,204,163,.30)}\n  button.primary:hover{background:#b96f0a}\n\n  .help{margin-top:13px;font-size:12px;line-height:1.85;color:#8b98b8}\n  .help b{color:#c3d0e6}\n  .keys{display:inline-block;background:#1b2136;border:1px solid #2b3550;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;color:#93a2c0}\n\n  /* ---------- 提示条 ---------- */\n  #toast{\n    position:fixed;left:50%;top:34px;transform:translate(-50%,-16px);\n    background:#e6f0ff;color:#fff;font-size:14px;font-weight:700;\n    padding:11px 22px;border-radius:99px;opacity:0;pointer-events:none;\n    transition:.28s;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.60);\n  }\n  #toast.on{opacity:1;transform:translate(-50%,0)}\n\n  /* ---------- 结束弹层 ---------- */\n  .overlay{position:fixed;inset:0;background:rgba(6,8,18,.86);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:20px}\n  .overlay.on{display:grid;animation:fade .22s}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .modal{background:#fff;border-radius:22px;padding:28px 30px;text-align:center;max-width:370px;width:100%;\n         box-shadow:0 30px 70px rgba(0,0,0,.72);animation:pop2 .28s cubic-bezier(.2,1.3,.4,1)}\n  @keyframes pop2{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}\n  .modal h2{margin:0 0 8px;font-size:23px}\n  .modal p{margin:0 0 20px;color:#8b98b8;font-size:13.5px;line-height:1.75}\n  .modal p b{color:#c87e12;font-size:17px}\n\n  @media (max-width:720px){\n    .app{flex-direction:column;align-items:center}\n    .panel{width:100%;max-width:420px}\n  }\n\n  /* ===================== 像素街机主题 · 统一风格 ===================== */\n  body{\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace !important;\n    color:#e6f0ff !important;\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(78,204,163,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(233,69,96,.08) 0%, rgba(233,69,96,0) 60%),\n      #0d0d1a !important;\n  }\n  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;border-radius:4px !important}\n  #board{border-radius:0 !important}\n  h1,h2,h3{color:#e6f0ff !important}\n  .eyebrow{color:#4ecca3 !important;font-weight:700 !important;letter-spacing:.2em !important}\n  .tip,.modal p,.help,.enemySub,.empty{color:#93a2c0 !important}\n  .modal p.big{color:#e6f0ff !important}\n  .card,.stage,.board-wrap,.enemy,.modal{border-radius:6px !important}\n  .card,.enemy{\n    background:#141a2e !important;border:3px solid #26304a !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 26px rgba(78,204,163,.07) !important;\n  }\n  .stage,.board-wrap{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.20) !important;\n  }\n  .modal{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 8px 0 #05070f, 0 0 60px rgba(78,204,163,.28) !important;\n  }\n  .overlay{background:rgba(6,8,18,.86) !important;backdrop-filter:blur(3px) !important}\n  .stat,.sc,.floorBadge,.keys,.comboTag,.shieldTag{\n    background:#1b2136 !important;border:1px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:3px !important;\n  }\n  .stat span,.sc span{color:#8b98b8 !important}\n  .keys{border:1px solid #3a4767 !important;color:#e6f0ff !important}\n  .swatch{box-shadow:inset 0 -3px 0 rgba(0,0,0,.4) !important;border-radius:4px !important}\n  button{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:4px !important;font-weight:700 !important;box-shadow:0 3px 0 #05070f !important;\n  }\n  button:hover:not(:disabled){background:#243052 !important;border-color:#4ecca3 !important;color:#e6f0ff !important}\n  button.primary{\n    background:#4ecca3 !important;border-color:#3aa882 !important;color:#0b1220 !important;\n    box-shadow:0 4px 0 #2d6a4f, 0 0 20px rgba(78,204,163,.35) !important;\n  }\n  button.primary:hover:not(:disabled){background:#5fd9b0 !important;border-color:#4ecca3 !important;color:#0b1220 !important}\n\n  /* 数字冒险：棋盘 / 石堆 / 门 / 进度条 / 提示条 —— 全部改成像素阶梯色 */\n  .board{\n    background:#141a2e !important;\n    border:3px solid #4ecca3;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.18) !important;\n    border-radius:6px !important;\n  }\n  .slot{background:#1b2136 !important;border-radius:3px !important;box-shadow:none !important}\n  .tile .face{border-radius:3px !important;box-shadow:0 2px 0 rgba(0,0,0,.45) !important}\n  .tile[data-v=\"2\"]    .face{background:#1e2740 !important;color:#8b98b8 !important}\n  .tile[data-v=\"4\"]    .face{background:#25314f !important;color:#b6c4dd !important}\n  .tile[data-v=\"8\"]    .face{background:#2b4a6b !important;color:#cfe4ff !important}\n  .tile[data-v=\"16\"]   .face{background:#2f6f8f !important;color:#ffffff !important}\n  .tile[data-v=\"32\"]   .face{background:#3ee08a !important;color:#06281a !important}\n  .tile[data-v=\"64\"]   .face{background:#4ecca3 !important;color:#06281a !important}\n  .tile[data-v=\"128\"]  .face{background:#ffd24a !important;color:#2a1f00 !important}\n  .tile[data-v=\"256\"]  .face{background:#ffb347 !important;color:#2a1f00 !important}\n  .tile[data-v=\"512\"]  .face{background:#ff9f43 !important;color:#3a1500 !important}\n  .tile[data-v=\"1024\"] .face{background:#ff7a45 !important;color:#ffffff !important}\n  .tile[data-v=\"2048\"] .face{background:#e94560 !important;color:#ffffff !important;\n                             box-shadow:0 0 22px rgba(233,69,96,.8) !important}\n  .tile[data-v=\"4096\"] .face{background:#c81e3a !important;color:#ffffff !important;\n                             box-shadow:0 0 28px rgba(233,69,96,.95) !important}\n  .tile.rock .face{\n    background:repeating-linear-gradient(45deg,#3a4767 0 7px,#2b3550 7px 14px) !important;\n    box-shadow:inset 0 -3px 0 rgba(0,0,0,.45), inset 0 3px 0 rgba(255,255,255,.10) !important;\n  }\n  .tile.rock .face::after{background:rgba(0,0,0,.35) !important;box-shadow:none !important}\n  .door{\n    background:#1b2136 !important;border:2px solid rgba(255,210,74,.45) !important;\n    border-radius:4px !important;\n  }\n  .door .key{color:#ffd24a !important}\n  .door .lbl{color:#8b98b8 !important}\n  .door .tip{color:#6f7d9c !important}\n  .barWrap .barTop{color:#8b98b8 !important}\n  .bar{background:#2b3550 !important;border-radius:0 !important}\n  .bar > i{background:linear-gradient(90deg,#4ecca3,#3aa882) !important;border-radius:0 !important}\n  .bar.low > i{background:linear-gradient(90deg,#ff9f43,#e94560) !important}\n  .floorRow .num{color:#4ecca3 !important}\n  .floorRow .unit{color:#8b98b8 !important}\n  #toast{\n    background:#141a2e !important;color:#4ecca3 !important;\n    border:2px solid #4ecca3 !important;border-radius:4px !important;\n    box-shadow:0 0 0 1px #05070f, 0 5px 0 #05070f !important;\n  }\n  </style>\n</head>\n<body>\n\n<div class=\"app\">\n  <div class=\"board\" id=\"board\">\n    <div class=\"layer\" id=\"slots\"></div>\n    <div class=\"layer\" id=\"tiles\"></div>\n  </div>\n\n  <aside class=\"panel\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">Number Dungeon · 推盘地牢</div>\n      <div class=\"floorRow\">\n        <span class=\"num\" id=\"floorNum\">1</span>\n        <span class=\"unit\">层 / B<sub>1</sub>F</span>\n      </div>\n\n      <div class=\"door\">\n        <div>\n          <div class=\"lbl\">破 门 所 需</div>\n          <div class=\"tip\">合成出这个数字即可下楼</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div class=\"key\" id=\"targetNum\">16</div>\n      </div>\n\n      <div class=\"barWrap\">\n        <div class=\"barTop\"><span>剩余步数</span><span id=\"moveTxt\">35 / 35</span></div>\n        <div class=\"bar\" id=\"moveBar\"><i></i></div>\n      </div>\n\n      <div class=\"scoreGrid\">\n        <div class=\"sc\"><b id=\"score\">0</b><span>探索值</span></div>\n        <div class=\"sc\"><b id=\"best\">1</b><span>最深抵达</span></div>\n      </div>\n\n      <div class=\"btns\">\n        <button id=\"btnUndo\">撤回一步</button>\n        <button class=\"primary\" id=\"btnRestart\">重新下潜</button>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"help\">\n        <b>方向键 / WASD</b> 推盘，两枚同数字合体成双倍。<br>\n        合出 <b>目标数字</b> 就砸开石门，方块碎裂、下潜一层。<br>\n        <span class=\"keys\">■</span> 石堆不可推动，会把这一行截断。<br>\n        步数耗尽或彻底推不动 = 探索结束。\n      </div>\n    </div>\n  </aside>\n</div>\n\n<div id=\"toast\"></div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"modal\">\n    <h2 id=\"mTitle\">探索结束</h2>\n    <p id=\"mBody\"></p>\n    <button class=\"primary\" id=\"mAgain\" style=\"width:100%\">再来一次</button>\n  </div>\n</div>\n\n<script>\n/* =========================================================\n   数字冒险 —— 2048 推盘 × 地牢层级推进\n   ========================================================= */\nconst SIZE = 4;\nlet CELL = 80;\nconst GAP = 11;\n\nconst tilesEl = document.getElementById('tiles');\nconst slotsEl = document.getElementById('slots');\nconst boardEl = document.getElementById('board');\n\n/* ---------- 状态 ---------- */\nlet tiles = [];        // {id, v, r, c, rock, merged, dead}\nlet nextId = 1;\nlet floor = 1;\nlet floorTarget = 16;\nlet movesLeft = 35, moveLimit = 35;\nlet score = 0;\nlet over = false, busy = false;\nlet history = [];\nlet best = +(localStorage.getItem('nd_best') || 1);\n\n/* ---------- 工具 ---------- */\nconst posOf = (r, c) => `translate(${c * (CELL + GAP)}px, ${r * (CELL + GAP)}px)`;\nfunction tileAt(r, c){\n  for(const t of tiles) if(t.r === r && t.c === c) return t;\n  return null;\n}\nfunction emptyCells(){\n  const out = [];\n  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++) if(!tileAt(r, c)) out.push({r, c});\n  return out;\n}\n\n/* ---------- 楼层初始化 ---------- */\nfunction startFloor(){\n  floorTarget = 8 * Math.pow(2, floor);       // 16, 32, 64, 128 ...\n  moveLimit   = 35 + 12 * floor;\n  movesLeft   = moveLimit;\n\n  // 清理旧石堆，按层数重新铺\n  tiles = tiles.filter(t => !t.rock);\n  const wantRocks = Math.min(4, Math.floor((floor - 1) / 2));\n  let emp = emptyCells();\n  for(let i = 0; i < wantRocks && emp.length; i++){\n    const k = Math.floor(Math.random() * emp.length);\n    const p = emp.splice(k, 1)[0];\n    tiles.push({id: nextId++, v: 0, r: p.r, c: p.c, rock: true, merged: false, dead: false});\n  }\n}\n\nfunction newGame(){\n  tiles = []; nextId = 1; floor = 1; score = 0; over = false; history = [];\n  startFloor();\n  spawn(); spawn();\n  document.getElementById('overlay').classList.remove('on');\n  render(); updateHUD();\n}\n\n/* ---------- 生成新方块 ---------- */\nfunction spawn(){\n  const emp = emptyCells();\n  if(!emp.length) return;\n  const p = emp[Math.floor(Math.random() * emp.length)];\n  tiles.push({\n    id: nextId++, v: Math.random() < 0.9 ? 2 : 4,\n    r: p.r, c: p.c, rock: false, merged: false, dead: false\n  });\n}\n\n/* ---------- 取每一行/列的推进顺序（靠墙端在前） ---------- */\nfunction getLines(dir){\n  const lines = [];\n  for(let i = 0; i < SIZE; i++){\n    const L = [];\n    for(let j = 0; j < SIZE; j++){\n      if(dir === 'left')       L.push({r:i, c:j});\n      else if(dir === 'right') L.push({r:i, c:SIZE - 1 - j});\n      else if(dir === 'up')    L.push({r:j, c:i});\n      else                     L.push({r:SIZE - 1 - j, c:i});\n    }\n    lines.push(L);\n  }\n  return lines;\n}\n\n/* ---------- 推盘 ---------- */\nfunction doMove(dir){\n  if(over || busy) return;\n  const snapshot = tiles.map(t => ({id:t.id, v:t.v, r:t.r, c:t.c, rock:t.rock}));\n\n  for(const t of tiles){ t.merged = false; t.dead = false; }\n  let moved = false, gained = 0;\n\n  for(const line of getLines(dir)){\n    // 石堆把一整行切成若干段，段内独立滑动\n    const segs = [];\n    let seg = [];\n    for(const p of line){\n      const t = tileAt(p.r, p.c);\n      if(t && t.rock){ if(seg.length) segs.push(seg); seg = []; }\n      else seg.push(p);\n    }\n    if(seg.length) segs.push(seg);\n\n    for(const s of segs){\n      const ts = s.map(p => tileAt(p.r, p.c)).filter(Boolean);\n      const out = [];\n      for(let i = 0; i < ts.length; i++){\n        if(i + 1 < ts.length && ts[i].v === ts[i + 1].v){\n          ts[i].v *= 2;\n          ts[i].merged = true;\n          ts[i + 1].dead = true;\n          gained += ts[i].v;\n          out.push(ts[i]); i++;\n        } else out.push(ts[i]);\n      }\n      out.forEach((t, i) => {\n        if(t.r !== s[i].r || t.c !== s[i].c){ t.r = s[i].r; t.c = s[i].c; moved = true; }\n      });\n      if(out.some(t => t.merged)) moved = true;\n    }\n  }\n\n  if(!moved) return;                    // 无效操作：不扣步、不生成\n\n  history.push(snapshot);\n  if(history.length > 60) history.shift();\n\n  tiles = tiles.filter(t => !t.dead);\n  score += gained;\n  movesLeft--;\n\n  busy = true;\n  render(); updateHUD();\n\n  setTimeout(() => { busy = false; afterMove(); }, 130);\n}\n\nfunction afterMove(){\n  // 1) 是否砸开石门\n  const cand = tiles.filter(t => !t.rock && t.v >= floorTarget).sort((a, b) => b.v - a.v);\n  if(cand.length){\n    const big = cand[0];\n    big.burst = true;\n    render();\n    const el = els.get(big.id);\n    if(el){ el.classList.add('burst'); }\n    setTimeout(() => {\n      tiles = tiles.filter(t => t.id !== big.id);\n      floor++;\n      score += floorTarget * 2;\n      if(floor > best){ best = floor; localStorage.setItem('nd_best', best); }\n      startFloor();\n      render(); updateHUD();\n      toast(`破门！下潜至第 ${floor} 层`);\n    }, 380);\n    return;\n  }\n\n  // 2) 生成新方块\n  spawn();\n  render(); updateHUD();\n\n  // 3) 结束判定\n  setTimeout(() => {\n    if(movesLeft <= 0) finish('力 竭', '步数耗尽，石门没能砸开。');\n    else if(!hasMove()) finish('困 死', '盘面彻底推不动了。');\n  }, 200);\n}\n\nfunction hasMove(){\n  if(emptyCells().length) return true;\n  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++){\n    const t = tileAt(r, c);\n    if(!t || t.rock) continue;\n    for(const [dr, dc] of [[0,1],[1,0]]){\n      const o = tileAt(r + dr, c + dc);\n      if(o && !o.rock && o.v === t.v) return true;\n    }\n  }\n  return false;\n}\n\n/* ---------- 渲染 ---------- */\nconst els = new Map();\n\nfunction buildSlots(){\n  slotsEl.innerHTML = '';\n  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++){\n    const d = document.createElement('div');\n    d.className = 'slot';\n    d.style.transform = posOf(r, c);\n    slotsEl.appendChild(d);\n  }\n}\n\nfunction render(){\n  const seen = new Set();\n  for(const t of tiles){\n    seen.add(t.id);\n    let el = els.get(t.id);\n    if(!el){\n      el = document.createElement('div');\n      el.className = 'tile' + (t.rock ? ' rock' : '');\n      el.innerHTML = '<div class=\"face\"></div>';\n      el.style.transform = posOf(t.r, t.c);\n      tilesEl.appendChild(el);\n      els.set(t.id, el);\n      el.classList.add('spawn');\n      setTimeout(() => el.classList.remove('spawn'), 220);\n    } else {\n      el.style.transform = posOf(t.r, t.c);\n    }\n    el.dataset.v = t.rock ? 'rock' : Math.min(t.v, 4096);\n    const face = el.firstChild;\n    if(!t.rock){\n      const txt = String(t.v);\n      if(face.textContent !== txt) face.textContent = txt;\n    }\n    // pop 动画需要先移除再强制重排才会重播\n    const wantPop = !!(t.merged && !t.rock);\n    if(el.classList.contains('pop') !== wantPop){\n      el.classList.remove('pop');\n      void el.offsetWidth;\n      if(wantPop) el.classList.add('pop');\n    }\n  }\n  for(const [id, el] of Array.from(els)){\n    if(!seen.has(id)){\n      els.delete(id);\n      el.classList.add('dead');\n      setTimeout(() => el.remove(), 260);\n    }\n  }\n}\n\n/* ---------- HUD ---------- */\nfunction updateHUD(){\n  document.getElementById('floorNum').textContent = floor;\n  document.getElementById('targetNum').textContent = floorTarget;\n  document.getElementById('moveTxt').textContent = Math.max(0, movesLeft) + ' / ' + moveLimit;\n  const pct = Math.max(0, movesLeft) / moveLimit * 100;\n  const bar = document.getElementById('moveBar');\n  bar.querySelector('i').style.width = pct + '%';\n  bar.classList.toggle('low', pct <= 30);\n  document.getElementById('score').textContent = score;\n  document.getElementById('best').textContent = best;\n}\n\nlet toastTimer = null;\nfunction toast(msg){\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('on'), 1400);\n}\n\nfunction finish(title, msg){\n  over = true;\n  document.getElementById('mTitle').textContent = title;\n  document.getElementById('mBody').innerHTML =\n    `${msg}<br>最深抵达 <b>第 ${best} 层</b> · 探索值 <b>${score}</b>`;\n  document.getElementById('overlay').classList.add('on');\n}\n\n/* ---------- 输入 ---------- */\nconst KEYMAP = {\n  ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',\n  a:'left', d:'right', w:'up', s:'down',\n  A:'left', D:'right', W:'up', S:'down'\n};\nwindow.addEventListener('keydown', e => {\n  const dir = KEYMAP[e.key];\n  if(dir){ e.preventDefault(); doMove(dir); }\n}, {passive:false});\n\nlet touchX = 0, touchY = 0, touching = false;\nboardEl.addEventListener('touchstart', e => {\n  touching = true;\n  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;\n}, {passive:true});\nboardEl.addEventListener('touchend', e => {\n  if(!touching) return;\n  touching = false;\n  const dx = e.changedTouches[0].clientX - touchX;\n  const dy = e.changedTouches[0].clientY - touchY;\n  if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;\n  doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));\n}, {passive:true});\n\n/* ---------- 撤回 ---------- */\ndocument.getElementById('btnUndo').onclick = () => {\n  if(over || busy || !history.length) return;\n  const snap = history.pop();\n  tiles = snap.map(t => ({id:t.id, v:t.v, r:t.r, c:t.c, rock:t.rock, merged:false, dead:false}));\n  over = false;\n  render(); updateHUD();\n};\n\ndocument.getElementById('btnRestart').onclick = () => newGame();\ndocument.getElementById('mAgain').onclick = () => newGame();\n\n/* ---------- 自适应尺寸 ---------- */\nfunction layout(){\n  const avail = Math.min(430, window.innerWidth - 46);\n  let cell = Math.floor((avail - 5 * GAP) / SIZE);\n  cell = Math.max(54, Math.min(84, cell));\n  CELL = cell;\n  document.documentElement.style.setProperty('--cell', cell + 'px');\n  buildSlots();\n  render();\n}\nwindow.addEventListener('resize', layout);\n\n/* ---------- 启动 ---------- */\nlayout();\nnewGame();\n<\/script>\n</body>\n</html>\n"
  },
  {
    "id": "match",
    "name": "地牢消消乐",
    "tag": "三消线",
    "tip": "点相邻两格交换，连锁到第 3 波触发暴击",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>地牢消消乐 · Dungeon Match</title>\n<style>\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  body{\n    margin:0;padding:24px 18px;min-height:100vh;\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace;\n    color:#e6f0ff;\n    background:\n      radial-gradient(880px 500px at 8% -10%, rgba(78,204,163,.10) 0%, rgba(236,228,255,0) 62%),\n      radial-gradient(760px 480px at 96% 106%, rgba(233,69,96,.09) 0%, rgba(255,232,224,0) 58%),\n      #0d0d1a;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1020px;width:100%}\n  .main{display:flex;flex-direction:column;gap:12px;width:auto}\n\n  /* ---------- 敌人 ---------- */\n  .enemy{\n    background:#fff;border-radius:18px;padding:14px 16px;border:1px solid #26304a;\n    box-shadow:0 10px 30px rgba(0,0,0,.45);\n  }\n  .enemyTop{display:flex;align-items:center;gap:10px}\n  .avatar{\n    width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;\n    font-size:20px;font-weight:800;color:#fff;background:#8a7ab5;\n  }\n  .avatar.boss{background:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,.16)}\n  .enemyName{font-size:15px;font-weight:700;line-height:1.2}\n  .enemySub{font-size:11.5px;color:#8b98b8;margin-top:2px}\n  .floorBadge{\n    margin-left:auto;background:#1b2136;border-radius:9px;padding:5px 10px;\n    font-size:12px;font-weight:700;color:#93a2c0;white-space:nowrap;\n  }\n  .floorBadge.boss{background:#3a1620;color:#ff8fa3}\n\n  .hpbar{height:13px;border-radius:13px;background:#26304a;overflow:hidden;margin-top:11px;position:relative}\n  .hpbar > i{display:block;height:100%;border-radius:13px;background:linear-gradient(90deg,#f0708a,#c81e3a);transition:width .28s}\n  .hpbar > span{\n    position:absolute;inset:0;display:grid;place-items:center;\n    font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);\n  }\n\n  .atkRow{display:flex;align-items:center;gap:7px;margin-top:11px}\n  .atkRow .lbl{font-size:11.5px;color:#8b98b8;font-weight:600;flex:0 0 auto}\n  .pips{display:flex;gap:4px}\n  .pip{width:15px;height:15px;border-radius:5px;background:#26304a;transition:.18s}\n  .pip.on{background:#ff9f43}\n  .pip.now{background:#e94560;box-shadow:0 0 0 2px rgba(233,69,96,.20)}\n\n  /* ---------- 棋盘 ---------- */\n  .stage{position:relative;background:#fff;border-radius:20px;padding:12px;\n         box-shadow:0 16px 44px rgba(0,0,0,.55), 0 2px 6px rgba(35,30,90,.05);border:1px solid #26304a}\n  canvas{display:block;border-radius:14px;touch-action:none}\n\n  /* ---------- 连击条 ---------- */\n  .comboWrap{height:38px;display:flex;align-items:center;justify-content:center;gap:10px}\n  .comboTag{\n    font-size:13px;font-weight:700;color:#a095c8;opacity:0;transition:.2s;\n    background:#1b2136;border-radius:99px;padding:6px 16px;\n  }\n  .comboTag.on{opacity:1}\n  .comboTag.crit{color:#fff;background:#e94560;box-shadow:0 6px 18px rgba(233,69,96,.34);animation:critpop .4s}\n  @keyframes critpop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}\n\n  /* ---------- 侧栏 ---------- */\n  .panel{width:270px;flex:0 0 auto}\n  .card{background:#fff;border-radius:18px;padding:16px;border:1px solid #26304a;box-shadow:0 10px 30px rgba(0,0,0,.40)}\n  .card + .card{margin-top:12px}\n  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b98b8;font-weight:600}\n\n  .heroHp{display:flex;align-items:baseline;gap:6px;margin-top:9px}\n  .heroHp b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1}\n  .heroHp span{font-size:12px;color:#8b98b8}\n  .shieldTag{\n    margin-left:auto;font-size:12px;font-weight:700;color:#54e0e0;\n    background:#0f2a38;border-radius:8px;padding:3px 9px;opacity:0;transition:.2s;\n  }\n  .shieldTag.on{opacity:1}\n\n  .statRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}\n  .sc{background:#1b2136;border-radius:11px;padding:8px 6px;text-align:center}\n  .sc b{display:block;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.25}\n  .sc span{font-size:11px;color:#8b98b8}\n\n  .energyRow{display:flex;gap:4px;margin-top:12px}\n  .ed{flex:1;height:9px;border-radius:4px;background:#2b3550;transition:.18s}\n  .ed.on{background:#ffd24a}\n\n  button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:11px;\n         padding:10px 8px;border:1px solid #2b3550;background:#fff;color:#c3d0e6;transition:.16s}\n  button:hover:not(:disabled){background:#1b2136;transform:translateY(-1px)}\n  button:disabled{opacity:.4;cursor:not-allowed}\n  button.primary{background:#8a7ab5;border-color:#8a7ab5;color:#fff;box-shadow:0 6px 16px rgba(124,92,245,.3)}\n  button.primary:hover:not(:disabled){background:#6a5a95}\n  #btnSkill{width:100%;margin-top:12px}\n\n  .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;min-height:26px}\n  .item{\n    font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 9px;\n    background:#1b2136;color:#93a2c0;border:1px solid #2b3550;\n  }\n  .item.rare{background:#14283a;color:#2f9fa8;border-color:#2b4a6b}\n  .item.epic{background:#3a2a10;color:#c99a1e;border-color:#5a4526}\n  .empty{font-size:12px;color:#6f7d9c;padding:4px 0}\n\n  /* ---------- 弹层 ---------- */\n  .overlay{position:fixed;inset:0;background:rgba(6,8,18,.86);backdrop-filter:blur(5px);\n           display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}\n  .overlay.hide{display:none}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .modal{background:#fff;border-radius:22px;padding:26px 28px;text-align:center;max-width:560px;width:100%;\n         box-shadow:0 30px 70px rgba(0,0,0,.72);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}\n  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}\n  .modal h2{margin:0 0 6px;font-size:22px}\n  .modal p{margin:0 0 18px;color:#93a2c0;font-size:13.5px;line-height:1.7}\n  .modal p b{color:#8a7ab5}\n  .choices{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}\n  .choice{\n    flex:1 1 150px;max-width:172px;background:#1b2136;border:1.5px solid #2b3550;border-radius:15px;\n    padding:15px 13px;cursor:pointer;transition:.16s;text-align:left;\n  }\n  .choice:hover{transform:translateY(-3px);border-color:#5a4a8a;box-shadow:0 12px 26px rgba(90,70,200,.14)}\n  .choice .rn{font-size:10.5px;font-weight:800;letter-spacing:.1em;margin-bottom:6px}\n  .choice .nm{font-size:14.5px;font-weight:800;margin-bottom:5px}\n  .choice .ds{font-size:12px;color:#93a2c0;line-height:1.55}\n  .choice.common .rn{color:#8b98b8}\n  .choice.rare .rn{color:#2f9fa8}\n  .choice.epic .rn{color:#c99a1e}\n\n  @media (max-width:760px){\n    .app{flex-direction:column;align-items:center}\n    .panel{width:100%;max-width:440px}\n  }\n\n  /* ===================== 像素街机主题 · 统一风格 ===================== */\n  body{\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace !important;\n    color:#e6f0ff !important;\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(78,204,163,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(233,69,96,.08) 0%, rgba(233,69,96,0) 60%),\n      #0d0d1a !important;\n  }\n  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;border-radius:4px !important}\n  #board{border-radius:0 !important}\n  h1,h2,h3{color:#e6f0ff !important}\n  .eyebrow{color:#4ecca3 !important;font-weight:700 !important;letter-spacing:.2em !important}\n  .tip,.modal p,.help,.enemySub,.empty{color:#93a2c0 !important}\n  .modal p.big{color:#e6f0ff !important}\n  .card,.stage,.board-wrap,.enemy,.modal{border-radius:6px !important}\n  .card,.enemy{\n    background:#141a2e !important;border:3px solid #26304a !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 26px rgba(78,204,163,.07) !important;\n  }\n  .stage,.board-wrap{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.20) !important;\n  }\n  .modal{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 8px 0 #05070f, 0 0 60px rgba(78,204,163,.28) !important;\n  }\n  .overlay{background:rgba(6,8,18,.86) !important;backdrop-filter:blur(3px) !important}\n  .stat,.sc,.floorBadge,.keys,.comboTag,.shieldTag{\n    background:#1b2136 !important;border:1px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:3px !important;\n  }\n  .stat span,.sc span{color:#8b98b8 !important}\n  .keys{border:1px solid #3a4767 !important;color:#e6f0ff !important}\n  .swatch{box-shadow:inset 0 -3px 0 rgba(0,0,0,.4) !important;border-radius:4px !important}\n  button{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:4px !important;font-weight:700 !important;box-shadow:0 3px 0 #05070f !important;\n  }\n  button:hover:not(:disabled){background:#243052 !important;border-color:#4ecca3 !important;color:#e6f0ff !important}\n  button.primary{\n    background:#4ecca3 !important;border-color:#3aa882 !important;color:#0b1220 !important;\n    box-shadow:0 4px 0 #2d6a4f, 0 0 20px rgba(78,204,163,.35) !important;\n  }\n  button.primary:hover:not(:disabled){background:#5fd9b0 !important;border-color:#4ecca3 !important;color:#0b1220 !important}\n\n  /* 地牢消消乐：敌人条 / 血条 / 连击 / 能量 / 掉落卡 */\n  .avatar{background:#8a7ab5 !important;border-radius:4px !important}\n  .avatar.boss{background:#e94560 !important;border-radius:4px !important;box-shadow:0 0 0 3px rgba(233,69,96,.22) !important}\n  .floorBadge.boss{background:#3a1620 !important;color:#ff8fa3 !important}\n  .hpbar{background:#2b3550 !important;border-radius:0 !important;border:1px solid #3a4767}\n  .hpbar > i{background:linear-gradient(90deg,#f0708a,#c81e3a) !important;border-radius:0 !important}\n  .hpbar > span{text-shadow:0 1px 2px rgba(0,0,0,.8) !important}\n  .pip{background:#2b3550 !important;border-radius:2px !important}\n  .pip.on{background:#ff9f43 !important}\n  .pip.now{background:#e94560 !important;box-shadow:0 0 0 2px rgba(233,69,96,.3) !important}\n  .comboTag{color:#b0a3d8 !important}\n  .comboTag.crit{background:#e94560 !important;color:#fff !important;border-color:#c81e3a !important}\n  .ed{background:#2b3550 !important;border-radius:0 !important}\n  .ed.on{background:#ffd24a !important;box-shadow:0 0 8px rgba(255,210,74,.7) !important}\n  #hHpFill{background:linear-gradient(90deg,#4ecca3,#3aa882) !important}\n  .heroHp b{color:#e6f0ff !important}\n  .shieldTag{color:#54e0e0 !important;background:#14283a !important}\n  .item.rare{background:#14283a !important;color:#54e0e0 !important;border-color:#2b4a6b !important}\n  .item.epic{background:#3a2a10 !important;color:#ffd24a !important;border-color:#5a4526 !important}\n  .modal p b{color:#4ecca3 !important}\n  .choice{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;border-radius:6px !important;\n  }\n  .choice:hover{transform:translateY(-3px);border-color:#4ecca3 !important;\n                box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 26px rgba(78,204,163,.22) !important}\n  .choice .ds{color:#93a2c0 !important}\n  .choice .nm{color:#e6f0ff !important}\n  .choice.common .rn{color:#8b98b8 !important}\n  .choice.rare .rn{color:#54e0e0 !important}\n  .choice.epic .rn{color:#ffd24a !important}\n  </style>\n</head>\n<body>\n\n<div class=\"app\">\n  <div class=\"main\">\n    <div class=\"enemy\">\n      <div class=\"enemyTop\">\n        <div class=\"avatar\" id=\"eAvatar\">1</div>\n        <div>\n          <div class=\"enemyName\" id=\"eName\">石壁守卫</div>\n          <div class=\"enemySub\" id=\"eSub\">普通 · 第 1 层</div>\n        </div>\n        <div class=\"floorBadge\" id=\"eBadge\">第 1 层</div>\n      </div>\n      <div class=\"hpbar\">\n        <i id=\"eHpFill\" style=\"width:100%\"></i>\n        <span id=\"eHpText\">58 / 58</span>\n      </div>\n      <div class=\"atkRow\">\n        <span class=\"lbl\">攻击倒计时</span>\n        <div class=\"pips\" id=\"ePips\"></div>\n      </div>\n    </div>\n\n    <div class=\"stage\"><canvas id=\"cv\"></canvas></div>\n\n    <div class=\"comboWrap\"><div class=\"comboTag\" id=\"comboTag\">连击 ×1</div></div>\n  </div>\n\n  <aside class=\"panel\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">Hero · 英雄</div>\n      <div class=\"heroHp\">\n        <b id=\"hHp\">70</b><span>/ <i id=\"hMax\">70</i></span>\n        <span class=\"shieldTag\" id=\"hShield\">护盾 0</span>\n      </div>\n      <div class=\"hpbar\" style=\"margin-top:9px\">\n        <i id=\"hHpFill\" style=\"width:100%;background:linear-gradient(90deg,#4ecca3,#3ee08a)\"></i>\n      </div>\n      <div class=\"statRow\">\n        <div class=\"sc\"><b id=\"hAtk\">4.5</b><span>攻击</span></div>\n        <div class=\"sc\"><b id=\"hFloor\">1</b><span>层数</span></div>\n      </div>\n      <div class=\"energyRow\" id=\"energyRow\"></div>\n      <button class=\"primary\" id=\"btnSkill\" disabled>技能 · 蓄力中</button>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"eyebrow\">Relics · 已获强化</div>\n      <div class=\"items\" id=\"itemList\"><div class=\"empty\">击败敌人后掉落装备</div></div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"eyebrow\" style=\"margin-bottom:8px\">Gem · 宝石效果</div>\n      <div class=\"items\">\n        <span class=\"item\" style=\"background:#3a1620;color:#ff8fa3;border-color:#5a2a34\">红 伤害</span>\n        <span class=\"item\" style=\"background:#0f2a38;color:#2f9fa8;border-color:#2b4a6b\">蓝 护盾</span>\n        <span class=\"item\" style=\"background:#0f2e25;color:#3ee08a;border-color:#26543f\">绿 治疗</span>\n        <span class=\"item\" style=\"background:#33280f;color:#c99a1e;border-color:#f6e3c4\">黄 能量</span>\n      </div>\n    </div>\n  </aside>\n</div>\n\n<div class=\"overlay hide\" id=\"overlay\">\n  <div class=\"modal\" id=\"modal\"></div>\n</div>\n\n<script>\n/* =========================================================\n   地牢消消乐 —— 三消驱动的地牢战斗\n   棋盘用「格为单位」的浮点坐标，缩放窗口不会错位。\n   ========================================================= */\nconst C = 7, R = 7;\nconst COLORS = ['red','blue','green','amber'];\nconst GEM = {\n  red  : {main:'#e94560', dark:'#c81e3a', light:'#ffb8c4', name:'红'},\n  blue : {main:'#54e0e0', dark:'#2f9fa8', light:'#a8f0f0', name:'蓝'},\n  green: {main:'#3ee08a', dark:'#2d6a4f', light:'#a8f0d0', name:'绿'},\n  amber: {main:'#ffd24a', dark:'#c99a1e', light:'#ffe9a8', name:'黄'}\n};\n\n/* ---------- 数值调参集中在这里 ---------- */\nconst TUNE = {\n  heroHp      : 70,\n  heroAtk     : 4.5,\n  shieldPerGem: 3,\n  healPerGem  : 3,\n  critAt      : 3,      // 连锁到第 3 波开始暴击\n  critMult    : 2,\n  energyMax   : 12,\n  skillScale  : 1.0,    // 技能伤害 = 攻击 × 能量 × 该系数\n  dmgScale    : 1.5,    // 每颗红宝石伤害 = 攻击 × 该系数\n  gravityEase : 70      // 越小下落越快\n};\n\nconst ENEMY_NAMES = ['石壁守卫','腐骨弓手','铁笼恶犬','幽影法师','熔渣巨像',\n                     '碎颅者','黯晶督军','虚空织者','无面判官','深渊之主'];\n\nfunction enemyFor(floor){\n  const boss = floor % 5 === 0;\n  const base = ENEMY_NAMES[(floor - 1) % ENEMY_NAMES.length];\n  return {\n    name : boss ? '★ ' + base : base,\n    boss,\n    max  : Math.round((30 + floor * 22) * (boss ? 2.2 : 1) * Math.pow(1.06, floor)),\n    atk  : Math.round((5 + floor * 3.1) * (boss ? 1.5 : 1)),\n    interval: Math.max(3, 5 - Math.floor((floor - 1) / 4))\n  };\n}\n\n/* ---------- 状态 ---------- */\nlet grid, sprites, floats, puffs;\nlet sel = null, busy = false, floorNo = 1, over = false;\nlet hero, enemy, mods, energy, anim = 0, scaleT = 0;\nlet CELL = 58, shake = 0;\nlet uid = 1;\n\nconst cv  = document.getElementById('cv');\nconst ctx = cv.getContext('2d');\n\nconst wait = ms => new Promise(res => setTimeout(res, ms));\nconst randColor = () => COLORS[Math.floor(Math.random() * COLORS.length)];\n\nfunction makeGem(color, r, c, y){\n  return { id: uid++, color, r, c, x: c, y: (y === undefined ? r : y),\n           dead:false, deadT:0, sc:1, flash:0 };\n}\n\n/* ---------- 开局铺盘（不允许一上来就有三连） ---------- */\nfunction initBoard(){\n  grid = []; sprites = []; floats = []; puffs = [];\n  for(let r = 0; r < R; r++){\n    grid.push(new Array(C).fill(null));\n    for(let c = 0; c < C; c++){\n      let col, guard = 0;\n      do{\n        col = randColor(); guard++;\n      } while(guard < 50 && (\n        (c >= 2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].color === col && grid[r][c-2].color === col) ||\n        (r >= 2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].color === col && grid[r-2][c].color === col)\n      ));\n      const s = makeGem(col, r, c);\n      grid[r][c] = s;\n      sprites.push(s);\n    }\n  }\n  if(!hasMove()) shuffleBoard();\n}\n\n/* ---------- 找出所有 ≥3 连 ---------- */\nfunction findMatches(){\n  const hits = new Set();\n  const groups = [];\n  for(let r = 0; r < R; r++){\n    let run = 1;\n    for(let c = 1; c <= C; c++){\n      const same = c < C && grid[r][c] && grid[r][c-1] && grid[r][c].color === grid[r][c-1].color;\n      if(same) run++;\n      else{\n        if(run >= 3){\n          const g = [];\n          for(let k = c - run; k < c; k++){ hits.add(r + ',' + k); g.push([r, k]); }\n          groups.push({cells:g, len:run, dir:'h'});\n        }\n        run = 1;\n      }\n    }\n  }\n  for(let c = 0; c < C; c++){\n    let run = 1;\n    for(let r = 1; r <= R; r++){\n      const same = r < R && grid[r][c] && grid[r-1][c] && grid[r][c].color === grid[r-1][c].color;\n      if(same) run++;\n      else{\n        if(run >= 3){\n          const g = [];\n          for(let k = r - run; k < r; k++){ hits.add(k + ',' + c); g.push([k, c]); }\n          groups.push({cells:g, len:run, dir:'v'});\n        }\n        run = 1;\n      }\n    }\n  }\n  return {hits, groups};\n}\n\n/* ---------- 是否还有可走的步 ---------- */\nfunction hasMove(){\n  const test = (r1, c1, r2, c2) => {\n    const t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t;\n    const ok = findMatches().hits.size > 0;\n    const t2 = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t2;\n    return ok;\n  };\n  for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){\n    if(c + 1 < C && test(r, c, r, c + 1)) return true;\n    if(r + 1 < R && test(r, c, r + 1, c)) return true;\n  }\n  return false;\n}\n\n/* ---------- 洗牌（无路可走时） ---------- */\nfunction shuffleBoard(){\n  // 收集当前棋盘的「颜色多重集」，洗牌时只重排这些颜色。\n  const pool = [];\n  for(let r = 0; r < R; r++) for(let c = 0; c < C; c++) pool.push(grid[r][c].color);\n\n  // 逐格贪心配色：每次从剩余色池里随机挑一个「不会与本行/本列前两格凑成三连」的颜色。\n  // 比「整体随机重排 + 重试」稳得多 —— 整体重排在只剩 2~3 种颜色时几乎必然凑出三连，\n  // 重试次数用尽就会交出满盘三连的棋盘（反而白送一次连锁）。\n  const build = () => {\n    const left = pool.slice();\n    const out = [];\n    for(let r = 0; r < R; r++){\n      out[r] = [];\n      for(let c = 0; c < C; c++){\n        const ban = new Set();\n        if(c >= 2 && out[r][c-1] === out[r][c-2]) ban.add(out[r][c-1]);\n        if(r >= 2 && out[r-1][c] === out[r-2][c]) ban.add(out[r-1][c]);\n        const cand = [];\n        for(let i = 0; i < left.length; i++) if(!ban.has(left[i])) cand.push(i);\n        const k = cand.length ? cand[Math.floor(Math.random() * cand.length)]\n                              : Math.floor(Math.random() * left.length);\n        out[r][c] = left[k];\n        left.splice(k, 1);\n      }\n    }\n    return out;\n  };\n\n  let guard = 0, board;\n  do{\n    board = build();\n    for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){\n      const s = grid[r][c];\n      s.color = board[r][c];\n      s.flash = 1;\n    }\n  } while(guard++ < 40 && (findMatches().hits.size > 0 || !hasMove()));\n  puffAll();\n}\n\n/* ---------- 交换 ---------- */\nfunction swapCells(r1, c1, r2, c2){\n  const a = grid[r1][c1], b = grid[r2][c2];\n  grid[r1][c1] = b; grid[r2][c2] = a;\n  if(a){ a.r = r2; a.c = c2; }\n  if(b){ b.r = r1; b.c = c1; }\n}\n\n/* ---------- 下落与补充 ---------- */\nfunction applyGravity(){\n  for(let c = 0; c < C; c++){\n    let write = R - 1;\n    for(let r = R - 1; r >= 0; r--){\n      if(grid[r][c]){\n        if(write !== r){\n          grid[write][c] = grid[r][c];\n          grid[r][c] = null;\n          grid[write][c].r = write;\n        }\n        write--;\n      }\n    }\n    for(let r = write; r >= 0; r--){\n      const s = makeGem(randColor(), r, c, r - write - 1);   // 从棋盘上方落入\n      grid[r][c] = s;\n      sprites.push(s);\n    }\n  }\n}\n\n/* ---------- 特效 ---------- */\nfunction puffAll(){\n  for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){\n    const s = grid[r][c];\n    if(s) puffs.push({x:c + .5, y:r + .5, t:0, color:'#6a5a95', n:1});\n  }\n}\nfunction puffAt(c, r, color, n){\n  for(let i = 0; i < (n || 7); i++){\n    const a = Math.random() * 6.283, sp = .4 + Math.random() * 1.9;\n    puffs.push({x:c + .5, y:r + .5, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .4,\n                t:0, color, life:.7 + Math.random()*.4, decay:.032 + Math.random()*.03, size:2 + Math.random()*3});\n  }\n}\nfunction addFloat(c, r, text, color){\n  floats.push({x:c + .5, y:r + .2, text, color, t:0});\n}\n\n/* ---------- 强化词条 ---------- */\nconst RAR_NAME = {common:'普通', rare:'稀有', epic:'史诗'};\nconst ITEMS = [\n  {id:'sword', name:'锈剑',    rar:'common', desc:'攻击 +3',                 apply:m=>{ m.atkFlat += 3; }},\n  {id:'axe',   name:'战斧',    rar:'rare',   desc:'攻击 +6',                 apply:m=>{ m.atkFlat += 6; }},\n  {id:'armor', name:'厚甲',    rar:'common', desc:'最大生命 +20 并回复 20',  apply:m=>{ m.maxHp += 20; hero.hp += 20; }},\n  {id:'mirror',name:'护心镜',  rar:'common', desc:'每颗蓝宝石额外 +2 护盾',  apply:m=>{ m.shieldAdd += 2; }},\n  {id:'herb',  name:'草药袋',  rar:'common', desc:'每颗绿宝石额外 +2 治疗',  apply:m=>{ m.healAdd += 2; }},\n  {id:'core',  name:'能量核心',rar:'rare',   desc:'每颗黄宝石额外 +1 能量',  apply:m=>{ m.energyAdd += 1; }},\n  {id:'fang',  name:'吸血牙',  rar:'rare',   desc:'造成伤害的 25% 转为治疗', apply:m=>{ m.lifesteal += .25; }},\n  {id:'thorn', name:'荆棘甲',  rar:'rare',   desc:'受到伤害时反弹 30%',      apply:m=>{ m.thorns += .3; }},\n  {id:'horn',  name:'狂怒之角',rar:'epic',   desc:'暴击倍率 +100%',          apply:m=>{ m.critMult += 1; }},\n  {id:'charm', name:'连击护符',rar:'epic',   desc:'连击每层额外 +0.5 倍率',  apply:m=>{ m.comboStep += .5; }},\n  {id:'crown', name:'地牢王冠',rar:'epic',   desc:'攻击 ×1.35',              apply:m=>{ m.atkMult *= 1.35; }}\n];\n\nlet owned = [];\n\nfunction baseMods(){\n  return { atkFlat:0, atkMult:1, maxHp:0, shieldAdd:0, healAdd:0, energyAdd:0,\n           critMult:TUNE.critMult, comboStep:.5, lifesteal:0, thorns:0 };\n}\nconst heroMax = () => TUNE.heroHp + mods.maxHp;\nconst heroAtk = () => (TUNE.heroAtk + mods.atkFlat) * mods.atkMult;\n\n/* ---------- 一次消除结算 ---------- */\nfunction applyMatches(hits, combo, ctxInfo){\n  const counts = {red:0, blue:0, green:0, amber:0};\n  let cx = 0, cy = 0;\n  for(const key of hits){\n    const [r, c] = key.split(',').map(Number);\n    const s = grid[r][c];\n    if(!s) continue;\n    counts[s.color]++;\n    cx += c + .5; cy += r + .5;\n    s.dead = true; s.deadT = 0;\n    puffAt(c, r, GEM[s.color].main, 7);\n    grid[r][c] = null;\n  }\n  const n = hits.size || 1;\n  cx /= n; cy /= n;\n\n  /* 连击倍率：线性抬升；达到阈值后叠加暴击 */\n  const crit = combo >= TUNE.critAt;\n  const mult = (1 + mods.comboStep * (combo - 1)) * (crit ? mods.critMult : 1);\n\n  let $dmg = 0, $sh = 0, $hl = 0, $en = 0;\n  if(counts.red)   $dmg = counts.red * heroAtk() * TUNE.dmgScale * mult;\n  if(counts.blue)  $sh  = counts.blue * (TUNE.shieldPerGem + mods.shieldAdd) * mult;\n  if(counts.green) $hl  = counts.green * (TUNE.healPerGem + mods.healAdd) * mult;\n  if(counts.amber) $en  = counts.amber * (1 + mods.energyAdd);   // 能量不随连击膨胀\n\n  let slot = 0;\n  if($dmg > 0){\n    const d = Math.round($dmg);\n    enemy.hp = Math.max(0, enemy.hp - d);\n    addFloat(cx, cy - slot++ * .42, '-' + d, crit ? '#e94560' : '#ff8fa3');\n    if(mods.lifesteal > 0){\n      const back = Math.round(d * mods.lifesteal);\n      hero.hp = Math.min(heroMax(), hero.hp + back);\n      if(back > 0) addFloat(cx, cy - slot++ * .42, '+' + back, '#3ee08a');\n    }\n    shake = Math.min(8, shake + 1.6 + mult * .5);\n  }\n  if($sh > 0){\n    const v = Math.round($sh);\n    hero.shield = Math.min(heroMax(), hero.shield + v);\n    addFloat(cx, cy - slot++ * .42, '+' + v + ' 盾', '#2f9fa8');\n  }\n  if($hl > 0){\n    const v = Math.round($hl);\n    hero.hp = Math.min(heroMax(), hero.hp + v);\n    addFloat(cx, cy - slot++ * .42, '+' + v, '#3ee08a');\n  }\n  if($en > 0){\n    energy = Math.min(TUNE.energyMax, energy + $en);\n  }\n  void ctxInfo;\n  return {counts, mult, crit};\n}\n\n/* ---------- 连锁循环 ---------- */\nasync function resolve(){\n  let combo = 0;\n  while(true){\n    const {hits} = findMatches();\n    if(!hits.size) break;\n    combo++;\n    const r = applyMatches(hits, combo);\n    showCombo(combo, r.crit);\n    syncUI();\n    await wait(175);\n    applyGravity();\n    await wait(255);\n  }\n  await endTurn(combo);\n}\n\nasync function endTurn(combo){\n  void combo;\n  if(enemy.hp <= 0){ await victory(); return; }\n  if(!hasMove()){ shuffleBoard(); await wait(330); }\n\n  enemy.cd--;\n  if(enemy.cd <= 0){\n    enemy.cd = enemy.interval;\n    await enemyAttack();\n    if(enemy.hp <= 0){ await victory(); return; }\n    if(hero.hp <= 0){ await defeat(); return; }\n  }\n  busy = false;\n  syncUI();\n}\n\nasync function enemyAttack(){\n  shake = 11;\n  const raw = enemy.atk;\n  const absorbed = Math.min(hero.shield, raw);\n  hero.shield -= absorbed;\n  const dmg = raw - absorbed;\n  hero.hp = Math.max(0, hero.hp - dmg);\n  addFloat(3.5, 3.2, '-' + raw + (absorbed ? ' (盾 ' + Math.round(absorbed) + ')' : ''), '#e94560');\n  puffAt(3, 3, '#ff9aa8', 14);\n  if(mods.thorns > 0){\n    const back = Math.round(raw * mods.thorns);\n    enemy.hp = Math.max(0, enemy.hp - back);\n    if(back > 0) addFloat(3.5, 3.9, '反弹 ' + back, '#c99a1e');\n  }\n  syncUI();\n  await wait(430);\n}\n\n/* ---------- 掉落 ---------- */\nfunction rollItems(n){\n  const w = floorNo >= 8 ? {common:.25, rare:.50, epic:.25}\n          : floorNo >= 4 ? {common:.45, rare:.45, epic:.10}\n          :                {common:.70, rare:.30, epic:0};\n  const out = [], used = new Set();\n  let guard = 0;\n  while(out.length < n && guard++ < 400){\n    const r = Math.random();\n    const rar = r < w.epic ? 'epic' : (r < w.epic + w.rare ? 'rare' : 'common');\n    const pool = ITEMS.filter(it => it.rar === rar && !used.has(it.id));\n    if(!pool.length) continue;\n    const it = pool[Math.floor(Math.random() * pool.length)];\n    used.add(it.id);\n    out.push(it);\n  }\n  while(out.length < n) out.push(ITEMS[out.length % ITEMS.length]);\n  return out;\n}\n\nfunction victory(){\n  return new Promise(res => {\n    busy = true;\n    syncUI();\n    const picks = rollItems(3);\n    const ov = document.getElementById('overlay');\n    const m  = document.getElementById('modal');\n    m.innerHTML =\n      `<h2>击败 ${enemy.name}</h2>\n       <p>带走一件强化，继续下潜到 <b>第 ${floorNo + 1} 层</b>。</p>\n       <div class=\"choices\">${picks.map((it, i) =>\n         `<div class=\"choice ${it.rar}\" data-i=\"${i}\">\n            <div class=\"rn\">${RAR_NAME[it.rar]}</div>\n            <div class=\"nm\">${it.name}</div>\n            <div class=\"ds\">${it.desc}</div>\n          </div>`).join('')}</div>`;\n    ov.classList.remove('hide');\n    m.querySelectorAll('.choice').forEach(el => {\n      el.onclick = () => {\n        const it = picks[+el.dataset.i];\n        it.apply(mods);\n        owned.push(it);\n        floorNo++;\n        enemy = enemyFor(floorNo);\n        enemy.hp = enemy.max;\n        enemy.cd = enemy.interval;\n        hero.shield = Math.min(heroMax(), hero.shield);\n        hero.hp = Math.min(heroMax(), hero.hp + Math.round(heroMax() * .12));   // 层间休整\n        ov.classList.add('hide');\n        syncUI();\n        busy = false;\n        res();\n      };\n    });\n  });\n}\n\nasync function defeat(){\n  over = true; busy = true;\n  syncUI();\n  await wait(480);\n  const ov = document.getElementById('overlay');\n  const m  = document.getElementById('modal');\n  m.innerHTML =\n    `<h2>倒下了</h2>\n     <p>你在 <b>第 ${floorNo} 层</b> 力竭，收集了 ${owned.length} 件强化。</p>\n     <div class=\"choices\"><div class=\"choice epic\" id=\"again\"\n        style=\"max-width:none;text-align:center\">\n        <div class=\"nm\">重新下潜</div><div class=\"ds\">一切从头开始</div></div></div>`;\n  ov.classList.remove('hide');\n  m.querySelector('#again').onclick = () => start();\n}\n\n/* ---------- 交换 ---------- */\nfunction doSwap(a, b){\n  if(busy || over) return;\n  busy = true;\n  swapCells(a.r, a.c, b.r, b.c);\n  if(!findMatches().hits.size){\n    swapCells(a.r, a.c, b.r, b.c);       // 不构成三连，换回去\n    shake = 3;\n    setTimeout(() => { busy = false; syncUI(); }, 180);\n    return;\n  }\n  puffAt(b.c, b.r, '#5a4a8a', 4);\n  resolve();\n}\n\n/* ---------- 技能（自由行动，不消耗敌人倒计时） ---------- */\nfunction useSkill(){\n  if(busy || over || energy <= 0) return;\n  const dmg = Math.round(heroAtk() * energy * TUNE.skillScale);\n  enemy.hp = Math.max(0, enemy.hp - dmg);\n  addFloat(3.5, 3, '-' + dmg, '#8a7ab5');\n  puffAt(3, 3, '#b0a3d8', 20);\n  energy = 0;\n  shake = 9;\n  syncUI();\n  if(enemy.hp <= 0){ busy = true; victory(); }\n}\ndocument.getElementById('btnSkill').onclick = useSkill;\n\n/* ---------- 连击提示 ---------- */\nlet comboTimer = null;\nfunction showCombo(n, crit){\n  const el = document.getElementById('comboTag');\n  el.textContent = crit ? `暴击！连击 ×${n}` : `连击 ×${n}`;\n  el.classList.toggle('crit', crit);\n  el.classList.add('on');\n  clearTimeout(comboTimer);\n  comboTimer = setTimeout(() => el.classList.remove('on'), 1000);\n}\n\n/* ---------- 侧栏同步 ---------- */\nfunction syncUI(){\n  const hm = heroMax();\n  document.getElementById('hHp').textContent = Math.max(0, Math.round(hero.hp));\n  document.getElementById('hMax').textContent = hm;\n  document.getElementById('hHpFill').style.width = Math.max(0, hero.hp / hm * 100) + '%';\n  const sh = document.getElementById('hShield');\n  sh.textContent = '护盾 ' + Math.round(hero.shield);\n  sh.classList.toggle('on', hero.shield > 0);\n  document.getElementById('hAtk').textContent = heroAtk().toFixed(1);\n  document.getElementById('hFloor').textContent = floorNo;\n\n  document.getElementById('eName').textContent = enemy.name;\n  document.getElementById('eSub').textContent = (enemy.boss ? '首领' : '普通') + ' · 第 ' + floorNo + ' 层';\n  const bg = document.getElementById('eBadge');\n  bg.textContent = '第 ' + floorNo + ' 层';\n  bg.classList.toggle('boss', enemy.boss);\n  const av = document.getElementById('eAvatar');\n  av.textContent = floorNo;\n  av.classList.toggle('boss', enemy.boss);\n  document.getElementById('eHpFill').style.width = Math.max(0, enemy.hp / enemy.max * 100) + '%';\n  document.getElementById('eHpText').textContent =\n    Math.max(0, Math.round(enemy.hp)) + ' / ' + enemy.max;\n\n  const pips = document.getElementById('ePips');\n  const psig = enemy.interval + '|' + enemy.cd;\n  if(pips.dataset.sig !== psig){\n    pips.dataset.sig = psig;\n    let h = '';\n    for(let i = 1; i <= enemy.interval; i++)\n      h += `<span class=\"pip${i <= enemy.cd ? ' on' : ''}${i === enemy.cd ? ' now' : ''}\"></span>`;\n    pips.innerHTML = h;\n  }\n\n  const er = document.getElementById('energyRow');\n  const esig = TUNE.energyMax + '|' + energy;\n  if(er.dataset.sig !== esig){\n    er.dataset.sig = esig;\n    let h = '';\n    for(let i = 0; i < TUNE.energyMax; i++) h += `<span class=\"ed${i < energy ? ' on' : ''}\"></span>`;\n    er.innerHTML = h;\n  }\n\n  const bs = document.getElementById('btnSkill');\n  bs.disabled = energy <= 0 || busy || over;\n  bs.textContent = energy <= 0\n    ? '技能 · 蓄力中'\n    : `技能 · 造成 ${Math.round(heroAtk() * energy * TUNE.skillScale)} 伤害`;\n\n  const il = document.getElemen    ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);\n    shake *= .86;\n  } else shake = 0;\n\n  ctx.fillStyle = '#0d0d1a';\n  ctx.fillRect(0, 0, W, H);\n\n  for(let r = 0; r < R; r++) for(let c = 0; c < C; c++){\n    ctx.fillStyle = (r + c) % 2 ? '#141a2e' : '#161c30';\n    rr(c * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6, CELL * .24);\n    ctx.fill();\n  }\n\n  if(sel && !busy){\n    ctx.strokeStyle = '#8a7ab5';\n    ctx.lineWidth = 3;\n    rr(sel.c * CELL + 3, sel.r * CELL + 3, CELL - 6, CELL - 6, CELL * .24);\n    ctx.stroke();\n  }\n\n  for(const s of sprites){\n    const g = GEM[s.color];\n    const cx = (s.x + .5) * CELL, cy = (s.y + .5) * CELL;\n    const base = CELL * .78 * (s.sc === undefined ? 1 : s.sc);\n    if(base <= .4) continue;\n    const x = cx - base / 2, y = cy - base / 2;\n\n    ctx.globalAlpha = s.dead ? Math.max(0, 1 - s.deadT / 175) : 1;\n    ctx.fillStyle = g.main;\n    rr(x, y, base, base, base * .29);\n    ctx.fill();\n    ctx.fillStyle = g.light;\n    rr(x + base * .16, y + base * .14, base * .42, base * .3, base * .14);\n    ctx.fill();\n    ctx.fillStyle = g.dark;\n    ctx.globalAlpha *= .3;\n    rr(x + base * .17, y + base * .73, base * .66, base * .15, base * .07);\n    ctx.fill();\n    ctx.globalAlpha = 1;\n\n    if(s.flash > 0){\n      ctx.globalAlpha = s.flash * .8;\n      ctx.fillStyle = '#fff';\n      rr(x, y, base, base, base * .29);\n      ctx.fill();\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  for(const p of puffs){\n    ctx.globalAlpha = Math.max(0, 1 - p.t / (p.life * 1000));\n    ctx.fillStyle = p.color;\n    ctx.beginPath();\n    ctx.arc(p.x * CELL, p.y * CELL, p.size * (1 - p.t / (p.life * 1000) * .5), 0, 6.283);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n  for(const o of floats){\n    const k = o.t / 950;\n    ctx.globalAlpha = Math.max(0, 1 - k * k);\n    ctx.font = '800 ' + Math.round(CELL * .38) + 'px \"Courier New\",monospace';\n    ctx.lineWidth = 3.5;\n    ctx.strokeStyle = 'rgba(255,255,255,.95)';\n    ctx.strokeText(o.text, o.x * CELL, (o.y - k * .95) * CELL - 6);\n    ctx.fillStyle = o.color;\n    ctx.fillText(o.text, o.x * CELL, (o.y - k * .95) * CELL - 6);\n  }\n  ctx.globalAlpha = 1;\n  ctx.restore();\n  void dt;\n}\n\n/* ---------- 输入 ---------- */\nfunction cellFromEvent(e){\n  const rect = cv.getBoundingClientRect();\n  const c = Math.floor((e.clientX - rect.left) / (rect.width / C));\n  const r = Math.floor((e.clientY - rect.top) / (rect.height / R));\n  if(r < 0 || c < 0 || r >= R || c >= C) return null;\n  return {r, c};\n}\nlet downCell = null;\ncv.addEventListener('pointerdown', e => {\n  if(busy || over) return;\n  downCell = cellFromEvent(e);\n});\ncv.addEventListener('pointerup', e => {\n  if(busy || over || !downCell) return;\n  const up = cellFromEvent(e), start = downCell;\n  downCell = null;\n  if(!up) return;\n  const adjacent = Math.abs(start.r - up.r) + Math.abs(start.c - up.c) === 1;\n\n  if(up.r === start.r && up.c === start.c){\n    if(sel && sel.r === up.r && sel.c === up.c) sel = null;\n    else if(sel && adjacent){ const a = sel; sel = null; doSwap(a, up); }\n    else sel = up;\n    return;\n  }\n  if(adjacent){ sel = null; doSwap(start, up); }\n});\ncv.addEventListener('pointercancel', () => { downCell = null; });\n\n/* ---------- 主循环 ---------- */\nlet lastTs = 0;\nfunction loop(ts){\n  requestAnimationFrame(loop);\n  if(!lastTs) lastTs = ts;\n  const dt = Math.min(50, ts - lastTs);\n  lastTs = ts;\n  anim += dt;\n  stepSprites(dt);\n  stepFx(dt);\n  render(dt);\n}\n\n/* ---------- 开局 ---------- */\nfunction start(){\n  floorNo = 1;\n  mods = baseMods();\n  hero = { hp: TUNE.heroHp, shield: 0 };\n  energy = 0;\n  owned = [];\n  over = false; busy = false; sel = null; downCell = null; shake = 0;\n  enemy = enemyFor(floorNo);\n  enemy.hp = enemy.max;\n  enemy.cd = enemy.interval;\n  document.getElementById('itemList').dataset.sig = '';\n  document.getEl ap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}\n.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-top:16px}\n.gcard{\n  border:1px solid var(--line);border-radius:14px;background:#0d0d1a;padding:16px;cursor:pointer;\n  transition:.18s;text-align:left;color:inherit;font:inherit;position:relative\n}\n.gcard:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 8px 24px rgba(78,204,163,.12)}\n.gcard .ico{font-size:26px}\n.gcard .nm{color:#e6f0ff;font-weight:700;margin:8px 0 4px;font-size:14.5px}\n.gcard .ds{color:var(--muted);font-size:12.5px;line-height:1.5}\n.gcard .done-badge{\n  position:absolute;top:10px;right:10px;font-size:10px;color:var(--green);\n  border:1px solid var(--green);border-radius:99px;padding:2px 7px\n}\n.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}\n.ghead h2{margin:0}\n.back{\n  border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;\n  padding:7px 12px;cursor:pointer;font:inherit;font-size:13px\n}\n.back:hover{color:var(--green);border-color:var(--green)}\npre{\n  background:#0d0d1a;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;\n  font-size:13px;line-height:1.65;color:#c3d0e6;margin:0 0 12px\n}\n/* ===== 代码词谜 Wordle ===== */\n.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:270px;margin:0 auto 14px}\n.wcell{\n  aspect-ratio:1;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;\n  justify-content:center;font-weight:700;font-size:20px;text-transform:uppercase;color:#e6f0ff;\n  transition:transform .15s,background .2s\n}\n.wcell.filled{border-color:var(--muted);transform:scale(1.04)}\n.wcell.hit{background:#3aa882;border-color:#3aa882;color:#fff}\n.wcell.near{background:#8a6a12;border-color:#8a6a12;color:#fff}\n.wcell.miss{background:#1b2136;border-color:#1b2136;color:var(--muted)}\n.wcell.flip{animation:flip .35s ease}\n@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}\n.wcell.shake{animation:shake .4s}\n@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:400px;margin:0 auto}\n.kb button{width:30px;height:38px;border-radius:6px;border:1px solid var(--line);background:#141a2e;color:#c3d0e6;font:inherit;font-weight:700;cursor:pointer;font-size:12.5px;transition:.15s}\n.kb button:hover{border-color:var(--cyan)}\n.kb button.wide{width:54px;font-size:11px}\n.kb button.hit{background:#3aa882;border-color:#3aa882;color:#fff}\n.kb button.near{background:#8a6a12;border-color:#8a6a12;color:#fff}\n.kb button.miss{background:#1b2136;border-color:#1b2136;color:#2b3550}\n/* ===== 极客抽卡 Gacha ===== */\n.card-stage{\n  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:200px;align-items:center\n}\n.summon-tip{color:var(--cyan);font-size:14px;animation:pulse 1s infinite}\n@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}\n.gacha-card{\n  width:118px;border-radius:12px;padding:14px 10px;text-align:center;position:relative;\n  background:linear-gradient(160deg,#141a2e,#0d0d1a);border:1px solid var(--line);\n  opacity:0;transform:translateY(14px) scale(.9);animation:reveal .45s ease forwards\n}\n@keyframes reveal{to{opacity:1;transform:none}}\n.gacha-card .r-ico{font-size:30px}\n.gacha-card .r-name{font-weight:700;font-size:13px;margin:6px 0 2px;color:#e6f0ff}\n.gacha-card .r-role{font-size:11px;color:var(--muted)}\n.gacha-card .r-skill{font-size:10.5px;color:#93a2c0;line-height:1.4;margin-top:6px;min-height:26px}\n.gacha-card .r-lang{font-size:10px;color:var(--cyan);margin-top:4px}\n.gacha-card .stars{color:var(--yellow);font-size:10px;letter-spacing:1px;margin-top:4px}\n.gacha-card .r-tag{position:absolute;top:6px;left:6px;font-size:9px;padding:1px 6px;border-radius:99px}\n.r-普通{border-color:var(--muted)!important;box-shadow:0 0 0 rgba(0,0,0,0)}\n.r-普通 .r-tag{background:rgba(126,138,166,.18);color:var(--muted)}\n.r-稀有{border-color:var(--cyan)!important;box-shadow:0 0 14px rgba(84,224,224,.25)}\n.r-稀有 .r-tag{background:rgba(84,224,224,.18);color:var(--cyan)}\n.r-史诗{border-color:var(--purple)!important;box-shadow:0 0 18px rgba(138,122,181,.3)}\n.r-史诗 .r-tag{background:rgba(138,122,181,.2);color:var(--purple)}\n.r-传说{border-color:var(--green)!important;box-shadow:0 0 22px rgba(78,204,163,.4)}\n.r-传说 .r-tag{background:rgba(78,204,163,.2);color:var(--green)}\n.r-传说 .r-ico,.r-传说 .r-name{color:var(--green)}\n.gacha-info{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:13px}\n.gacha-info b{color:var(--yellow)}\n/* ===== Bug 猎人 ===== */\n.snip{background:#0d0d1a;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px}\n.snip-line{\n  display:flex;gap:12px;padding:7px 12px;font-size:13px;line-height:1.6;cursor:pointer;\n  transition:background .15s;border-bottom:1px solid #1b2136;white-space:pre-wrap;word-break:break-word\n}\n.snip-line:last-child{border-bottom:none}\n.snip-line:hover{background:rgba(84,224,224,.08)}\n.snip-line .ln{color:var(--muted);user-select:none;min-width:22px;text-align:right}\n.snip-line.ok{background:rgba(78,204,163,.1)}\n.snip-line.ok .ln{color:var(--green)}\n.snip-line.bad{background:rgba(233,69,96,.1)}\n.snip-line.bad .ln{color:var(--red)}\n.snip-line.dim{opacity:.45}\n.lang-tag{color:var(--cyan);font-size:12px}\n/* ===== 结果 ===== */\n.rank-box{text-align:center;padding:10px 0 6px}\n.rank-box .crown{font-size:42px}\n.rank-box .rk{font-size:22px;font-weight:700;color:var(--green);margin:8px 0 4px}\n.rank-box .sc{color:var(--yellow);font-size:15px}\n.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}\n.score-grid .si{border:1px solid var(--line);border-radius:10px;padding:12px;background:#0d0d1a}\n.score-grid .si .k{color:var(--muted);font-size:12px}\n.score-grid .si .v{font-size:16px;font-weight:700;margin-top:3px}\n.score-grid .si.done{border-color:var(--green)}\n.score-grid .si.done .v{color:var(--green)}\n.score-grid .si.todo .v{color:var(--muted)}\n/* ===== Toast ===== */\n.toast{\n  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);\n  background:#141a2e;border:1px solid var(--line);color:#e6f0ff;padding:10px 16px;border-radius:10px;\n  font-size:13.5px;z-index:50;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)\n}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\nfooter{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}\n@media(max-width:520px){\n  .score-grid{grid-template-columns:1fr}\n  .gacha-card{width:46%}\n  .kb button{width:26px;height:34px}\n}\n\n  /* ==== 招新模块（补充：原文件承诺\"扫码\"却没有二维码，这里补齐） ==== */\n  .joinbar{\n    display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;\n    margin-top:20px;padding-top:16px;border-top:1px solid var(--line);\n    font-size:13px;color:#93a2c0\n  }\n  .joinbar b{color:#ffd24a;letter-spacing:1px}\n  .joincard{\n    display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;\n    margin-top:18px;padding:18px 20px;background:var(--panel);\n    border:2px solid #4ecca3;border-radius:12px;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f\n  }\n  .joinlogo{\n    width:64px;height:64px;border-radius:50%;flex:0 0 auto;\n    box-shadow:0 0 0 2px #0d0d1a, 0 0 0 4px #4ecca3, 0 0 18px rgba(78,204,163,.45)\n  }\n  .joininfo{flex:1 1 210px;min-width:180px;text-align:left}\n  .jointitle{font-size:16px;font-weight:700;color:#e6f0ff}\n  .joinslogan{font-size:12px;color:#93a2c0;margin-top:4px}\n  .joinnum{margin-top:9px;font-size:13px;color:#93a2c0}\n  .joinnum b{\n    color:#2a1f00;background:#ffd24a;border-radius:4px;padding:3px 10px;\n    letter-spacing:1px;font-weight:700\n  }\n  .joinhint{font-size:11px;color:#7e8aa6;margin-top:7px}\n  /* 二维码保持白底：静默区是扫码必要条件 */\n  .joinqr{\n    flex:0 0 auto;background:#fff;border-radius:8px;padding:8px;\n    border:2px solid #4ecca3;box-shadow:0 0 0 1px #05070f, 0 4px 0 #05070f\n  }\n  .joinqr img{display:block;width:148px;height:148px}\n  @media(max-width:520px){ .joinqr img{width:128px;height:128px} }\n\n</style>\n</head>\n<body>\n<div class=\"app\">\n\n  <div class=\"topbar\">\n    <div class=\"logo\">Code<span>Hunter</span></div>\n    <div class=\"stat\" id=\"topStat\">积分 <b id=\"totalScore\">0</b> · 已通关 <b id=\"doneCount\">0</b>/4</div>\n  </div>\n\n  <!-- ============ 首页 Hub ============ -->\n  <section class=\"view\" id=\"view-hub\">\n    <h1>计算机协会招新游戏中心</h1>\n    <p class=\"sub\">// 挑战 4 个 C 语言关卡，积累积分，解锁你的极客身份卡 —— 欢迎加入我们。</p>\n    <div class=\"hub-grid\" id=\"hubGrid\"></div>\n    <div class=\"row\">\n      <button class=\"btn sec\" id=\"btnResult\">查看战报</button>\n      <button class=\"btn warn\" id=\"btnReset\">重置进度</button>\n    </div>\n    <div class=\"joinbar\">\n      <span>☕ 想一起写代码、做项目？招新群 <b>1098557720</b></span>\n      <button class=\"btn\" id=\"btnJoin\">加入我们 →</button>\n    </div>\n\n  </section>\n\n  <!-- ============ 知识问答 ============ -->\n  <section class=\"view hidden\" id=\"view-quiz\">\n    <div class=\"ghead\">\n      <h2>知识问答</h2>\n      <button class=\"back\" data-back>返回</button>\n    </div>\n    <p class=\"sub\" id=\"quizMeta\"></p>\n    <h2 id=\"quizQ\"></h2>\n    <div id=\"quizOpts\"></div>\n    <div class=\"fb hidden\" id=\"quizFb\"></div>\n    <div class=\"bar\"><i id=\"quizBar\"></i></div>\n    <div class=\"row\" id=\"quizRow\"></div>\n  </section>\n\n  <!-- ============ 代码词谜 ============ -->\n  <section class=\"view hidden\" id=\"view-wordle\">\n    <div class=\"ghead\">\n      <h2>代码词谜</h2>\n      <button class=\"back\" data-back>返回</button>\n    </div>\n    <p class=\"sub\">// 猜出一个 5 字母 C 语言词汇，6 次机会。绿色=位置正确，黄色=存在但位置错。</p>\n    <div class=\"wgrid\" id=\"wGrid\"></div>\n    <div class=\"kb\" id=\"wKb\"></div>\n    <div class=\"row\" id=\"wRow\"></div>\n  </section>\n\n  <!-- ============ 极客抽卡 ============ -->\n  <section class=\"view hidden\" id=\"view-gacha\">\n    <div class=\"ghead\">\n      <h2>极客抽卡</h2>\n      <button class=\"back\" data-back>返回</button>\n    </div>\n    <p class=\"sub\">// 召唤 C 语言程序员英雄卡，收集稀有角色。传说出货率 3%。</p>\n    <div class=\"gacha-info\">\n      <span>已召唤 <b id=\"gDraws\">0</b></span>\n      <span>图鉴 <b id=\"gColl\">0</b>/<b id=\"gTotal\">0</b></span>\n      <span>传说 <b id=\"gLegend\">0</b></span>\n    </div>\n    <div class=\"card-stage\" id=\"gStage\"></div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"gPull1\">单抽 (1)</button>\n      <button class=\"btn sec\" id=\"gPull10\">十连 (10)</button>\n    </div>\n  </section>\n\n  <!-- ============ Bug 猎人 ============ -->\n  <section class=\"view hidden\" id=\"view-bug\">\n    <div class=\"ghead\">\n      <h2>Bug 猎人</h2>\n      <button class=\"back\" data-back>返回</button>\n    </div>\n    <p class=\"sub\" id=\"bugMeta\"></p>\n    <h2 id=\"bugTitle\"></h2>\n    <span class=\"lang-tag\" id=\"bugLang\"></span>\n    <div class=\"snip\" id=\"bugSnip\" style=\"margin-top:10px\"></div>\n    <div class=\"fb hidden\" id=\"bugFb\"></div>\n    <div class=\"row\" id=\"bugRow\"></div>\n  </section>\n\n  <!-- ============ 战报 Result ============ -->\n  <section class=\"view hidden\" id=\"view-result\">\n    <div class=\"ghead\">\n      <h2>战报</h2>\n      <button class=\"back\" data-back>返回</button>\n    </div>\n    <div class=\"rank-box\" id=\"rankBox\"></div>\n    <div class=\"score-grid\" id=\"scoreGrid\"></div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"rBack\">回到首页</button>\n      <button class=\"btn sec\" id=\"rReset\">重新挑战</button>\n    </div>\n    <footer id=\"cta\"></footer>\n    <div class=\"joincard\">\n      <img class=\"joinlogo\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANAAAADQCAMAAABBeh9GAAABgFBMVEX///////7///3+///+//38///4/////v/// "row\" style=\"justify-content:center\">\n      <button class=\"btn\" id=\"ctaJoin\">去「关于协会」看看 →</button>\n    </div>\n\n  </section>\n\n  <footer>CodeHunter · 计算机协会 · 用代码连接每一个热爱创造的你</footer>\n</div>\n\n<div class=\"toast\" id=\"toast\"></div>\n\n<script>\n\"use strict\";\n/* ==================== 工具 ==================== */\nconst $ = (id)=>document.getElementById(id);\nfunction toast(msg){\n  const t=$(\"toast\");t.textContent=msg;t.classList.add(\"show\");\n  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove(\"show\"),1600);\n}\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction showView(id){\n  document.querySelectorAll(\".view\").forEach(v=>v.classList.add(\"hidden\"));\n  $(id).classList.remove(\"hidden\");\n  window.scrollTo({top:0,behavior:\"smooth\"});\n}\n\n/* ==================== 数据 ==================== */\nconst QUIZ=[\n  {q:\"在 C 语言中，下列哪个是合法的变量名？\",opts:[\"2count\",\"_count\",\"int\",\"a-b\"],ans:1,\n   ex:\"C 标识符须以字母或下划线开头，不能以数字开头，不能含连字符，也不能用 int 等关键字。\"},\n  {q:\"sizeof(int) 在大多数 64 位系统上的返回值是多少字节？\",opts:[\"2\",\"4\",\"8\",\"16\"],ans:1,\n   ex:\"在主流 64 位平台上 int 通常占 4 字节；char 为 1，short 为 2，long 在 LP64 上为 8。\"},\n  {q:\"以下哪种方式能正确在堆上分配 10 个 int 的连续空间？\",opts:[\"int *p = malloc(10);\",\"int *p = malloc(10 * sizeof(int));\",\"int p[10] = malloc();\",\"int *p = alloc(int, 10);\"],ans:1,\n   ex:\"malloc 参数是字节数，应传 10 * sizeof(int)；返回 void* 在 C 中可隐式转换，但必须 #include <stdlib.h>。\"},\n  {q:\"C 语言中字符串以什么结尾？\",opts:[\"空格 ' '\",\"换行 '\\\\n'\",\"空字符 '\\\\0'\",\"分号 ';'\"],ans:2,\n   ex:\"C 字符串是以 '\\\\0'（空字符 / NUL）结尾的字符数组，strlen 遇到 '\\\\0' 即停止计数。\"},\n  {q:\"下列哪个运算符的优先级最高？\",opts:[\"赋值 =\",\"逻辑或 ||\",\"乘法 *\",\"逗号 ,\"],ans:2,\n   ex:\"乘法 * 的优先级高于逻辑或 ||，赋值 = 优先级很低，逗号 , 的优先级最低。\"},\n  {q:\"C 语言中，static 修饰局部变量时，该变量具有什么特性？\",opts:[\"只在函数内可见且每次调用都重新初始化\",\"存储在堆上\",\"生存期为整个程序运行期，但作用域不变\",\"可以被其他文件 extern 引用\"],ans:2,\n   ex:\"static 局部变量分配在静态存储区，生存期持续到程序结束，但名字作用域仍限于函数内部。\"},\n  {q:\"以下哪个头文件提供了 printf 和 scanf 的声明？\",opts:[\"<string.h>\",\"<math.h>\",\"<stdio.h>\",\"<stdlib.h>\"],ans:2,\n   ex:\"printf / scanf / fopen 等标准输入输出函数声明在 <stdio.h>；<string.h> 提供字符串操作，<stdlib.h> 提供 malloc / exit 等。\"},\n  {q:\"下列关于 C 语言指针的说法，哪一项是正确的？\",opts:[\"指针变量只能指向 int 类型\",\"未初始化的指针一定指向 NULL\",\"空指针解引用是未定义行为\",\"指针不能进行算术运算\"],ans:2,\n   ex:\"对 NULL 解引用属于未定义行为（UB）；指针未初始化时是野指针（值不确定），并非一定是 NULL；指针可做算术运算。\"}\n];\n\nconst WORDS=[\"ARRAY\",\"BREAK\",\"CONST\",\"ERROR\",\"FOPEN\",\"MACRO\",\"SCOPE\",\"UNION\",\"WHILE\",\"CHARS\",\"SHORT\",\"ULONG\",\"VOIDS\",\"HEAPS\",\"STACK\",\"FLOAT\",\"INDEX\",\"DEBUG\",\"LABEL\",\"BLOCK\",\"VALUE\",\"TYPES\",\"COUNT\",\"LIMIT\",\"ALIAS\",\"FLAGS\",\"COMMA\",\"TOKEN\"];\nconst DICT=new Set([\n  ...WORDS,\n  \"SCANF\",\"ALIAS\",\"ALIGN\",\"PARSE\",\"BYTES\",\"SLOTS\",\"CRASH\",\"ABORT\",\"SHELL\",\"QUEUE\",\"NORMS\",\"STACK\",\n  \"ABOUT\",\"ABOVE\",\"ACTOR\",\"ADMIN\",\"ALPHA\",\"ASYNC\",\"AUDIO\",\"BEGIN\",\"BEING\",\"BIRTH\",\"BLOCK\",\"BOARD\",\"BRAIN\",\"BUILD\",\n  \"CARRY\",\"CHECK\",\"CLEAN\",\"CLOCK\",\"CODES\",\"COMMA\",\"COUNT\",\"CYBER\",\"DELAY\",\"DRIVE\",\"EMPTY\",\"ENTRY\",\"ERROR\",\"FAITH\",\n  \"FALSE\",\"FIELD\",\"FILES\",\"FINAL\",\"FIXED\",\"FOCUS\",\"FRAME\",\"FRESH\",\"FRONT\",\"GROUP\",\"GUARD\",\"HEART\",\"HELLO\",\"HOUSE\",\n  \"HUMAN\",\"IDEAL\",\"IMAGE\",\"INNER\",\"INTRO\",\"LASER\",\"LEARN\",\"LEVEL\",\"LIGHT\",\"LIMIT\",\"LOCAL\",\"LOGIC\",\"MACRO\",\"MATCH\",\n  \"MEDIA\",\"METAL\",\"MIGHT\",\"MODEL\",\"MONEY\",\"MOUSE\",\"MOVES\",\"MUSIC\",\"NAMED\",\"NEVER\",\"NIGHT\",\"OPERA\",\"ORDER\",\"OTHER\",\n  \"OWNER\",\"PAIRS\",\"PANEL\",\"PAPER\",\"PASTE\",\"PATCH\",\"PEACE\",\"PHASE\",\"PHONE\",\"PIECE\",\"PIXEL\",\"PLANE\",\"PLANS\",\"POINT\",\n  \"POWER\",\"PRINT\",\"PRIDE\",\"PRIME\",\"PROOF\",\"PROXY\",\"PULSE\",\"QUARK\",\"QUOTE\",\"RADIO\",\"RATIO\",\"REACT\",\"READY\",\"REALM\",\n  \"REPLY\",\"RIGHT\",\"ROBOT\",\"ROUND\",\"ROUTE\",\"RULES\",\"SAVED\",\"SCALE\",\"SCOPE\",\"SCORE\",\"SEEDS\",\
