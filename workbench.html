<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计算机协会 · 小游戏工作台</title>
<style>
  /* ==== 工作台外壳：与「像素冒险」同款像素街机风 ==== */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;overflow:hidden;
    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace;
    color:#e6f0ff;
    background:
      radial-gradient(900px 520px at 10% -12%, rgba(78,204,163,.12) 0%, rgba(78,204,163,0) 62%),
      radial-gradient(760px 480px at 96% 110%, rgba(233,69,96,.10) 0%, rgba(233,69,96,0) 58%),
      #0d0d1a;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:58px;
    background:#141a2e;border-bottom:3px solid #26304a;
    box-shadow:0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.10);
    position:relative;z-index:3;
  }
  .logo{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 0 2px #0d0d1a, 0 0 0 4px #4ecca3, 0 0 18px rgba(78,204,163,.45);
  }
  .who{flex:0 0 auto;padding:8px 0;line-height:1.3}
  .who .n1{font-size:9.5px;color:#6f7d9c;letter-spacing:.14em}
  .who .n2{font-size:14px;font-weight:800;letter-spacing:.04em}

  nav{display:flex;gap:5px;flex:1;overflow-x:auto;padding:9px 0;scrollbar-width:none;
      border-left:1px solid #26304a;padding-left:12px;margin-left:4px}
  nav::-webkit-scrollbar{display:none}
  .tab{
    font:inherit;cursor:pointer;white-space:nowrap;
    border:2px solid #2b3550;background:#1b2136;color:#93a2c0;
    border-radius:4px;padding:6px 12px;display:flex;align-items:baseline;gap:6px;
    transition:.14s;box-shadow:0 3px 0 #05070f;
  }
  .tab:hover{background:#243052;border-color:#4ecca3;color:#e6f0ff}
  .tab.on{
    color:#0b1220;background:#4ecca3;border-color:#3aa882;
    box-shadow:0 3px 0 #2d6a4f, 0 0 18px rgba(78,204,163,.5);
  }
  .tab .nm{font-size:13px;font-weight:800}
  .tab .tg{font-size:10px;font-weight:700;color:#6f7d9c}
  .tab.on .tg{color:rgba(11,18,32,.66)}
  .tab.divide{margin-left:10px;position:relative}
  .tab.divide::before{
    content:'';position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:2px;height:20px;background:#2b3550;
  }
  .tab.about.on{background:#ffd24a;border-color:#c99a1e;color:#2a1f00;
                box-shadow:0 3px 0 #8a6a12, 0 0 18px rgba(255,210,74,.45)}
  .tab.about.on .tg{color:rgba(42,31,0,.62)}

  #join{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    color:#0b1220;border:2px solid #3aa882;border-radius:4px;padding:8px 16px;white-space:nowrap;
    background:#4ecca3;box-shadow:0 4px 0 #2d6a4f, 0 0 18px rgba(78,204,163,.35);transition:.14s;
  }
  #join:hover{background:#5fd9b0;transform:translateY(-1px)}

  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 18px;
    background:#0f1424;border-bottom:3px solid #26304a;
    font-size:12.5px;color:#8b98b8;
  }
  .bar .dot{width:8px;height:8px;border-radius:1px;background:#4ecca3;
            box-shadow:0 0 10px #4ecca3;flex:0 0 auto}
  .bar .hint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button{
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
    border:2px solid #2b3550;background:#1b2136;color:#93a2c0;
    border-radius:4px;padding:5px 12px;transition:.14s;
  }
  .bar button:hover{background:#243052;border-color:#4ecca3;color:#e6f0ff}

  main{flex:1;min-height:0;position:relative;background:#0d0d1a}
  iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0d0d1a;
  }
</style>
</head>

dial-gradient(2px 2px at 188px 298px, rgba(168,240,208,.85), transparent 60%),\n      radial-gradient(1px 1px at 292px 244px, rgba(255,255,255,.9), transparent 60%),\n      radial-gradient(1px 1px at 402px 318px, rgba(160,235,215,.75), transparent 60%),\n      radial-gradient(1px 1px at 34px 388px, rgba(255,255,255,.8), transparent 60%),\n      radial-gradient(2px 2px at 152px 452px, rgba(120,225,215,.85), transparent 60%),\n      radial-gradient(1px 1px at 266px 406px, rgba(255,255,255,.7), transparent 60%),\n      radial-gradient(1px 1px at 360px 486px, rgba(168,240,208,.8), transparent 60%),\n      radial-gradient(1px 1px at 462px 428px, rgba(255,255,255,.9), transparent 60%),\n      radial-gradient(1px 1px at 540px 90px, rgba(255,255,255,.6), transparent 60%),\n      radial-gradient(1px 1px at 560px 210px, rgba(175,240,225,.7), transparent 60%),\n      radial-gradient(1px 1px at 530px 330px, rgba(255,255,255,.65), transparent 60%),\n      radial-gradient(1px 1px at 552px 460px, rgba(165,235,220,.75), transparent 60%),\n      radial-gradient(1px 1px at 596px 150px, rgba(255,255,255,.55), transparent 60%);\n    background-size:600px 500px;\n    animation:twinkleA 4.2s ease-in-out infinite alternate;\n  }\n  body::after{\n    background-image:\n      radial-gradient(1px 1px at 58px 18px, rgba(140,230,225,.6), transparent 60%),\n      radial-gradient(1px 1px at 158px 108px, rgba(255,255,255,.5), transparent 60%),\n      radial-gradient(1px 1px at 258px 58px, rgba(100,225,225,.6), transparent 60%),\n      radial-gradient(1px 1px at 58px 158px, rgba(255,255,255,.45), transparent 60%),\n      radial-gradient(1px 1px at 238px 182px, rgba(150,232,222,.55), transparent 60%),\n      radial-gradient(1px 1px at 158px 268px, rgba(255,255,255,.5), transparent 60%),\n      radial-gradient(1px 1px at 62px 352px, rgba(110,228,222,.55), transparent 60%),\n      radial-gradient(1px 1px at 282px 322px, rgba(255,255,255,.4), transparent 60%),\n      radial-gradient(1px 1px at 182px 432px, rgba(150,232,222,.5), transparent 60%);\n    background-size:340px 480px;\n    animation:twinkleB 3.1s ease-in-out infinite alternate;\n  }\n  @keyframes twinkleA{ from{ opacity:.45; } to{ opacity:1; } }\n  @keyframes twinkleB{ from{ opacity:1; } to{ opacity:.35; } }\n  #app{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; max-width:100%; }\n\n  /* ============ 顶部 HUD ============ */\n  #hud{\n    width:min(96vw, 486px);\n    background:var(--panel); border:1px solid rgba(78,204,163,.4);\n    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);\n    box-shadow:0 8px 28px rgba(0,0,0,.45), 0 0 18px rgba(78,204,163,.12), inset 0 1px 0 rgba(255,255,255,.07);\n    border-radius:12px;\n    padding:8px 12px;\n    display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; justify-content:space-between;\n  }\n  .logo{ display:flex; flex-direction:column; line-height:1.05; user-select:none; }\n  .logo b{\n    font-size:15px; letter-spacing:2px;\n    background:linear-gradient(90deg,#ffffff, #a8f0d0 55%, #54e0e0);\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .logo span{\n    font-size:8px; letter-spacing:3px;\n    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .o2wrap{ display:flex; align-items:center; gap:6px; flex:1; min-width:180px; }\n  .o2label{ font-size:12px; font-weight:bold; color:var(--cyan); white-space:nowrap; }\n  .o2bar{\n    flex:1; height:16px; background:#0d0d1a; border:1px solid rgba(78,204,163,.45);\n    border-radius:8px; position:relative; overflow:hidden;\n  }\n  #o2fill{\n    height:100%; width:100%;\n    background:linear-gradient(90deg,#2ecf7f,#a8f05a);\n    transition:width .12s linear;\n  }\n  #o2fill.low{ background:linear-gradient(90deg,#ff4757,#ff9f43); animation:o2pulse .5s infinite alternate; }\n  @keyframes o2pulse{ from{ filter:brightness(1); } to{ filter:brightness(1.6); } }\n  .o2bar::after{\n    content:''; position:absolute; inset:0;\n    background:repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 3px, transparent 3px 8px);\n    pointer-events:none;\n  }\n  #o2num{ font-size:12px; font-weight:bold; color:var(--cyan); min-width:26px; text-align:right; }\n  .stats{ display:flex; gap:12px; font-size:12px; color:var(--dim); white-space:nowrap; }\n  .stats b{ color:var(--text); font-size:13px; }\n  .hud-right{ display:flex; align-items:center; gap:6px; }\n  .combo{\n    font-size:11px; font-weight:bold; color:#fff; background:#c0392b;\n    border:2px solid #7d241a; padding:2px 7px; letter-spacing:1px;\n    animation:combopop .18s ease-out; white-space:nowrap;\n  }\n  @keyframes combopop{ from{ transform:scale(1.4); } to{ transform:scale(1); } }\n  .iconbtn{\n    width:32px; height:32px; font:inherit; font-size:11px; font-weight:bold;\n    background:var(--panel2); color:var(--text); border:1px solid rgba(78,204,163,.45);\n    border-radius:8px; cursor:pointer; white-space:nowrap;\n    box-shadow:0 2px 8px rgba(0,0,0,.35);\n  }\n  .iconbtn:active{ transform:translateY(1px); box-shadow:none; }\n  .iconbtn:hover{ border-color:rgba(84,224,224,.7); box-shadow:0 0 12px rgba(78,204,163,.35); }\n\n  /* ============ 游戏舞台 ============ */\n  #stage{\n    position:relative; line-height:0; background:#0d0d1a;\n    border:1px solid rgba(78,204,163,.5);\n    box-shadow:0 0 26px rgba(78,204,163,.16), 0 16px 44px rgba(0,0,0,.6);\n    touch-action:none;\n  }\n  canvas{\n    display:block; width:auto; height:auto; max-width:min(96vw,486px);\n    max-height:calc(100dvh - 156px);\n    image-rendering:pixelated; image-rendering:crisp-edges;\n  }\n  #stage::after{ /* 扫描线 */\n    content:''; position:absolute; inset:0; pointer-events:none; z-index:3;\n    background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px);\n  }\n\n  /* ============ 遮罩层 ============ */\n  .overlay{\n    position:absolute; inset:0; z-index:6;\n    display:flex; align-items:center; justify-content:center;\n    background:rgba(6,10,22,.7); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);\n  }\n  .overlay.hidden{ display:none; }\n  .combo.hidden{ display:none; }\n  .panel{\n    background:rgba(14,19,35,.92); border:1px solid rgba(78,204,163,.45);\n    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);\n    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 34px rgba(78,204,163,.14), inset 0 1px 0 rgba(255,255,255,.08);\n    border-radius:16px;\n    padding:20px 22px; width:min(88%, 388px); max-height:94%; overflow:auto;\n    text-align:center; line-height:1.5;\n  }\n  .title{\n    font-size:clamp(26px, 7vw, 34px); font-weight:900; letter-spacing:6px;\n    background:linear-gradient(180deg,#ffffff 30%,#8fe6c6 70%,#54e0e0);\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n    filter:drop-shadow(0 4px 14px rgba(78,204,163,.35));\n    margin-bottom:2px;\n  }\n  .title-en{\n    font-size:10px; letter-spacing:6px; margin-bottom:16px;\n    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .rules{ list-style:none; text-align:left; font-size:13px; margin:0 0 14px; }\n  .rules li{ position:relative; padding:3px 0 3px 20px; color:var(--text); }\n  .rules li::before{\n    content:''; position:absolute; left:2px; top:9px; width:9px; height:9px;\n  }\n  .rules li:nth-child(1)::before{ background:var(--gold); }\n  .rules li:nth-child(2)::before{ background:var(--red); }\n  .rules li:nth-child(3)::before{ background:var(--cyan); }\n  .rules li:nth-child(4)::before{ background:var(--green); }\n  .rules li:nth-child(5)::before{ background:var(--orange); }\n  .rules li:nth-child(6)::before{ background:#54e0e0; }\n  .rules b{ color:var(--gold); }\n  .keys{ font-size:11px; color:var(--dim); margin-bottom:14px; letter-spacing:1px; }\n  .btn{\n    font:inherit; font-size:15px; font-weight:900; letter-spacing:3px;\n    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));\n    color:#fff; border:none; cursor:pointer; border-radius:9999px;\n    padding:13px 30px; position:relative;\n    box-shadow:0 6px 22px rgba(78,204,163,.45), inset 0 1px 0 rgba(255,255,255,.25);\n    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;\n  }\n  .btn:hover{ transform:translateY(-2px); filter:brightness(1.1); box-shadow:0 10px 30px rgba(78,204,163,.6), inset 0 1px 0 rgba(255,255,255,.25); }\n  .btn:active{ transform:translateY(1px); box-shadow:0 3px 12px rgba(78,204,163,.4); }\n  .btn.ghost{\n    background:rgba(26,34,58,.85); color:var(--text);\n    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(78,204,163,.4);\n  }\n  .btn.ghost:hover{ box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(84,224,224,.7); }\n  .best-line{ margin-top:12px; font-size:12px; color:var(--dim); }\n\n  /* 结算面板 */\n  .over-title{\n    font-size:24px; font-weight:900; letter-spacing:4px; color:var(--red);\n    text-shadow:2px 2px 0 #5a1020; margin-bottom:4px;\n  }\n  .over-desc{ font-size:12px; color:var(--dim); margin-bottom:14px; }\n  .over-score-label{ font-size:11px; color:var(--dim); letter-spacing:2px; }\n  .over-score{ font-size:38px; font-weight:900; color:var(--gold); text-shadow:3px 3px 0 #6b4400; line-height:1.1; }\n  .newbest{\n    display:inline-block; font-size:11px; font-weight:bold; color:#fff;\n    background:linear-gradient(90deg,#c0392b,#ff9f43); padding:2px 10px;\n    margin-top:4px; letter-spacing:2px; animation:o2pulse .5s infinite alternate;\n  }\n  .newbest.hidden{ display:none; }\n  .stat-grid{\n    display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:14px 0;\n  }\n  .stat{\n    background:rgba(26,34,58,.75); border:1px solid rgba(78,204,163,.35);\n    border-radius:10px; padding:7px 2px;\n  }\n  .stat b{ display:block; font-size:15px; color:var(--cyan); }\n  .stat span{ font-size:10px; color:var(--dim); }\n  .mlist{ text-align:left; margin-bottom:14px; border-top:1px solid rgba(78,204,163,.35); padding-top:8px; }\n  .mrow{\n    display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 2px;\n  }\n  .mrow i{ width:12px; height:12px; flex:none; border-radius:3px; box-shadow:inset -2px -2px 0 rgba(0,0,0,.4); }\n  .mrow .mname{ flex:1; color:var(--text); }\n  .mrow .mcount{ color:var(--dim); }\n  .mrow .mpts{ font-weight:bold; color:var(--gold); min-width:52px; text-align:right; }\n  .mrow.none{ color:var(--dim); font-size:12px; justify-content:center; }\n\n  /* 结算页 · 加入计协 */\n  .join{ margin-top:16px; padding-top:14px; border-top:1px solid rgba(78,204,163,.35); }\n  .join-title{\n    font-size:16px; font-weight:900; letter-spacing:2px;\n    background:linear-gradient(90deg,#ffffff,#a8f0d0 60%,#54e0e0);\n    -webkit-background-clip:text; background-clip:text; color:transparent;\n  }\n  .join-slogan{ font-size:11px; color:var(--dim); margin-top:4px; letter-spacing:1px; }\n  .join-qr{\n    width:150px; height:150px; margin:14px auto 8px; padding:7px;\n    background:#fff; border:1px solid rgba(78,204,163,.55);\n    border-radius:12px;\n    box-shadow:0 4px 18px rgba(0,0,0,.4);\n    animation:qrGlow 2.4s ease-in-out infinite;\n  }\n  .join-qr img{ display:block; width:100%; height:100%; border-radius:6px; }\n  @keyframes qrGlow{\n    0%,100%{ box-shadow:0 4px 18px rgba(0,0,0,.4), 0 0 0 0 rgba(78,204,163,0); }\n    50%{ box-shadow:0 4px 18px rgba(0,0,0,.4), 0 0 16px 3px rgba(78,204,163,.5); }\n  }\n  .join-hint{ font-size:11px; color:var(--dim); letter-spacing:1px; }\n  .join-hint b{ color:var(--cyan); }\n\n  /* 暂停 */\n  .pause-title{ font-size:22px; font-weight:900; letter-spacing:6px; color:var(--cyan); margin-bottom:8px; }\n\n  /* ============ 触屏方向键 ============ */\n  #dpad{\n    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);\n    display:none; grid-template-columns:repeat(3, 54px); grid-template-rows:repeat(2, 46px);\n    gap:6px; z-index:5; opacity:.88;\n  }\n  #dpad button{\n    font:inherit; font-size:18px; color:var(--text); background:rgba(18,26,46,.88);\n    border:1px solid rgba(78,204,163,.5); border-radius:10px;\n    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);\n    box-shadow:0 3px 10px rgba(0,0,0,.4); touch-action:none; user-select:none;\n  }\n  #dpad button:active{ background:rgba(31,45,58,.95); transform:translateY(1px); box-shadow:none; }\n  #dpad .d-up{ grid-column:2; grid-row:1; }\n  #dpad .d-left{ grid-column:1; grid-row:2; }\n  #dpad .d-down{ grid-column:2; grid-row:2; }\n  #dpad .d-right{ grid-column:3; grid-row:2; }\n  @media (pointer:coarse){ #dpad{ display:grid; } }\n  @media (max-width:520px){\n    .stats{ gap:8px; font-size:11px; }\n    #hud{ padding:6px 8px; }\n  }\n  #hints{ font-size:11px; color:#7e8aa6; letter-spacing:1px; user-select:none; }\n  @media (pointer:coarse){ #hints{ display:none; } }\n</style>\n</head>\n<body>\n<div id=\"app\">\n\n  <header id=\"hud\">\n    <div class=\"logo\"><b>像素矿工</b><span>PIXEL MINER</span></div>\n    <div class=\"o2wrap\">\n      <span class=\"o2label\">氧气</span>\n      <div class=\"o2bar\"><div id=\"o2fill\" style=\"width: 85.1649%;\" class=\"\"></div></div>\n      <span id=\"o2num\">86</span>\n    </div>\n    <div class=\"stats\">\n      <span>深度 <b id=\"depth\">0层</b></span>\n      <span>得分 <b id=\"score\">00000</b></span>\n      <span>最佳 <b id=\"best\">00000</b></span>\n    </div>\n    <div class=\"hud-right\">\n      <div class=\"combo hidden\" id=\"combo\">连击 ×2</div>\n      <button class=\"iconbtn\" id=\"btn-mute\" title=\"音效开关 (M)\">音</button>\n      <button class=\"iconbtn\" id=\"btn-restart\" title=\"重新开始 (R)\">重开</button>\n    </div>\n  </header>\n\n  <div id=\"stage\">\n    <canvas id=\"game\" width=\"480\" height=\"768\"></canvas>\n\n    <!-- 开始界面 -->\n    <div class=\"overlay\" id=\"ov-start\">\n      <div class=\"panel\">\n        <div class=\"title\">像素矿工</div>\n        <div class=\"title-en\">P I X E L &nbsp; M I N E R</div>\n        <ul class=\"rules\">\n          <li>方向键 / WASD 挖掘移动（触屏可滑动）</li>\n          <li>走过的格子会<b>塌陷</b>，永远无法回头</li>\n          <li>矿层越深矿物越稀有，请提前规划路线</li>\n          <li>氧气罐 +30 氧气；移动与时间都耗氧，越深越费</li>\n          <li>连续挖到矿物触发<b>连击</b>，最高 5 倍积分</li>\n          <li>氧气耗尽或被困死，本局结束</li>\n        </ul>\n        <div class=\"keys\">R 重开 · P 暂停 · M 音效</div>\n        <button class=\"btn\" id=\"btn-start\">开 始 挖 掘</button>\n        <div class=\"best-line\" id=\"start-best\"></div>\n      </div>\n    </div>\n\n    <!-- 暂停界面 -->\n    <div class=\"overlay hidden\" id=\"ov-pause\">\n      <div class=\"panel\">\n        <div class=\"pause-title\">已暂停</div>\n        <div class=\"keys\" style=\"margin-bottom:14px;\">按 P 继续挖掘</div>\n        <button class=\"btn ghost\" id=\"btn-resume\">继 续</button>\n      </div>\n    </div>\n\n    <!-- 结算界面 -->\n    <div class=\"overlay hidden\" id=\"ov-over\">\n      <div class=\"panel\">\n        <div class=\"over-title\" id=\"over-title\">塌方围困</div>\n        <p class=\"over-desc\" id=\"over-desc\"></p>\n        <div class=\"over-score-label\">最 终 得 分</div>\n        <div class=\"over-score\" id=\"over-score\">0</div>\n        <div class=\"newbest hidden\" id=\"newbest\">新纪录！</div>\n        <div class=\"stat-grid\">\n          <div class=\"stat\"><b id=\"stat-depth\">0</b><span>最大深度</span></div>\n          <div class=\"stat\"><b id=\"stat-moves\">0</b><span>挖掘步数</span></div>\n          <div class=\"stat\"><b id=\"stat-air\">×0</b><span>氧气罐</span></div>\n          <div class=\"stat\"><b id=\"stat-best\">0</b><span>最佳纪录</span></div>\n        </div>\n        <div class=\"mlist\" id=\"mlist\"></div>\n        <button class=\"btn\" id=\"btn-again\">再 来 一 局 (R)</button>\n        <div class=\"join\">\n          <div class=\"join-title\">欢迎加入计协</div>\n          <div class=\"join-slogan\">计算机协会 · 用计算机改变世界，从这里开始</div>\n          <div class=\"join-qr\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUg 算机协会招新群二维码\"></div>\n          <div class=\"join-hint\">扫码加入招新群 · QQ群 <b>1098557720</b></div>\n        </div>\n      </div>\n    </div>\n\n    <!-- 触屏方向键 -->\n    <div id=\"dpad\">\n      <button class=\"d-up\" data-d=\"up\">▲</button>\n      <button class=\"d-left\" data-d=\"left\">◀</button>\n      <button class=\"d-down\" data-d=\"down\">▼</button>\n      <button class=\"d-right\" data-d=\"right\">▶</button>\n    </div>\n  </div>\n\n  <div id=\"hints\">方向键 / WASD 移动 · R 重开 · P 暂停 · M 音效</div>\n</div>\n\n<script>\n'use strict';\n/* ================= 基础常量 ================= */\nconst COLS = 15, ROWS = 24, CELL = 32;   // 网格尺寸与格子像素\nconst W = COLS * CELL, H = ROWS * CELL;  // 画布 480 x 768\nconst ANIM_MS = 115;                     // 单步移动动画时长\nconst O2_MAX = 100, O2_DRAIN = 0.5, O2_AIR = 30; // 氧气参数\nconst COMBO_KEEP = 6;                    // 连击保持的步数\nconst DIR4 = [[1,0],[-1,0],[0,1],[0,-1]];\n\n/* 矿物表：越深越稀有，分值越高 */\nconst MINERALS = [\n  { k:'coal',     name:'煤炭',   pts:2,   color:'#34343c', min:1,  max:6,  w:30 },\n  { k:'copper',   name:'铜矿',   pts:5,   color:'#c96f3b', min:1,  max:7,  w:22 },\n  { k:'iron',     name:'铁矿',   pts:10,  color:'#c2c8d0', min:4,  max:11, w:20 },\n  { k:'silver',   name:'银矿',   pts:18,  color:'#e9edf5', min:7,  max:14, w:15 },\n  { k:'gold',     name:'黄金',   pts:30,  color:'#ffd24a', min:11, max:17, w:12 },\n  { k:'emerald',  name:'翡翠',   pts:45,  color:'#3ee08a', min:13, max:20, w:9  },\n  { k:'ruby',     name:'红宝石', pts:70,  color:'#ff4757', min:16, max:22, w:7  },\n  { k:'sapphire', name:'蓝宝石', pts:100, color:'#4aa8ff', min:18, max:23, w:5  },\n  { k:'diamond',  name:'钻石',   pts:150, color:'#aef4ff', min:20, max:23, w:4  },\n];\nconst RANK = {}; MINERALS.forEach((m,i)=>RANK[m.k]=i);\nconst byKey = k => MINERALS.find(m=>m.k===k);\n\n/* ================= DOM 引用 ================= */\nconst $ = id => document.getElementById(id);\nconst cv = $('game'), ctx = cv.getContext('2d');\nconst stage = $('stage');\nconst o2fill=$('o2fill'), o2num=$('o2num'), depthEl=$('depth'),\n      scoreEl=$('score'), bestEl=$('best'), comboEl=$('combo');\nconst ovStart=$('ov-start'), ovPause=$('ov-pause'), ovOver=$('ov-over');\n\n/* ================= 游戏状态 ================= */\nlet grid = [], collapsed = new Set(), seed = 1;\nlet player = { x:7, y:0, fx:7, fy:0, anim:0, dir:1 };\nlet o2 = O2_MAX, score = 0, best = 0, combo = 0, comboTimer = 0;\nlet moves = 0, maxDepth = 0, airCount = 0;\nlet inventory = {}, invPts = {};\nlet state = 'start';            // start | playing | dying | paused | over\nlet moveQueue = [];\nlet particles = [], floaters = [], crumbles = [];\nlet shake = 0, time = 0, last = 0, lastBeat = 0;\nlet deathCause = null, newBest = false, overTimer = null;\n\n/* ================= 音效引擎（WebAudio 芯片音） ================= */\nconst sfx = (() => {\n  let ac = null, master = null, muted = false;\n  function init(){\n    if (ac) return;\n    try{\n      ac = new (window.AudioContext || window.webkitAudioContext)();\n      master = ac.createGain(); master.gain.value = 0.5;\n      master.connect(ac.destination);\n    }catch(e){ /* 无音频环境时静默降级 */ }\n  }\n  function ready(){\n    if (!ac) init();\n    if (ac && ac.state === 'suspended') ac.resume();\n    return !!ac;\n  }\n  function tone(f0, f1, dur, type, vol, delay){\n    if (muted || !ready()) return;\n    const t = ac.currentTime + (delay || 0);\n    const o = ac.createOscillator(), g = ac.createGain();\n    o.type = type || 'square';\n    o.frequency.setValueAtTime(Math.max(30, f0), t);\n    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);\n    g.gain.setValueAtTime(vol || 0.15, t);\n    g.gain.exponentialRampToValueAtTime(0.001, t + dur);\n    o.connect(g); g.connect(master);\n    o.start(t); o.stop(t + dur + 0.03);\n  }\n  function noise(dur, vol, freq, delay){\n    if (muted || !ready()) return;\n    const t = ac.currentTime + (delay || 0);\n    const n = Math.floor(ac.sampleRate * dur);\n    const buf = ac.createBuffer(1, n, ac.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);\n    const src = ac.createBufferSource(); src.buffer = buf;\n    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq || 400;\n    const g = ac.createGain(); g.gain.value = vol || 0.2;\n    src.connect(f); f.connect(g); g.connect(master);\n    src.start(t);\n  }\n  return {\n    init,\n    toggle(){ muted = !muted; return muted; },\n    dig(){ noise(0.07, 0.22, 350); tone(160, 70, 0.09, 'triangle', 0.18); },\n    bump(){ tone(110, 80, 0.05, 'triangle', 0.1); },\n    collect(m){\n      const r = RANK[m.k] || 0;\n      const base = 420 + r*58 + Math.min(combo,5)*24;\n      tone(base, base*1.4, 0.09, 'square', 0.16);\n      tone(base*1.5, base*2.1, 0.12, 'square', 0.13, 0.08);\n    },\n    air(){ tone(300, 880, 0.22, 'sine', 0.18); tone(500, 1200, 0.18, 'sine', 0.1, 0.06); },\n    heart(){ tone(75, 55, 0.1, 'sine', 0.5); tone(65, 50, 0.1, 'sine', 0.4, 0.16); },\n    start(){ tone(330,330,0.09,'square',0.15); tone(440,440,0.09,'square',0.15,0.1); tone(587,587,0.14,'square',0.15,0.2); },\n    over(){ tone(392,392,0.16,'sawtooth',0.13); tone(311,311,0.16,'sawtooth',0.13,0.17); tone(233,110,0.4,'sawtooth',0.13,0.34); },\n  };\n})();\n\n/* ================= 工具函数 ================= */\n/* 基于格子坐标的确定性伪随机（保证纹理稳定不闪烁） */\nfunction cellRand(x, y, s){\n  let h = (x*374761393 + y*668265263 + s*1274126177 + seed*974711) | 0;\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  h ^= h >>> 16;\n  return (h >>> 0) / 4294967296;\n}\nfunction mix(c1, c2, t){\n  const r = Math.round(c1[0]+(c2[0]-c1[0])*t);\n  const g = Math.round(c1[1]+(c2[1]-c1[1])*t);\n  const b = Math.round(c1[2]+(c2[2]-c1[2])*t);\n  return [r,g,b];\n}\nfunction rgb(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }\nfunction shade(c, amt){ return rgb([c[0]+amt, c[1]+amt, c[2]+amt].map(v=>Math.max(0,Math.min(255,v)))); }\nfunction pad5(n){ return String(n).padStart(5,'0'); }\nfunction key(x,y){ return x+','+y; }\nfunction validCell(x,y){\n  return x>=0 && x<COLS && y>=0 && y<ROWS &&\n         !collapsed.has(key(x,y)) && grid[y][x].t !== 'stone';\n}\nfunction hasValidMove(){\n  return DIR4.some(d => validCell(player.x+d[0], player.y+d[1]));\n}\n\n/* ================= 关卡生成 ================= */\nfunction pickMineral(y){\n  const elig = MINERALS.filter(m => y >= m.min && y <= m.max);\n  if (!elig.length) return null;\n  const chance = 0.30 + y * 0.006;   // 越深含矿率越高\n  if (Math.random() > chance) return null;\n  let tw = elig.reduce((s,m)=>s+m.w, 0), r = Math.random()*tw;\n  for (const m of elig){ r -= m.w; if (r <= 0) return m; }\n  return elig[elig.length-1];\n}\nfunction placeAir(y0, y1){\n  let guard = 0;\n  while (guard++ < 100){\n    const y = y0 + Math.floor(Math.random()*(y1-y0+1));\n    const x = Math.floor(Math.random()*COLS);\n    if (grid[y][x].t === 'dirt'){ grid[y][x] = { t:'air' }; return; }\n  }\n}\nfunction hasMineral(k){\n  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++){\n    const c = grid[y][x];\n    if (c.t==='ore' && c.m && c.m.k===k) return true;\n  }\n  return false;\n}\nfunction genLevel(){\n  seed = (Math.random()*1e9) >>> 0;\n  grid = []; collapsed = new Set();\n  for (let y=0; y<ROWS; y++){\n    const row = [];\n    for (let x=0; x<COLS; x++){\n      if (y === 0){ row.push({ t:'surf' }); continue; }          // 地表层\n      if (Math.random() < 0.11){ row.push({ t:'stone' }); continue; } // 硬岩（不可挖）\n      const m = pickMineral(y);\n      row.push(m ? { t:'ore', m } : { t:'dirt' });\n    }\n    grid.push(row);\n  }\n  /* 氧气罐：浅层与深层各放 4 个 */\n  for (let i=0;i<4;i++) placeAir(4, 13);\n  for (let i=0;i<4;i++) placeAir(14, ROWS-1);\n  /* 保底钻石：最深处必有两颗，作为终极目标 */\n  if (!hasMineral('diamond')){\n    for (let i=0;i<2;i++){\n      let g = 0;\n      while (g++ < 100){\n        const y = 20 + Math.floor(Math.random()*4);\n        const x = Math.floor(Math.random()*COLS);\n        if (grid[y][x].t === 'dirt'){ grid[y][x] = { illRect(bx+23, by+11-bob, 2, 2);\n}\nfunction drawStone(x, y){\n  const bx = x*CELL, by = y*CELL;\n  ctx.fillStyle = '#6a6e78'; ctx.fillRect(bx, by, CELL, CELL);\n  ctx.fillStyle = '#8b8f9a';\n  ctx.fillRect(bx, by, CELL, 4); ctx.fillRect(bx, by, 4, CELL);\n  ctx.fillStyle = '#4c4f58';\n  ctx.fillRect(bx, by+CELL-4, CELL, 4); ctx.fillRect(bx+CELL-4, by, 4, CELL);\n  ctx.fillStyle = '#3a3d46';\n  for (let i=0;i<3;i++){\n    const rx = 1+Math.floor(cellRand(x,y,200+i)*6);\n    const ry = 1+Math.floor(cellRand(x,y,230+i)*6);\n    ctx.fillRect(bx+rx*4, by+ry*4, 4, 4);\n  }\n}\nfunction drawRubble(x, y){\n  const bx = x*CELL, by = y*CELL;\n  ctx.fillStyle = '#1a120c'; ctx.fillRect(bx, by, CELL, CELL);\n  const cols = ['#3a2a1a', '#241a10', '#4a3520', '#2e2114'];\n  for (let i=0;i<9;i++){\n    const rx = Math.floor(cellRand(x, y, 300+i) * 8);\n    const ry = Math.floor(cellRand(x, y, 340+i) * 8);\n    ctx.fillStyle = cols[i % cols.length];\n    ctx.fillRect(bx+rx*4, by+ry*4, 4, 4);\n  }\n}\nfunction drawTunnel(x, y){\n  const bx = x*CELL, by = y*CELL;\n  ctx.fillStyle = '#17110c'; ctx.fillRect(bx, by, CELL, CELL);\n  ctx.fillStyle = '#241a12';\n  ctx.fillRect(bx, by, CELL, 3); ctx.fillRect(bx, by, 3, CELL);\n  ctx.fillStyle = '#0d0906';\n  ctx.fillRect(bx, by+CELL-3, CELL, 3); ctx.fillRect(bx+CELL-3, by, 3, CELL);\n}\nfunction drawSurfaceRow(){\n  /* 夜空 + 星星 + 草地（呼应页面星空主题） */\n  for (let x=0;x<COLS;x++){\n    const bx = x*CELL;\n    ctx.fillStyle = '#0d1526'; ctx.fillRect(bx, 0, CELL, CELL);\n    /* 确定性星星（每格 3 颗，随时间闪烁） */\n    for (let i=0;i<3;i++){\n      const sx = Math.floor(cellRand(x, 99, 20+i) * 8);\n      const sy = Math.floor(cellRand(x, 99, 40+i) * 6);\n      const tw = 0.3 + 0.7 * Math.abs(Math.sin(time*2 + cellRand(x,99,60+i)*6.28));\n      ctx.fillStyle = 'rgba(210,225,255,' + tw.toFixed(2) + ')';\n      ctx.fillRect(bx + sx*4, sy*4, 2, 2);\n    }\n  }\n  /* 像素月亮 + 光晕 */\n  const mx = W - 78, my = 8;\n  ctx.fillStyle = 'rgba(255,244,200,0.10)';\n  ctx.beginPath(); ctx.arc(mx+8, my+8, 19, 0, 6.29); ctx.fill();\n  ctx.fillStyle = '#ffeec2'; ctx.fillRect(mx, my, 16, 16);\n  ctx.fillStyle = '#f0d488';\n  ctx.fillRect(mx+4, my+4, 8, 8);\n  ctx.fillStyle = '#e2c270';\n  ctx.fillRect(mx+10, my+2, 4, 4); ctx.fillRect(mx+2, my+10, 4, 4);\n  /* 夜色草地 */\n  for (let x=0;x<COLS;x++){\n    const bx = x*CELL;\n    ctx.fillStyle = '#3f7d3f'; ctx.fillRect(bx, 20, CELL, 6);\n    ctx.fillStyle = '#2c5c2e'; ctx.fillRect(bx, 26, CELL, 2);\n    ctx.fillStyle = '#5d4530'; ctx.fillRect(bx, 28, CELL, 4);\n  }\n  /* 流星：每 7 秒划过一颗 */\n  const mPhase = (time % 7) / 7;\n  if (mPhase < 0.12){\n    const t = mPhase / 0.12;\n    const mstart = -30 + t * (W + 90);\n    const myy = 6 + t * 8;\n    ctx.strokeStyle = 'rgba(190,215,255,' + (0.9*(1-t)).toFixed(2) + ')';\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.moveTo(mstart, myy);\n    ctx.lineTo(mstart - 24, myy + 6);\n    ctx.stroke();\n    ctx.lineWidth = 1;\n  }\n}\n\n/* ================= 绘制：动态元素 ================= */\nfunction playerRenderPos(){\n  const t = player.anim > 0 ? 1 - player.anim/ANIM_MS : 1;\n  const e = t*t*(3-2*t);   // 平滑插值\n  return {\n    x: (player.fx + (player.x - player.fx) * e) * CELL,\n    y: (player.fy + (player.y - player.fy) * e) * CELL,\n  };\n}\nfunction drawPlayer(){\n  const p = playerRenderPos();\n  const moving = player.anim > 0;\n  const frame = moving ? Math.floor(time*14) % 2 : 0;\n  const bobY = moving ? 0 : Math.sin(time*2.5) * 1.5;\n  const map = frame ? M_WALK : M_IDLE;\n  /* 头灯光晕 */\n  const lampX = player.dir < 0 ? p.x + 4 : p.x + CELL - 8;\n  ctx.fillStyle = 'rgba(255,235,150,0.22)';\n  ctx.beginPath(); ctx.arc(lampX+2, p.y+16+bobY, 8, 0, 6.29); ctx.fill();\n  ctx.save();\n  if (player.dir < 0){\n    ctx.translate(p.x + CELL, 0); ctx.scale(-1, 1);\n    drawMap(map, 0, p.y + bobY);\n  } else {\n    drawMap(map, p.x, p.y + bobY);\n  }\n  ctx.restore();\n}\nfunction drawCrumbles(){\n  for (const c of crumbles){\n    const p = Math.min(1, c.t / 0.26);\n    const hgt = CELL * (1 - p);\n    ctx.fillStyle = 'rgba(90,64,40,' + (0.9*(1-p)).toFixed(3) + ')';\n    ctx.fillRect(c.x*CELL, c.y*CELL + CELL - hgt, CELL, hgt);\n  }\n}\nfunction drawHints(){\n  if (state !== 'playing') return;\n  const a = 0.15 + 0.07 * Math.sin(time*4);\n  ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';\n  for (const [dx,dy] of DIR4){\n    if (!validCell(player.x+dx, player.y+dy)) continue;\n    const cx = player.x*CELL + CELL/2 + dx*(CELL/2 - 5);\n    const cy = player.y*CELL + CELL/2 + dy*(CELL/2 - 5);\n    const s = 4;\n    ctx.beginPath();\n    ctx.moveTo(cx + dx*s, cy + dy*s);\n    ctx.lineTo(cx - dx*s*0.6 - dy*s*0.6, cy - dy*s*0.6 - dx*s*0.6);\n    ctx.lineTo(cx - dx*s*0.6 + dy*s*0.6, cy - dy*s*0.6 + dx*s*0.6);\n    ctx.closePath(); ctx.fill();\n  }\n}\nfunction drawDarkness(cx, cy){\n  const t = Math.min(1, player.y / (ROWS-1));\n  const a = 0.16 + 0.5 * t;   // 越深越黑\n  const r0 = CELL*2.2, r1 = CELL*5.2;\n  const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);\n  g.addColorStop(0, 'rgba(8,6,20,0)');\n  g.addColorStop(0.55, 'rgba(8,6,20,' + (a*0.55).toFixed(3) + ')');\n  g.addColorStop(1, 'rgba(8,6,20,' + a.toFixed(3) + ')');\n  ctx.fillStyle = g;\n  ctx.fillRect(0, 0, W, H);\n}\nfunction drawTwinkles(){\n  /* 矿物闪光画在黑暗层之上，充当引路的星火 */\n  for (let y=1;y<ROWS;y++){\n    for (let x=0;x<COLS;x++){\n      const c = grid[y][x];\n      if (collapsed.has(key(x,y))) continue;\n      if (c.t !== 'ore' && c.t !== 'air') continue;\n      const ph = cellRand(x, y, 9) * 6.283;\n      const s = Math.sin(time*2.3 + ph);\n      if (s <= 0.15) continue;\n      const a = Math.min(0.85, (s - 0.15) * 1.4);\n      const ox = x*CELL + 6 + Math.floor(cellRand(x, y, 11) * 5) * 4;\n      const oy = y*CELL + 6 + Math.floor(cellRand(x, y, 13) * 5) * 4;\n      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';\n      ctx.fillRect(ox, oy, 4, 4);\n      ctx.fillStyle = 'rgba(255,255,255,' + (a*0.45).toFixed(3) + ')';\n      ctx.fillRect(ox-4, oy, 4, 4); ctx.fillRect(ox+4, oy, 4, 4);\n      ctx.fillRect(ox, oy-4, 4, 4); ctx.fillRect(ox, oy+4, 4, 4);\n    }\n  }\n}\nfunction drawParticles(){\n  for (const p of particles){\n    const a = Math.max(0, p.life / p.life0);\n    ctx.globalAlpha = a;\n    ctx.fillStyle = p.color;\n    ctx.fillRect(p.x, p.y, p.size, p.size);\n  }\n  ctx.globalAlpha = 1;\n}\nfunction drawFloaters(){\n  if (!floaters.length) return;\n  ctx.font = 'bold 13px \"Courier New\", monospace';\n  ctx.textAlign = 'center';\n  for (const f of floaters){\n    const a = Math.min(1, f.life / 0.35);\n    const fx = f.x*CELL + CELL/2;\n    const fy = f.y*CELL + 10 - (0.9 - f.life) * 34;\n    ctx.globalAlpha = a;\n    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,7,18,0.9)';\n    ctx.strokeText(f.txt, fx, fy);\n    ctx.fillStyle = f.color;\n    ctx.fillText(f.txt, fx, fy);\n  }\n  ctx.globalAlpha = 1; ctx.textAlign = 'left';\n}\nfunction drawRedVignette(){\n  const pulse = Math.max(0, Math.sin(time*5.5));\n  const g = ctx.createRadialGradient(W/2, H/2, CELL*2.5, W/2, H/2, W*0.72);\n  g.addColorStop(0, 'rgba(255,30,50,0)');\n  g.addColorStop(1, 'rgba(255,30,50,' + (0.26 + 0.22*pulse).toFixed(3) + ')');\n  ctx.fillStyle = g;\n  ctx.fillRect(0, 0, W, H);\n}\n\n/* ================= 主渲染 ================= */\nfunction render(){\n  ctx.save();\n  ctx.fillStyle = '#0d0d1a';\n  ctx.fillRect(0, 0, W, H);\n  if (shake > 0.05){\n    ctx.translate((Math.random()-0.5)*shake*2, (Math.random()-0.5)*shake*2);\n  }\n  /* 地表行（天空+草地+云） */\n  drawSurfaceRow();\n  /* 网格 */\n  for (let y=0;y<ROWS;y++){\n    for (let x=0;x<COLS;x++){\n      if (y === 0){\n        if (collapsed.has(key(x,y))) drawRubble(x, y);\n        continue;\n      }\n      if (collapsed.has(key(x,y))){ drawRubble(x, y); continue; }\n      if (x === player.x && y === player.y){ drawTunnel(x, y); continue; }\n      const c = grid[y][x];\n      if (c.t === 'stone') drawStone(x, y);\n      else if (c.t === 'ore') drawOre(x, y, c.m);\n      else if (c.t === 'air') drawAir(x, y);\n      else drawDirt(x, y);\n    }\n  }\n  /* 深度标尺 */\n  ctx.font = '9px monospace';\n  ctx.fillStyle = 'rgba(190,175,230,0.4)';\n  for (let y=5;y<ROWS;y+=5){\n    ctx.fillText((y*2)+'m', 3, y*CELL + 10);\n  }\n  drawCrumbles();\n  drawHints();\n  drawPlayer();\n  drawParticles();\n  /* 头灯照明（玩家为中心的径向光） */\n  const pp = playerRenderPos();\n  drawDarkness(pp.x + CELL/2, pp.y + CELL/2);\n  drawTwinkles();\n  drawFloaters();\n  /* 低氧警告 */\n  if ((state === 'playing' || state === 'dying') && o2 < 25) drawRedVignette();\n  ctx.restore();\n}\n\n/* ================= HUD 更新 ================= */\nfunction updateHUD(){\n  o2fill.style.width = Math.max(0, o2) + '%';\n  o2fill.classList.toggle('low', o2 < 25);\n  o2num.textContent = Math.ceil(Math.max(0, o2));\n  scoreEl.textContent = pad5(score);\n  bestEl.textContent = pad5(best);\n  depthEl.textContent = player.y + '层';\n  const showCombo = combo >= 2 && comboTimer > 0;\n  comboEl.classList.toggle('hidden', !showCombo);\n  if (showCombo){\n    const t = '连击 ×' + Math.min(combo, 5);\n    if (comboEl.textContent !== t) comboEl.textContent = t;\n  }\n}\n\n/* ================= 主循环 ================= */\nfunction loop(ts){\n  requestAnimationFrame(loop);\n  if (!last) last = ts;\n  let dt = (ts - last) / 1000; last = ts;\n  if (dt > 0.05) dt = 0.05;\n  time += dt;\n  if (state === 'playing'){\n    /* 时间耗氧 */\n    o2 -= O2_DRAIN * dt;\n    if (o2 <= 0){ o2 = 0; die('o2'); }\n    /* 低氧心跳 */\n    if (state === 'playing' && o2 < 25 && time - lastBeat > 1.15){\n      lastBeat = time; sfx.heart();\n    }\n    if (player.anim > 0) player.anim = Math.max(0, player.anim - dt*1000);\n    if (state === 'playing' && player.anim <= 0 && moveQueue.length){\n      const q = moveQueue.shift();\n      doMove(q[0], q[1]);\n    }\n  } else if (player.anim > 0){\n    player.anim = Math.max(0, player.anim - dt*1000);\n  }\n  /* 粒子 */\n  for (let i=particles.length-1;i>=0;i--){\n    const p = particles[i];\n    p.life -= dt;\n    if (p.life <= 0){ particles.splice(i,1); continue; }\n    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.grav*dt;\n  }\n  /* 漂浮文字 */\n  for (let i=floaters.length-1;i>=0;i--){\n    floaters[i].life -= dt;\n    if (floaters[i].life <= 0) floaters.splice(i,1);\n  }\n  /* 塌落动画 */\n  for (let i=crumbles.length-1;i>=0;i--){\n    crumbles[i].t += dt;\n    if (crumbles[i].t > 0.26) crumbles.splice(i,1);\n  }\n  shake *= Math.pow(0.0005, dt);\n  if (shake < 0.05) shake = 0;\n  render();\n  updateHUD();\n}\n\n/* ================= 输入 ================= */\nconst KEY_DIRS = {\n  ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1],\n  ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0],\n};\nwindow.addEventListener('keydown', e => {\n  const d = KEY_DIRS[e.code];\n  if (d){\n    e.preventDefault();\n    if (e.repeat) return;          // 禁用长按连发：每步都要深思熟虑\n    sfx.init();\n    tryMove(d[0], d[1]);\n    return;\n  }\n  if (e.code === 'KeyR'){ e.preventDefault(); sfx.init(); startGame(); }\n  else if (e.code === 'KeyM'){ e.preventDefault(); toggleMute(); }\n  else if (e.code === 'KeyP'){ e.preventDefault(); togglePause(); }\n  else if (e.code === 'Enter' || e.code === 'Space'){\n    e.preventDefault(); sfx.init();\n    if (state === 'start' || state === 'over') startGame();\n  }\n});\n/* 触屏滑动 */\nlet tStart = null;\nstage.addEventListener('touchstart', e => {\n  sfx.init();\n  if (e.touches.length === 1) tStart = [e.touches[0].clientX, e.touches[0].clientY];\n}, { passive:true });\nstage.addEventListener('touchmove', e => {\n  if (state === 'playing') e.preventDefault();\n}, { passive:false });\nstage.addEventListener('touchend', e => {\n  if (!tStart) return;\n  const t = e.changedTouches[0];\n  const dx = t.clientX - tStart[0], dy = t.clientY - tStart[1];\n  tStart = null;\n  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24){\n    /* 轻点开始/重开：忽略面板内部的点击，交给按钮处理 */\n    const inPanel = e.target && e.target.closest && e.target.closest('.panel');\n    if ((state === 'start' || state === 'over') && !inPanel) startGame();\n    return;\n  }\n  if (Math.abs(dx) > Math.abs(dy)) tryMove(Math.sign(dx), 0);\n  else tryMove(0, Math.sign(dy));\n});\n/* 触屏方向键 */\nconst DPAD_MAP = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };\ndocument.querySelectorAll('#dpad button').forEach(b => {\n  b.addEventListener('pointerdown', e => {\n    e.preventDefault(); sfx.init();\n    const v = DPAD_MAP[b.dataset.d];\n    if (v) tryMove(v[0], v[1]);\n  });\n});\n/* 按钮 */\n$('btn-start').addEventListener('click', () => { sfx.init(); startGame(); });\n$('btn-again').addEventListener('click', () => { sfx.init(); startGame(); });\n$('btn-restart').addEventListener('click', () => { sfx.init(); startGame(); });\n$('btn-resume').addEventListener('click', () => togglePause());\n$('btn-mute').addEventListener('click', () => { sfx.init(); toggleMute(); });\n/* 切后台自动暂停 */\ndocument.addEventListener('visibilitychange', () => {\n  if (document.hidden && state === 'playing') togglePause();\n});\n\n/* ================= 启动 ================= */\ntry{ best = +localStorage.getItem('pixelMiner.best') || 0; }catch(e){ best = 0; }\nif (best > 0) $('start-best').textContent = '最佳纪录 ' + pad5(best) + ' —— 超越它！';\ngenLevel();   // 先生成一层矿井作为开始界面的背景\nrequestAnimationFrame(loop);\n<\/script>\n\n\n</body></html>\n"
