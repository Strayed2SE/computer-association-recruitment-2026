",role:\"先驱\",skill:\"The C Programming Language 奠基者\",rarity:\"传说\"},\n  {name:\"Linus 之影\",icon:\"🌟\",lang:\"C\",role:\"传奇\",skill:\"一行 C 代码改变世界，Git 与 Linux 之父\",rarity:\"传说\"}\n];\nconst RARITY={普通:{star:1},稀有:{star:3},史诗:{star:4},传说:{star:5}};\n\nconst BUGS=[\n  {lang:\"C\",title:\"字符串越界：漏写 \\\\0 终止符\",code:[\n    \"char greeting[5] = {'H','e','l','l','o'};\",\n    \"printf(\\\"%s\\\\n\\\", greeting);\"\n  ],bug:0,ex:\"第 1 行只存了 5 个字符但没有 '\\\\0' 终止符。printf 用 %s 输出时会一直读直到遇到 '\\\\0'，导致越界读取垃圾数据。应声明 char greeting[6] 并在末尾补 '\\\\0'，或直接用字符串字面量 \\\"Hello\\\"。\"},\n  {lang:\"C\",title:\"scanf 漏取地址符 &\",code:[\n    \"int age;\",\n    \"printf(\\\"请输入年龄: \\\");\",\n    \"scanf(\\\"%d\\\", age);\"\n  ],bug:2,ex:\"第 3 行 scanf 的第二个参数应为 &age（传入指针），而非 age（传入值）。漏写 & 会把 age 的值当作地址去写入，引发段错误或未定义行为。\"},\n  {lang:\"C\",title:\"悬垂指针：返回局部数组地址\",code:[\n    \"int* getArray() {\",\n    \"    int arr[3] = {1, 2, 3};\",\n    \"    return arr;\",\n    \"}\"\n  ],bug:2,ex:\"第 3 行返回了栈上局部数组的指针。函数返回后栈帧被回收，调用方拿到的是悬垂指针，解引用属于未定义行为。应改用 malloc 分配堆内存或传入外部缓冲区。\"},\n  {lang:\"C\",title:\"宏定义缺少括号导致优先级错误\",code:[\n    \"#define DOUBLE(x) x + x\",\n    \"int result = DOUBLE(5) * 3;\",\n    \"printf(\\\"%d\\\\n\\\", result);\"\n  ],bug:0,ex:\"第 1 行宏展开后为 5 + 5 * 3，因乘法优先级高于加法，结果为 20 而非 30。宏参数和整体都应加括号：#define DOUBLE(x) ((x) + (x))。\"}\n];\n\n/* ==================== 状态 ==================== */\nconst S={\n  score:0,\n  done:{quiz:false,wordle:false,gacha:false,bug:false},\n  quiz:{i:0,correct:0,lock:false},\n  wordle:{answer:\"\",grid:[],cur:\"\",over:false,done:false},\n  gacha:{draws:0,coll:new Set(),legend:0},\n  bug:{i:0,correct:0,lock:false}\n};\n\nfunction addScore(n){\n  S.score+=n;\n  const t=$(\"totalScore\");\n  t.textContent=S.score;t.classList.remove(\"pulse\");void t.offsetWidth;t.classList.add(\"pulse\");\n  $(\"doneCount\").textContent=doneCount();\n}\nfunction doneCount(){return Object.values(S.done).filter(Boolean).length;}\nfunction refreshDoneBadges(){\n  const m={quiz:\"知识问答\",wordle:\"代码词谜\",gacha:\"极客抽卡\",bug:\"Bug 猎人\"};\n  document.querySelectorAll(\"[data-done]\").forEach(b=>{\n    b.classList.toggle(\"show\",S.done[b.dataset.done]);\n  });\n}\n\n/* ==================== 首页 Hub ==================== */\nconst GAMES=[\n  {id:\"quiz\",icon:\"🧠\",name:\"知识问答\",ds:\"8 道 C 语言基础题，考验你的语言功底\"},\n  {id:\"wordle\",icon:\"🔤\",name:\"代码词谜\",ds:\"6 次机会猜出隐藏的 5 字母 C 语言词汇\"},\n  {id:\"gacha\",icon:\"🎴\",name:\"极客抽卡\",ds:\"召唤 C 语言程序员英雄卡，收集稀有角色\"},\n  {id:\"bug\",icon:\"🐛\",name:\"Bug 猎人\",ds:\"在 C 代码片段中精准定位 Bug 所在行\"}\n];\nfunction renderHub(){\n  const g=$(\"hubGrid\");g.innerHTML=\"\";\n  GAMES.forEach(o=>{\n    const b=document.createElement(\"button\");\n    b.className=\"gcard\";b.dataset.game=o.id;\n    b.innerHTML=`<div class=\"ico\">${o.icon}</div><div class=\"nm\">${o.name}</div><div class=\"ds\">${o.ds}</div>`+\n      (S.done[o.id]?`<span class=\"done-badge show\">已通关</span>`:\"\");\n    b.onclick=()=>openGame(o.id);\n    g.appendChild(b);\n  });\n  $(\"doneCount\").textContent=doneCount();\n}\nfunction openGame(id){\n  if(id===\"quiz\")initQuiz();\n  else if(id===\"wordle\")initWordle();\n  else if(id===\"gacha\")initGacha();\n  else if(id===\"bug\")initBug();\n}\n$(\"btnResult\").onclick=()=>showResult();\n$(\"btnReset\").onclick=()=>{if(confirm(\"确定重置全部进度？积分与通关状态将清空。\"))resetAll();};\nfunction resetAll(){\n  S.score=0;S.done={quiz:false,wordle:false,gacha:false,bug:false};\n  S.gacha={draws:0,coll:new Set(),legend:0};\n  $(\"totalScore\").textContent=\"0\";renderHub();showView(\"view-hub\");toast(\"进度已重置\");\n}\n\n/* ==================== 知识问答 ==================== */\nfunction initQuiz(){\n  S.quiz={i:0,correct:0,lock:false};\n  showView(\"view-quiz\");renderQuiz();\n}\nfunction renderQuiz(){\n  const q=QUIZ[S.quiz.i],st=S.quiz;\n  $(\"quizMeta\").textContent=`第 ${st.i+1} / ${QUIZ.length} 题 · 当前答对 ${st.correct}`;\n  $(\"quizQ\").textContent=q.q;\n  const box=$(\"quizOpts\");box.innerHTML=\"\";\n  q.opts.forEach((txt,i)=>{\n    const b=document.createElement(\"button\");\n    b.className=\"opt\";b.textContent=txt;\n    b.onclick=()=>answerQuiz(i,b);\n    box.appendChild(b);\n  });\n  $(\"quizFb\").classList.add(\"hidden\");\n  $(\"quizRow\").innerHTML=\"\";\n  $(\"quizBar\").style.width=(st.i/QUIZ.length*100)+\"%\";\n}\nfunction answerQuiz(i,btn){\n  if(S.quiz.lock)return;S.quiz.lock=true;\n  const q=QUIZ[S.quiz.i];const ok=i===q.ans;\n  const opts=[...$(\"quizOpts\").children];\n  opts.forEach((b,j)=>{\n    b.disabled=true;\n    if(j===q.ans)b.classList.add(\"ok\");\n    if(j===i&&!ok)b.classList.add(\"bad\");\n  });\n  if(ok)S.quiz.correct++;\n  const fb=$(\"quizFb\");fb.className=\"fb \"+(ok?\"good\":\"bad\");\n  fb.innerHTML=`${ok?\"✅ 回答正确\":\"❌ 答错了\"} — ${q.ex}`;\n  fb.classList.remove(\"hidden\");\n  $(\"quizBar\").style.width=((S.quiz.i+1)/QUIZ.length*100)+\"%\";\n  const row=$(\"quizRow\");row.innerHTML=\"\";\n  const next=document.createElement(\"button\");\n  next.className=\"btn\";\n  next.textContent=S.quiz.i+1<QUIZ.length?\"下一题 →\":\"查看结果\";\n  next.onclick=()=>{\n    if(S.quiz.i+1<QUIZ.length){S.quiz.i++;S.quiz.lock=false;renderQuiz();}\n    else finishQuiz();\n  };\n  row.appendChild(next);\n}\nfunction finishQuiz(){\n  if(!S.done.quiz){S.done.quiz=true;addScore(S.quiz.correct*10);}\n  else toast(\"已通关，不再重复计分\");\n  showResult();\n}\n\n/* ==================== 代码词谜 ==================== */\nfunction initWordle(){\n  S.wordle={answer:WORDS[Math.floor(Math.random()*WORDS.length)],grid:[],cur:\"\",over:false,done:false};\n  buildWGrid();buildWKb();$(\"wRow\").innerHTML=\"\";\n  showView(\"view-wordle\");\n}\nfunction buildWGrid(){\n  const g=$(\"wGrid\");g.innerHTML=\"\";\n  for(let r=0;r<6;r++){\n    for(let c=0;c<5;c++){\n      const cell=document.createElement(\"div\");\n      cell.className=\"wcell\";cell.dataset.r=r;cell.dataset.c=c;\n      g.appendChild(cell);\n    }\n  }\n}\nfunction buildWKb(){\n  const kb=$(\"wKb\");kb.innerHTML=\"\";\n  const rows=[\"QWERTYUIOP\",\"ASDFGHJKL\",\"ZXCVBNM\"];\n  rows.forEach((row,ri)=>{\n    if(ri===2){\n      const ent=document.createElement(\"button\");ent.className=\"btn sec wide\";ent.textContent=\"回车\";\n      ent.onclick=()=>submitGuess();kb.appendChild(ent);\n    }\n    [...row].forEach(ch=>{\n      const b=document.createElement(\"button\");b.textContent=ch;b.dataset.k=ch;\n      b.onclick=()=>typeLetter(ch);kb.appendChild(b);\n    });\n    if(ri===2){\n      const del=document.createElement(\"button\");del.className=\"btn warn wide\";del.textContent=\"⌫\";\n      del.onclick=()=>delLetter();kb.appendChild(del);\n    }\n  });\n}\nfunction curRowEl(){return document.querySelectorAll('#wGrid .wcell').length?[...document.querySelectorAll('#wGrid .wcell')].slice(S.wordle.grid.length*5,(S.wordle.grid.length+1)*5):[];}\nfunction typeLetter(ch){\n  if(S.wordle.over)return;\n  if(S.wordle.cur.length>=5)return;\n  S.wordle.cur+=ch;\n  const cells=curRowEl();\n  cells[S.wordle.cur.length-1].textContent=ch;\n  cells[S.wordle.cur.length-1].classList.add(\"filled\");\n}\nfunction delLetter(){\n  if(S.wordle.over||!S.wordle.cur)return;\n  const cells=curRowEl();\n  const i=S.wordle.cur.length-1;\n  cells[i].textContent=\"\";cells[i].classList.remove(\"filled\");\n  S.wordle.cur=S.wordle.cur.slice(0,-1);\n}\nfunction submitGuess(){\n  const w=S.wordle;\n  if(w.over)return;\n  if(w.cur.length<5){shakeRow();toast(\"请输入 5 个字母\");return;}\n  if(!DICT.has(w.cur)){shakeRow();toast(\"词库中没有这个词\");return;}\n  const guess=w.cur;const ans=w.answer;\n  const res=Array(5).fill(\"miss\");const ansArr=ans.split(\"\");\n  for(let i=0;i<5;i++)if(guess[i]===ansArr[i]){res[i]=\"hit\";ansArr[i]=null;}\n  for(let i=0;i<5;i++){if(res[i]===\"hit\")continue;const j=ansArr.indexOf(guess[i]);if(j!==-1){res[i]=\"near\";ansArr[j]=null;}}\n  const cells=curRowEl();\n  res.forEach((st,i)=>{\n    setTimeout(()=>{\n      cells[i].classList.add(\"flip\");\n      setTimeout(()=>{cells[i].classList.remove(\"filled\");cells[i].classList.add(st);},180);\n    },i*180);\n    const kb=document.querySelector('#wKb button[data-k=\"'+guess[i]+'\"]');\n    if(kb){const cur=kb.dataset.s||\"\";const ord={hit:3,near:2,miss:1};\n      if(ord[st]>(ord[cur]||0)){kb.dataset.s=st;kb.className=st;}\n    }\n  });\n  w.grid.push(guess);w.cur=\"\";\n  setTimeout(()=>{\n    if(guess===ans){w.over=true;finishWordle(true);}\n    else if(w.grid.length>=6){w.over=true;finishWordle(false);}\n  },5*180+120);\n}\nfunction shakeRow(){curRowEl().forEach(c=>{c.classList.add(\"shake\");setTimeout(()=>c.classList.remove(\"shake\"),400);});}\nfunction finishWordle(win){\n  if(!S.done.wordle){\n    S.done.wordle=true;\n    let sc=win?40:0;\n    if(win)sc+=Math.max(0,6-S.wordle.grid.length)*5;\n    addScore(sc);\n  }else toast(\"已通关，不再重复计分\");\n  const row=$(\"wRow\");row.innerHTML=\"\";\n  const msg=win?`✅ 漂亮！${S.wordle.grid.length} 步猜中 ${S.wordle.answer}`:`❌ 答案是 ${S.wordle.answer}，下次加油`;\n  row.insertAdjacentHTML(\"beforeend\",`<span class=\"fb ${win?'good':'bad'}\" style=\"flex:1\">${msg}</span>`);\n  const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"查看战报\";b.onclick=showResult;\n  row.appendChild(b);\n}\ndocument.addEventListener(\"keydown\",(e)=>{\n  if($(\"view-wordle\").classList.contains(\"hidden\"))return;\n  const k=e.key;\n  if(k===\"Enter\"){e.preventDefault();submitGuess();}\n  else if(k===\"Backspace\"){e.preventDefault();delLetter();}\n  else if(/^[a-zA-Z]$/.test(k)){typeLetter(k.toUpperCase());}\n});\n\n/* ==================== 极客抽卡 ==================== */\nfunction rollRarity(){\n  const r=Math.random()*100;\n  if(r<3)return \"传说\";\n  if(r<12)return \"史诗\";\n  if(r<40)return \"稀有\";\n  return \"普通\";\n}\nfunction pickCard(rarity){\n  const pool=CARDS.filter(c=>c.rarity===rarity);\n  return pool[Math.floor(Math.random()*pool.length)];\n}\nfunction drawCards(n){\n  const stage=$(\"gStage\");stage.innerHTML=\"\";\n  let tip=document.createElement(\"div\");tip.className=\"summon-tip\";tip.textContent=\"✨ 召唤中…\";\n  stage.appendChild(tip);\n  let list=[];\n  for(let i=0;i<n;i++)list.push(pickCard(rollRarity()));\n  if(n===10&&!list.some(c=>c.rarity!==\"普通\")){list[0]=pickCard(\"稀有\");}/* 十连保底 */\n  const before=new Set(S.gacha.coll);/* 抽取前的图鉴快照，用于计算新角色 */\n  setTimeout(()=>{\n    stage.innerHTML=\"\";\n    let legendCount=0,newUnique=0;\n    list.forEach((c,idx)=>{\n      if(!before.has(c.name))newUnique++;\n      S.gacha.coll.add(c.name);\n      if(c.rarity===\"传说\"){S.gacha.legend++;legendCount++;}\n      const card=document.createElement(\"div\");\n      card.className=`gacha-card r-${c.rarity}`;\n      card.style.animationDelay=(idx*70)+\"ms\";\n      card.innerHTML=`\n        <div class=\"r-tag\">${c.rarity}</div>\n        <div class=\"r-ico\">${c.icon}</div>\n        <div class=\"r-name\">${c.name}</div>\n        <div class=\"r-role\">${c.role}</div>\n        <div class=\"r-skill\">${c.skill}</div>\n        <div class=\"r-lang\">${c.lang}</div>\n        <div class=\"stars\">${\"★\".repeat(RARITY[c.rarity].star)}</div>`;\n      stage.appendChild(card);\n    });\n    S.gacha.draws+=n;\n    /* 计分：每抽 +2，新角色 +10，传说额外 +30（达成 10 抽后不再重复计分） */\n    if(!S.done.gacha){\n      addScore(n*2+newUnique*10+legendCount*30);\n    }\n    $(\"gDraws\").textContent=S.gacha.draws;\n    $(\"gColl\").textContent=S.gacha.coll.size;\n    $(\"gLegend\").textContent=S.gacha.legend;\n    if(S.gacha.draws>=10){S.done.gacha=true;}\n    if(list.some(c=>c.rarity===\"传说\"))toast(\"🌟 传说降临！\");\n    else if(list.some(c=>c.rarity===\"史诗\"))toast(\"✨ 获得史诗角色！\");\n  },650);\n}\nfunction initGacha(){\n  $(\"gTotal\").textContent=CARDS.length;\n  $(\"gDraws\").textContent=S.gacha.draws;\n  $(\"gColl\").textContent=S.gacha.coll.size;\n  $(\"gLegend\").textContent=S.gacha.legend;\n  $(\"gStage\").innerHTML= S.gacha.draws===0?'<div class=\"sub\" style=\"text-align:center;flex:1\">点击下方按钮，召唤你的第一张英雄卡</div>':\"\";\n  showView(\"view-gacha\");\n}\n$(\"gPull1\").onclick=()=>drawCards(1);\n$(\"gPull10\").onclick=()=>drawCards(10);\n\n/* ==================== Bug 猎人 ==================== */\nfunction initBug(){\n  S.bug={i:0,correct:0,lock:false};\n  showView(\"view-bug\");renderBug();\n}\nfunction renderBug(){\n  const b=BUGS[S.bug.i],st=S.bug;\n  $(\"bugMeta\").textContent=`第 ${st.i+1} / ${BUGS.length} 关 · 已定位 ${st.correct}`;\n  $(\"bugTitle\").textContent=b.title;\n  $(\"bugLang\").textContent=\"[\"+b.lang+\"]\";\n  const snip=$(\"bugSnip\");snip.innerHTML=\"\";\n  b.code.forEach((line,i)=>{\n    const d=document.createElement(\"div\");d.className=\"snip-line\";\n    d.innerHTML=`<span class=\"ln\">${i+1}</span><span class=\"code\"></span>`;\n    d.querySelector(\".code\").textContent=line;\n    d.onclick=()=>answerBug(i,d);\n    snip.appendChild(d);\n  });\n  $(\"bugFb\").classList.add(\"hidden\");\n  $(\"bugRow\").innerHTML=\"\";\n}\nfunction answerBug(i,el){\n  if(S.bug.lock)return;S.bug.lock=true;\n  const b=BUGS[S.bug.i];const ok=i===b.bug;\n  const lines=[...$(\"bugSnip\").children];\n  lines.forEach((d,j)=>{\n    d.onclick=null;\n    if(j===b.bug)d.classList.add(\"ok\");\n    else if(j===i&&!ok)d.classList.add(\"bad\");\n    if(ok&&j!==b.bug)d.classList.add(\"dim\");\n  });\n  if(ok)S.bug.correct++;\n  const fb=$(\"bugFb\");fb.className=\"fb \"+(ok?\"good\":\"bad\");\n  fb.innerHTML=`${ok?\"✅ 精准命中\":\"❌ 找错位置了\"} — ${b.ex}`;\n  fb.classList.remove(\"hidden\");\n  const row=$(\"bugRow\");row.innerHTML=\"\";\n  const next=document.createElement(\"button\");next.className=\"btn\";\n  next.textContent=S.bug.i+1<BUGS.length?\"下一关 →\":\"查看战报\";\n  next.onclick=()=>{if(S.bug.i+1<BUGS.length){S.bug.i++;S.bug.lock=false;renderBug();}else finishBug();};\n  row.appendChild(next);\n}\nfunction finishBug(){\n  if(!S.done.bug){S.done.bug=true;addScore(S.bug.correct*15);}\n  else toast(\"已通关，不再重复计分\");\n  showResult();\n}\n\n/* ==================== 战报 ==================== */\nfunction rankOf(sc){\n  if(sc>=320)return{crown:\"👑\",rk:\"C 语言宗师\",c:\"你已踏入 CodeHunter 的殿堂，协会向你敞开核心组的大门。\"};\n  if(sc>=240)return{crown:\"🏛️\",rk:\"内核骇客\",c:\"指针与内存信手拈来，欢迎成为协会系统底层骨干。\"};\n  if(sc>=160)return{crown:\"⚙️\",rk:\"C 高级工程师\",c:\"功底扎实，协会期待与你共建项目。\"};\n  if(sc>=80)return{crown:\"🔧\",rk:\"C 初级工程师\",c:\"基础不错，协会陪你继续进阶。\"};\n  return{crown:\"🌱\",rk:\"指针学徒\",c:\"路才刚开始，协会正是为你准备的舞台。\"};\n}\nfunction showResult(){\n  showView(\"view-result\");\n  const r=rankOf(S.score);\n  $(\"rankBox\").innerHTML=`<div class=\"crown\">${r.crown}</div><div class=\"rk\">${r.rk}</div><div class=\"sc\">总积分 ${S.score} · 通关 ${doneCount()}/4</div><p style=\"margin-top:8px\">${r.c}</p>`;\n  const games=[\n    {k:\"quiz\",n:\"知识问答\",done:S.done.quiz,extra:S.quiz.correct!=null?`答对 ${S.quiz.correct}/${QUIZ.length}`:\"未挑战\"},\n    {k:\"wordle\",n:\"代码词谜\",done:S.done.wordle,extra:\"\"},\n    {k:\"gacha\",n:\"极客抽卡\",done:S.done.gacha,extra:`召唤 ${S.gacha.draws} · 图鉴 ${S.gacha.coll.size}/${CARDS.length}`},\n    {k:\"bug\",n:\"Bug 猎人\",done:S.done.bug,extra:S.bug.correct!=null?`定位 ${S.bug.correct}/${BUGS.length}`:\"未挑战\"}\n  ];\n  const g=$(\"scoreGrid\");g.innerHTML=\"\";\n  games.forEach(o=>{\n    const d=document.createElement(\"div\");\n    d.className=\"si \"+(o.done?\"done\":\"todo\");\n    d.innerHTML=`<div class=\"k\">${o.done?\"✅\":\"◻️\"} ${o.n}</div><div class=\"v\">${o.done?o.extra:\"未通关\"}</div>`;\n    g.appendChild(d);\n  });\n  $(\"cta\").innerHTML=doneCount()===4\n    ?\"🎉 恭喜通关全部 4 个游戏！扫码或联系协会负责人领取你的专属招新身份卡。\"\n    :\"完成全部关卡解锁专属招新身份卡 → 计算机协会期待你的加入。\";\n}\n$(\"rBack\").onclick=()=>{renderHub();showView(\"view-hub\");};\n$(\"rReset\").onclick=()=>resetAll();\n\n/* 返回按钮 */\ndocument.querySelectorAll(\"[data-back]\").forEach(b=>b.onclick=()=>{renderHub();showView(\"view-hub\");});\n\n/* ==================== 招新入口（工作台内联） ==================== */\nfunction gotoAbout(){\n  try{\n    if(window.parent && window.parent !== window){\n      window.parent.postMessage({ type:\"goto\", id:\"about\" }, \"*\");\n    }\n  }catch(e){ /* 单开本页时静默忽略 */ }\n}\n(function(){\n  var b1 = document.getElementById(\"btnJoin\");\n  i 线</span>\n          <span class=\"gname\">地牢消消乐</span>\n          <span class=\"gdesc\">三消就是攻击手段，连锁到第 3 波伤害直接翻四倍。</span>\n          <span class=\"gplay\">开始玩 →</span>\n        </button>\n        <button class=\"gcard\" data-go=\"hunter\">\n          <span class=\"gtag\">C 语言四关</span>\n          <span class=\"gname\">极客挑战</span>\n          <span class=\"gdesc\">四个 C 语言小关串成一条闯关线：答题、猜词、抽卡、找 Bug，最后出一份战报。</span>\n          <span class=\"gplay\">开始玩 →</span>\n        </button>\n    </div>\n  </div>\n\n  <div class=\"sect\" id=\"joinsec\">\n    <h2>加入我们</h2>\n    <p class=\"sub\">扫码进群，备注「姓名 + 专业」即可。</p>\n    <div class=\"joincard\">\n      <div class=\"info\">\n        <h3>计算机协会招新群</h3>\n        <span class=\"no\">群号 1098557720</span>\n        <p class=\"hint\">\n          用手机 QQ 扫描右侧二维码直接进群。<br>\n          扫不出来也可以在 QQ 里搜索群号 <b>1098557720</b>。<br>\n          群里有往届的项目源码、比赛信息和技术分享。\n        </p>\n      </div>\n      <div class=\"qrbox\">\n        <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAAJYBAMAAABMSIXvAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+viUYcLcKakFicD6Q9ArFIEtBxopAiQLZIOYWuA2EkQtg2IXV5SUAJkB4DYRSFBzkB2CpCtkY7ETkJiJxcUgdT3ANk2uTmlyQh3M/Ck5oUGA2kOIJZhKGYIYnBncAL5H6IkfxEDg8VXBgbmCQixpJkMDNtbGRgkbiHEVBYwMPC3MDBsO48QQ4RJQWJRIliIBYiZ0tIYGD4tZ2DgjWRgEL7AwMAVDQsIHG5TALvNnSEfCNMZchhSgSKeDHkMyQx6QJYRgwGDIYMZAKbWPz9HbOBQAAAAMFBMVEX8/Pz7+fv5+fv5+fn6+vX7+Pn89vj3+/n3+frt/P3e7fq/v/Vw1/WAxfebu/iGvfw6JfAnAAEAAElEQVR42uz9e3xc1XU2jj/7zEiasWXN3jOyLckXnTkS4AugGckEMASPZDkNAWIZMGmSNog0OG3TBpMbad++hfSaSxOgTd82pAkibdMmxlgmtzbI1pgECLEljQxINkhnjoTxyJZm9h75opE0c/b3j3PmopuRHN7f932/P+aTT3yYGZ05Z521117rWc9aizTg3ddiX8q7InhXWO8K611hvSusd4X1rrDeFcG7wnpXWO8K611hvSusd4X1rgjeFda7wnpXWO8K611hvSusd0XwrrDeFda7wnpXWO8K611hvSuCd4X1rrDeFdb/RS/n/3/eNqEA+LuatagXzf3fu8J612a9ky+R+793bdbbvrgEIOi7wlrMS/L/Hy/DpfyezP1f4UIQMz+/1J/Lxa2sxV7K5QnNUfW2X9E5zA9omqajoaryheKPbt68efPGKX+VNr1V15G+8UWYF12XOkHRHVOOog9eOUnWNfUBgHrdtZPEW5kMkDUeYVyruFNQnJ7S2yY9AsCFe84 var frame  = document.getElementById('frame');
var tabsEl = document.getElementById('tabs');
var hintEl = document.getElementById('hint');
var cur = -1;
var ABOUT_INDEX = GAMES.length - 1;

GAMES.forEach(function(g, i){
  var b = document.createElement('button');
  b.className = 'tab' + (i === ABOUT_INDEX ? ' about divide' : '');
  b.innerHTML = '<span class="nm">' + g.name + '</span><span class="tg">' + g.tag + '</span>';
  b.onclick = function(){ mount(i); };
  tabsEl.appendChild(b);
});

function mount(i){
  cur = i;

  hintEl.textContent = g.tip;
  frame.srcdoc = g.html;
  document.title = g.name + ' · 计算机协会';
  try{ history.replaceState(null, '', '#' + g.id); }catch(e){}
}

frame.addEventListener('load', function(){
  try{ frame.contentWindow.focus(); }catch(e){}
});

var KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ',
            'w','a','s','d','W','A','S','D','p','P','r','R','n','N'];

document.addEventListener('keydown', function(e){
  if(document.activeElement === frame) return;
  if(KEYS.indexOf(e.key) < 0) return;
  try{
    var w = frame.contentWindow;
    if(!w) return;
    var ev = new w.KeyboardEvent('keydown', {
      key: e.key, code: e.code, keyCode: e.keyCode, which: e.which,
      bubbles: true, cancelable: true
    });
    w.dispatchEvent(ev);
  }catch(err){}
  if(e.key.indexOf('Arrow') === 0) e.preventDefault();
});

// 介绍页里的「开始玩」用 postMessage 通知外层切标签
window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || d.type !== 'goto') return;
  for(var i = 0; i < GAMES.length; i++){
    if(GAMES[i].id === d.id){ mount(i); return; }
  }
});

document.getElementById('reload').onclick = function(){ mount(cur); };
document.getElementById('join').onclick = function(){
  mount(ABOUT_INDEX);
  setTimeout(function(){
    try{ frame.contentWindow.postMessage({ type:'join' }, '*'); }catch(e){}
  }, 420);
};

var startId = (location.hash || '').slice(1);
var startIdx = 0;
for(var j = 0; j < GAMES.length; j++) if(GAMES[j].id === startId) startIdx = j;
mount(startIdx);
</script>
</body>
</html>
