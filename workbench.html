    "tip": "← → 移动，空格 / ↑ 跳跃；踩踏敌人可以消灭它们",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>计算机协会 · 像素冒险</title>\n<style>\n* { margin: 0; padding: 0; box-sizing: border-box; }\nbody {\n  background: #1a1a2e;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  min-height: 100vh;\n  font-family: 'Courier New', monospace;\n  color: #e0e0e0;\n  overflow: hidden;\n}\n\n.game-wrapper {\n  position: relative;\n  width: 800px;\n  max-width: 95vw;\n}\n\n#title-bar {\n  text-align: center;\n  margin-bottom: 12px;\n}\n#title-bar h1 {\n  font-size: 1.4rem;\n  color: #4ecca3;\n  letter-spacing: 4px;\n  text-shadow: 2px 2px 0px #1a1a2e, 0 0 20px rgba(78,204,163,0.3);\n}\n#title-bar .subtitle {\n  font-size: 0.7rem;\n  color: #888;\n  margin-top: 4px;\n  letter-spacing: 2px;\n}\n\n#game-container {\n  position: relative;\n  width: 100%;\n  border: 3px solid #4ecca3;\n  border-radius: 4px;\n  box-shadow: 0 0 30px rgba(78,204,163,0.15), inset 0 0 0 1px rgba(78,204,163,0.1);\n  background: #0d0d1a;\n  overflow: hidden;\n}\n\n#game-canvas {\n  display: block;\n  width: 100%;\n  height: auto;\n  image-rendering: pixelated;\n  image-rendering: -moz-crisp-edges;\n  image-rendering: crisp-edges;\n}\n\n/* HUD */\n#hud {\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  padding: 10px 16px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 0.8rem;\n  pointer-events: none;\n  z-index: 10;\n}\n.hud-item {\n  background: rgba(13,13,26,0.7);\n  padding: 4px 12px;\n  border-radius: 4px;\n  border: 1px solid rgba(78,204,163,0.3);\n  color: #4ecca3;\n  font-weight: bold;\n  letter-spacing: 1px;\n}\n.hud-item .icon { margin-right: 4px; }\n\n/* Overlay screens */\n.overlay {\n  position: absolute;\n  top: 0; left: 0; right: 0; bottom: 0;\n  background: rgba(13,13,26,0.92);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  z-index: 20;\n  text-align: center;\n  padding: 20px;\n}\n.overlay h2 {\n  font-size: 1.8rem;\n  color: #4ecca3;\n  margin-bottom: 12px;\n  letter-spacing: 3px;\n  text-shadow: 0 0 20px rgba(78,204,163,0.4);\n}\n.overlay p {\n  color: #aaa;\n  font-size: 0.9rem;\n  margin-bottom: 8px;\n  line-height: 1.6;\n}\n.overlay .controls-hint {\n  margin-top: 16px;\n  padding: 16px 24px;\n  background: rgba(78,204,163,0.08);\n  border: 1px solid rgba(78,204,163,0.2);\n  border-radius: 8px;\n  font-size: 0.8rem;\n}\n.overlay .controls-hint .key {\n  display: inline-block;\n  background: #4ecca3;\n  color: #1a1a2e;\n  padding: 2px 8px;\n  border-radius: 3px;\n  font-weight: bold;\n  margin: 0 2px;\n}\n.overlay .start-btn {\n  margin-top: 24px;\n  padding: 12px 40px;\n  font-family: inherit;\n  font-size: 1rem;\n  font-weight: bold;\n  letter-spacing: 2px;\n  color: #1a1a2e;\n  background: #4ecca3;\n  border: none;\n  border-radius: 4px;\n  cursor: pointer;\n  transition: all 0.2s;\n}\n.overlay .start-btn:hover {\n  background: #5fd9b0;\n  transform: scale(1.05);\n  box-shadow: 0 0 20px rgba(78,204,163,0.4);\n}\n.overlay .stat-row {\n  display: flex;\n  gap: 30px;\n  margin-top: 16px;\n}\n.overlay .stat {\n  text-align: center;\n}\n.overlay .stat .num {\n  font-size: 1.6rem;\n  color: #4ecca3;\n  font-weight: bold;\n}\n.overlay .stat .label {\n  font-size: 0.7rem;\n  color: #888;\n  margin-top: 2px;\n}\n.overlay .best-row {\n  margin-top: 16px;\n  display: flex;\n  gap: 24px;\n  font-size: 0.85rem;\n  color: #aaa;\n  letter-spacing: 1px;\n}\n.overlay .best-row .best-val {\n  color: #ffd700;\n  font-weight: bold;\n}\n.overlay .new-record {\n  margin-top: 14px;\n  color: #ffd700;\n  font-size: 1.1rem;\n  letter-spacing: 3px;\n  text-shadow: 0 0 12px rgba(255,215,0,0.6);\n  animation: pulse 0.8s infinite alternate;\n}\n@keyframes pulse {\n  from { opacity: 0.6; transform: scale(0.96); }\n  to { opacity: 1; transform: scale(1.04); }\n}\n\n.hidden { display: none !important; }\n\n#footer-bar {\n  margin-top: 10px;\n  text-align: center;\n  font-size: 0.7rem;\n  color: #555;\n  letter-spacing: 1px;\n}\n\n/* Mobile controls */\n#mobile-controls {\n  display: none;\n  justify-content: space-between;\n  margin-top: 12px;\n  padding: 0 8px;\n}\n.touch-btn {\n  width: 60px;\n  height: 60px;\n  border-radius: 50%;\n  background: rgba(78,204,163,0.15);\n  border: 2px solid rgba(78,204,163,0.4);\n  color: #4ecca3;\n  font-size: 1.5rem;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  user-select: none;\n  -webkit-user-select: none;\n  touch-action: none;\n}\n.touch-btn:active { background: rgba(78,204,163,0.3); }\n.touch-left-group { display: flex; gap: 12px; }\n\n@media (max-width: 600px) {\n  #mobile-controls { display: flex; }\n  #title-bar h1 { font-size: 1rem; }\n}\n</style>\n\n<style>\n  /* ==== 工作台内嵌适配（由 _adapt-pixel.js 注入） ==== */\n  html,body{height:100%}\n  body{\n    min-height:0;padding:10px;justify-content:center;\n    /* 和工作台外壳、其他四个游戏共用同一套底色，嵌进去看不出接缝 */\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(78,204,163,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(233,69,96,.08) 0%, rgba(233,69,96,0) 60%),\n      #0d0d1a;\n  }\n  /* 画布 16:9：宽度同时受 视口宽 / 视口高 约束，永远不会被纵向裁切 */\n  .game-wrapper{width:min(800px, 95vw, calc((100vh - 128px) * 16 / 9))}\n  #title-bar{margin-bottom:8px}\n  #footer-bar{margin-top:6px}\n  @media (max-height:600px){\n    #title-bar .subtitle{display:none}\n    #footer-bar{display:none}\n    .game-wrapper{width:min(800px, 95vw, calc((100vh - 66px) * 16 / 9))}\n  }\n  @media (max-height:420px){\n    #title-bar{display:none}\n    .game-wrapper{width:min(800px, 95vw, calc((100vh - 20px) * 16 / 9))}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"game-wrapper\">\n  <div id=\"title-bar\">\n    <h1>像素冒险</h1>\n    <div class=\"subtitle\">COMPUTER SCIENCE CLUB · RECRUITMENT DEMO</div>\n  </div>\n\n  <div id=\"game-container\">\n    <canvas id=\"game-canvas\" width=\"800\" height=\"450\"></canvas>\n\n    <!-- HUD -->\n    <div id=\"hud\" class=\"hidden\">\n      <div class=\"hud-item\"><span class=\"icon\">⚑</span><span id=\"level-display\">1/1</span></div>\n      <div class=\"hud-item\"><span class=\"icon\">★</span><span id=\"score-display\">0</span></div>\n      <div class=\"hud-item\"><span class=\"icon\">♥</span><span id=\"lives-display\">5</span></div>\n      <div class=\"hud-item\"><span class=\"icon\">⏱</span><span id=\"time-display\">0:00</span></div>\n    </div>\n\n    <!-- Start screen -->\n    <div id=\"start-screen\" class=\"overlay\">\n      <h2>像素冒险</h2>\n      <p>收集所有星星，到达终点旗帜！</p>\n      <p>小心陷阱和敌人~</p>\n      <div class=\"controls-hint\">\n        <div style=\"margin-bottom:6px;\"><span class=\"key\">←</span> <span class=\"key\">→</span> 移动 &nbsp; <span class=\"key\">空格</span> / <span class=\"key\">↑</span> 跳跃</div>\n        <div>踩踏敌人可以消灭它们！</div>\n      </div>\n      <button class=\"start-btn\" id=\"start-btn\">开始游戏</button>\n    </div>\n\n    <!-- Level intro screen -->\n    <div id=\"level-screen\" class=\"overlay hidden\">\n      <h2 id=\"level-num\">第 1 关</h2>\n      <p id=\"level-name\"></p>\n    </div>\n\n    <!-- Win screen -->\n    <div id=\"win-screen\" class=\"overlay hidden\">\n      <h2>通关！</h2>\n      <p>恭喜你完成了像素冒险！</p>\n      <div class=\"stat-row\">\n        <div class=\"stat\"><div class=\"num\" id=\"win-score\">0</div><div class=\"label\">得分</div></div>\n        <div class=\"stat\"><div class=\"num\" id=\"win-time\">0:00</div><div class=\"label\">用时</div></div>\n        <div class=\"stat\"><div class=\"num\" id=\"win-stars\">0/0</div><div class=\"label\">星星</div></div>\n      </div>\n      <div class=\"best-row\">\n        <div>最佳得分 <span class=\"best-val\" id=\"best-score\">0</span></div>\n        <div>最佳时间 <span class=\"best-val\" id=\"best-time\">-</span></div>\n      </div>\n      <div id=\"new-record\" class=\"new-record hidden\">★ 新纪录！</div>\n      <button class=\"start-btn\" id=\"replay-btn\">再玩一次</button>\n    </div>\n\n    <!-- Game over screen -->\n    <div id=\"gameover-screen\" class=\"overlay hidden\">\n      <h2 style=\"color:#e94560;\">GAME OVER</h2>\n      <p>别灰心，再试一次吧！</p>\n      <button class=\"start-btn\" id=\"retry-btn\">重新开始</button>\n    </div>\n  </div>\n\n  <div id=\"mobile-controls\">\n    <div class=\"touch-left-group\">\n      <div class=\"touch-btn\" id=\"btn-left\">◀</div>\n      <div class=\"touch-btn\" id=\"btn-right\">▶</div>\n    </div>\n    <div class=\"touch-btn\" id=\"btn-jump\">▲</div>\n  </div>\n\n  <div id=\"footer-bar\">计算机协会招新 Demo · 用键盘或触屏操作 · 欢迎加入我们一起做游戏</div>\n</div>\n\n<script>\n(function() {\n  const canvas = document.getElementById('game-canvas');\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width;\n  const H = canvas.height;\n\n  // Game constants\n  const GRAVITY = 0.55;\n  const JUMP_POWER = -12;\n  const MOVE_SPEED = 3.5;\n  const TILE = 32;\n  const LW = 96; // level width in tiles\n  const KEY_BEST_SCORE = 'pixel-adventure-best-score';\n  const KEY_BEST_TIME = 'pixel-adventure-best-time';\n\n  // --- Local storage helper (safe fallback) ---\n  const store = {\n    get(key, fallback) {\n      try { const v = localStorage.getItem(key); return v === null ? fallback : v; }\n      catch (e) { return fallback; }\n    },\n    set(key, val) {\n      try { localStorage.setItem(key, val); } catch (e) {}\n    }\n  };\n\n  // --- Audio (Web Audio synthesis, no files needed) ---\n  let audioCtx = null;\n  function initAudio() {\n    // srcdoc iframe 里没有用户手势 / 隐私模式下 AudioContext 可能构造失败，\n    // 整段包起来，失败就静默降级为无声，不能让它把开局流程带崩。\n    try {\n      if (!audioCtx) {\n        const AC = window.AudioContext || window.webkitAudioContext;\n        if (AC) audioCtx = new AC();\n      }\n      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();\n    } catch (e) { audioCtx = null; }\n  }\n  function tone(freq, dur, type, vol, delay, slideTo) {\n    if (!audioCtx) return;\n    const t = audioCtx.currentTime + (delay || 0);\n    const osc = audioCtx.createOscillator();\n    const gain = audioCtx.createGain();\n    osc.type = type || 'square';\n    osc.frequency.setValueAtTime(freq, t);\n    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);\n    gain.gain.setValueAtTime(0.0001, t);\n    gain.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    osc.connect(gain);\n    gain.connect(audioCtx.destination);\n    osc.start(t);\n    osc.stop(t + dur + 0.02);\n  }\n  function sfx(name) {\n    if (!audioCtx) return;\n    switch (name) {\n      case 'jump':    tone(300, 0.15, 'square', 0.06, 0, 620); break;\n      case 'star':    tone(880, 0.10, 'square', 0.08, 0); tone(1318, 0.14, 'square', 0.08, 0.07); break;\n      case 'coin':    tone(1100, 0.08, 'square', 0.07, 0); tone(1650, 0.10, 'square', 0.07, 0.06); break;\n      case 'stomp':   tone(200, 0.12, 'triangle', 0.12, 0, 80); break;\n      case 'hurt':    tone(420, 0.25, 'sawtooth', 0.09, 0, 120); break;\n      case 'flag':    tone(523, 0.12, 'square', 0.08, 0); tone(659, 0.12, 'square', 0.08, 0.09); tone(784, 0.12, 'square', 0.08, 0.18); tone(1046, 0.20, 'square', 0.08, 0.27); break;\n      case 'levelup': tone(523, 0.10, 'square', 0.08, 0); tone(659, 0.10, 'square', 0.08, 0.09); tone(784, 0.10, 'square', 0.08, 0.18); tone(1046, 0.18, 'square', 0.08, 0.27); break;\n      case 'win':     tone(523, 0.14, 'square', 0.09, 0); tone(659, 0.14, 'square', 0.09, 0.13); tone(784, 0.14, 'square', 0.09, 0.26); tone(1046, 0.14, 'square', 0.09, 0.39); tone(1318, 0.35, 'square', 0.09, 0.52); break;\n      case 'gameover': tone(400, 0.20, 'sawtooth', 0.09, 0, 200); tone(300, 0.20, 'sawtooth', 0.09, 0.15, 150); tone(200, 0.40, 'sawtooth', 0.09, 0.30, 80); break;\n    }\n  }\n\n  // Game state\n  let gameState = 'menu'; // menu, playing, transition, win, gameover\n  let score = 0;\n  let lives = 5;\n  let startTime = 0;\n  let elapsedTime = 0;\n  let cameraX = 0;\n  let currentLevel = 0;\n  let transitionTimer = 0;\n  let starsCollected = 0; // across all levels\n  let starsTotal = 0;     // across all levels\n\n  // Input\n  const keys = { left: false, right: false, jump: false };\n  let jumpPressed = false;\n\n  // --- Level helpers ---\n  function R(s) { return (s + '.'.repeat(LW)).slice(0, LW); }\n  function G() { return '1'.repeat(LW); }\n\n  // Level data - tile map\n  // 0=empty, 1=ground, 2=platform, 3=star, 4=enemy, 5=spike, 6=flag, 7=coin,\n  // 8=movingPlatform(vertical), 9=movingPlatform(horizontal)\n  const LEVELS = [\n    {\n      name: '启程 · 草原',\n      spawn: { x: 80, y: 300 },\n      rows: [\n        R(\"................................................................................................\"),\n        R(\"................................................................................................\"),\n        R(\"................................................................................................\"),\n        R(\"................................................................................................\"),\n        R(\".....................3.......................................................................6..\"),\n        R(\"................................................................................................\"),\n        R(\"...........3................3...........3..............3........3.............................\"),\n        R(\"..........22........................222.....................2222............2222..............\"),\n        R(\"..............................................3.........................3.....................\"),\n        R(\"..............................2222..........2222.........2222.................................\"),\n        R(\"....3.......7..7..7........................4........................4..........................\"),\n        R(\"...22..........................111111..........11111...111..............1111.....11111111.....\"),\n        R(\"................................................................................................\"),\n        R(\"...4..........4........5..5....4..............5.......4..........5....4............5..5........\"),\n        G(),\n        G(),\n      ]\n    },\n    {\n      name: '移动平台',\n      spawn: { x: 80, y: 300 },\n      rows: [\n        R(''),\n        R(''),\n        R(''),\n        R(''),\n        R('.'.repeat(20) + '3' + '.'.repeat(40) + '3'),\n        R(''),\n        R('.'.repeat(14) + '9' + '.'.repeat(36) + '9'),\n        R('.'.repeat(46) + '22' + '.'.repeat(22) + '22'),\n        R('.'.repeat(8) + '8' + '.'.repeat(30) + '3' + '.'.repeat(28) + '8'),\n        R('.'.repeat(54) + '2222' + '.'.repeat(20) + '2222'),\n        R('.'.repeat(36) + '4' + '.'.repeat(28) + '4'),\n        R('.'.repeat(58) + '111111'),\n        R(''),\n        R('.'.repeat(6) + '5' + '.'.repeat(30) + '4' + '.'.repeat(26) + '5' + '.'.repeat(6) + '6'),\n        G(),\n        G(),\n      ]\n    },\n    {\n      name: '险境 · 终章',\n      spawn: { x: 80, y: 300 },\n      rows: [\n        R(''),\n        R(''),\n        R(''),\n        R(''),\n        R('.'.repeat(30) + '3' + '.'.repeat(30) + '3'),\n        R(''),\n        R('.'.repeat(10) + '22' + '.'.repeat(28) + '22' + '.'.repeat(24) + '22'),\n        R('.'.repeat(18) + '9' + '.'.repeat(42) + '9'),\n        R('.'.repeat(12) + '8' + '.'.repeat(30) + '3' + '.'.repeat(26) + '8'),\n        R('.'.repeat(40) + '2222' + '.'.repeat(24) + '2222'),\n        R('.'.repeat(24) + '4' + '.'.repeat(20) + '4' + '.'.repeat(20) + '4'),\n        R('.'.repeat(66) + '111111'),\n        R(''),\n        R('.'.repeat(4) + '5' + '.'.repeat(24) + '5' + '.'.repeat(20) + '4' + '.'.repeat(16) + '5' + '.'.repeat(6) + '6'),\n        G(),\n        G(),\n      ]\n    }\n  ];\n\n  let platforms = [];\n  let stars = [];\n  let coins = [];\n  let enemies = [];\n  let spikes = [];\n  let flag = null;\n  let particles = [];\n  let floatingTexts = [];\n  let totalStars = 0;\n\n  // Player\n  const player = {\n    x: 80, y: 300, w: 20, h: 28,\n    vx: 0, vy: 0,\n    onGround: false,\n    groundPlatform: null,\n    facing: 1,\n    animFrame: 0,\n    invincible: 0,\n    deathTimer: 0\n  };\n\n  // Parse level\n  function parseLevel() {\n    platforms = [];\n    stars = [];\n    coins = [];\n    enemies = [];\n    spikes = [];\n    flag = null;\n    totalStars = 0;\n\n    const rows = LEVELS[currentLevel].rows;\n    for (let r = 0; r < rows.length; r++) {\n      for (let c = 0; c < rows[r].length; c++) {\n        const ch = rows[r][c];\n        const x = c * TILE;\n        const y = r * TILE;\n        switch(ch) {\n          case '1':\n            platforms.push({ x, y, w: TILE, h: TILE, type: 'ground' });\n            break;\n          case '2':\n            platforms.push({ x, y: y + TILE - 10, w: TILE, h: 10, type: 'platform' });\n            break;\n          case '3':\n            stars.push({ x: x + 8, y: y + 4, w: 16, h: 16, collected: false, bob: Math.random() * Math.PI * 2 });\n            totalStars++;\n            break;\n          case '4':\n            enemies.push({ x: x + 4, y: y + 8, w: 24, h: 24, vx: 1.2, minX: x - 30, maxX: x + 60, alive: true, anim: 0 });\n            break;\n          case '5':\n            spikes.push({ x: x, y: y + 12, w: TILE, h: 20 });\n            break;\n          case '6':\n            flag = { x: x + 8, y: y - TILE * 3, w: 16, h: TILE * 4, wave: 0 };\n            break;\n          case '7':\n            coins.push({ x: x + 8, y: y + 6, w: 16, h: 16, collected: false, spin: Math.random() * Math.PI * 2 });\n            break;\n          case '8':\n            platforms.push({ x, y: y + TILE - 10, w: TILE, h: 10, type: 'moving-v', baseX: x, baseY: y + TILE - 10, range: 80, speed: 1.3, phase: Math.random() * 6.28, dx: 0, dy: 0 });\n            break;\n          case '9':\n            platforms.push({ x, y: y + TILE - 10, w: TILE, h: 10, type: 'moving-h', baseX: x, baseY: y + TILE - 10, range: 70, speed: 1.3, phase: Math.random() * 6.28, dx: 0, dy: 0 });\n            break;\n        }\n      }\n    }\n    starsTotal += totalStars;\n  }\n\n  // Reset whole game\n  function resetGame() {\n    score = 0;\n    lives = 5;\n    starsCollected = 0;\n    starsTotal = 0;\n    currentLevel = 0;\n    startTime = Date.now();\n    resetLevel();\n  }\n\n  // Reset just the current level (keep score/lives/time)\n  function resetLevel() {\n    player.x = LEVELS[currentLevel].spawn.x;\n    player.y = LEVELS[currentLevel].spawn.y;\n    player.vx = 0;\n    player.vy = 0;\n    player.facing = 1;\n    player.invincible = 0;\n    player.deathTimer = 0;\n    player.groundPlatform = null;\n    cameraX = 0;\n    particles = [];\n    floatingTexts = [];\n    parseLevel();\n  }\n\n  // --- Collision helper ---\n  function aabb(a, b) {\n    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;\n  }\n\n  // --- Particle system ---\n  function spawnParticles(x, y, color, count) {\n    for (let i = 0; i < count; i++) {\n      particles.push({\n        x, y,\n        vx: (Math.random() - 0.5) * 4,\n        vy: (Math.random() - 0.5) * 4 - 2,\n        life: 1,\n        color,\n        size: 2 + Math.random() * 3\n      });\n    }\n  }\n\n  function spawnFloatingText(x, y, text, color) {\n    floatingTexts.push({ x, y, text, color, life: 1 });\n  }\n\n  function updateHudLevel() {\n    document.getElementById('level-display').textContent = (currentLevel + 1) + '/' + LEVELS.length;\n  }\n\n  function startLevelTransition() {\n    resetLevel();\n    gameState = 'transition';\n    transitionTimer = 90; // ~1.5s\n    document.getElementById('level-num').textContent = '第 ' + (currentLevel + 1) + ' 关';\n    document.getElementById('level-name').textContent = LEVELS[currentLevel].name;\n    document.getElementById('level-screen').classList.remove('hidden');\n    updateHudLevel();\n    sfx('levelup');\n  }\n\n  function finishGame() {\n    gameState = 'win';\n    const finalTime = elapsedTime;\n    document.getElementById('win-score').textContent = score;\n    document.getElementById('win-time').textContent = formatTime(finalTime);\n    document.getElementById('win-stars').textContent = starsCollected + '/' + starsTotal;\n\n    let bestScore = Number(store.get(KEY_BEST_SCORE, '0')) || 0;\n    let bestTime = store.get(KEY_BEST_TIME, null);\n    const isNewScore = score > bestScore;\n    const isNewTime = bestTime === null || finalTime < Number(bestTime);\n\n    if (isNewScore) { bestScore = score; store.set(KEY_BEST_SCORE, String(score)); }\n    if (isNewTime) { bestTime = finalTime; store.set(KEY_BEST_TIME, String(finalTime)); }\n\n    document.getElementById('best-score').textContent = bestScore;\n    document.getElementById('best-time').textContent = formatTime(Number(bestTime));\n    document.getElementById('new-record').classList.toggle('hidden', !(isNewScore || isNewTime));\n\n    document.getElementById('win-screen').classList.remove('hidden');\n    sfx('win');\n  }\n\n  // --- Update ---\n  function update() {\n    if (gameState === 'transition') {\n      transitionTimer--;\n      if (transitionTimer <= 0) {\n        document.getElementById('level-screen').classList.add('hidden');\n        gameState = 'playing';\n      }\n      return;\n    }\n    if (gameState !== 'playing') return;\n\n    // Player death timer\n    if (player.deathTimer > 0) {\n      player.deathTimer--;\n      player.y += 4;\n      if (player.deathTimer <= 0) {\n        if (lives <= 0) {\n          gameState = 'gameover';\n          document.getElementById('gameover-screen').classList.remove('hidden');\n          sfx('gameover');\n        } else {\n          player.x = LEVELS[currentLevel].spawn.x;\n          player.y = LEVELS[currentLevel].spawn.y;\n          player.vx = 0;\n          player.vy = 0;\n          player.invincible = 60;\n          player.deathTimer = 0;\n        }\n      }\n      return;\n    }\n\n    // --- Moving platforms ---\n    const now = performance.now() / 1000;\n    for (const p of platforms) {\n      if (p.type === 'moving-v') {\n        const ny = p.baseY + Math.sin(now * p.speed + p.phase) * p.range;\n        p.dy = ny - p.y;\n        p.y = ny;\n      } else if (p.type === 'moving-h') {\n        const nx = p.baseX + Math.sin(now * p.speed + p.phase) * p.range;\n        p.dx = nx - p.x;\n        p.x = nx;\n      }\n    }\n\n    // Carry player along with the platform they're standing on\n    if (player.groundPlatform && (player.groundPlatform.type === 'moving-v' || player.groundPlatform.type === 'moving-h')) {\n      player.x += player.groundPlatform.dx || 0;\n      player.y += player.groundPlatform.dy || 0;\n    }\n\n    // Horizontal movement\n    if (keys.left) { player.vx = -MOVE_SPEED; player.facing = -1; }\n    else if (keys.right) { player.vx = MOVE_SPEED; player.facing = 1; }\n    else { player.vx *= 0.8; if (Math.abs(player.vx) < 0.1) player.vx = 0; }\n\n    // Jump\n    if (keys.jump && !jumpPressed && player.onGround) {\n      player.vy = JUMP_POWER;\n      player.onGround = false;\n      spawnParticles(player.x + player.w/2, player.y + player.h, 'rgba(78,204,163,0.6)', 5);\n      sfx('jump');\n    }\n    jumpPressed = keys.jump;\n\n    // Gravity\n    player.vy += GRAVITY;\n    if (player.vy > 14) player.vy = 14;\n\n    // Horizontal collision\n    player.x += player.vx;\n    for (const p of platforms) {\n      if (aabb(player, p)) {\n        if (player.vx > 0) player.x = p.x - player.w;\n        else if (player.vx < 0) player.x = p.x + p.w;\n        player.vx = 0;\n      }\n    }\n\n    // Vertical collision\n    player.y += player.vy;\n    player.onGround = false;\n    player.groundPlatform = null;\n    for (const p of platforms) {\n      if (aabb(player, p)) {\n        if (player.vy > 0) {\n          player.y = p.y - player.h;\n          player.vy = 0;\n          player.onGround = true;\n          player.groundPlatform = p;\n        } else if (player.vy < 0) {\n          player.y = p.y + p.h;\n          player.vy = 0;\n        }\n      }\n    }\n\n    // Boundaries\n    if (player.x < 0) player.x = 0;\n    if (player.y > H + 100) {\n      // Fell off\n      lives--;\n      sfx('hurt');\n      player.deathTimer = 30;\n      player.x = LEVELS[currentLevel].spawn.x;\n      player.y = LEVELS[currentLevel].spawn.y;\n      player.vx = 0;\n      player.vy = 0;\n    }\n\n    // Camera\n    cameraX = player.x - W * 0.35;\n    if (cameraX < 0) cameraX = 0;\n    const maxCam = LW * TILE - W;\n    if (cameraX > maxCam) cameraX = maxCam;\n\n    // Star collection\n    for (const s of stars) {\n      s.bob += 0.05;\n      if (!s.collected) {\n        const sBox = { x: s.x, y: s.y + Math.sin(s.bob) * 4, w: s.w, h: s.h };\n        if (aabb(player, sBox)) {\n          s.collected = true;\n          starsCollected++;\n          score += 100;\n          spawnParticles(s.x + 8, s.y + 8, '#ffd700', 12);\n          spawnFloatingText(s.x, s.y, '+100', '#ffd700');\n          sfx('star');\n        }\n      }\n    }\n\n    // Coin collection\n    for (const c of coins) {\n      c.spin += 0.1;\n      if (!c.collected) {\n        if (aabb(player, c)) {\n          c.collected = true;\n          score += 50;\n          spawnParticles(c.x + 8, c.y + 8, '#ff9f43', 8);\n          spawnFloatingText(c.x, c.y, '+50', '#ff9f43');\n          sfx('coin');\n        }\n      }\n    }\n\n    // Spike collision\n    for (const sp of spikes) {\n      if (aabb(player, sp) && player.invincible <= 0) {\n        lives--;\n        player.invincible = 90;\n        player.vy = -8;\n        player.vx = -player.facing * 5;\n        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#e94560', 10);\n        sfx('hurt');\n        if (lives <= 0) {\n          player.deathTimer = 30;\n        }\n      }\n    }\n\n    // Enemy logic\n    for (const e of enemies) {\n      if (!e.alive) continue;\n      e.anim += 0.1;\n      e.x += e.vx;\n      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }\n      if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }\n\n      if (aabb(player, e) && player.invincible <= 0) {\n        // Check if stomping (player falling from above)\n        if (player.vy > 2 && player.y + player.h - player.vy <= e.y + 4) {\n          e.alive = false;\n          player.vy = JUMP_POWER * 0.6;\n          score += 200;\n          spawnParticles(e.x + e.w/2, e.y + e.h/2, '#e94560', 12);\n          spawnFloatingText(e.x, e.y, '+200', '#e94560');\n          sfx('stomp');\n        } else {\n          lives--;\n          player.invincible = 90;\n          player.vy = -8;\n          player.vx = -player.facing * 5;\n          sfx('hurt');\n          if (lives <= 0) player.deathTimer = 30;\n        }\n      }\n    }\n\n    // Flag (goal)\n    if (flag) {\n      flag.wave += 0.08;\n      const flagBox = { x: flag.x, y: flag.y, w: flag.w, h: flag.h };\n      if (aabb(player, flagBox)) {\n        const timeBonus = Math.max(0, 5000 - Math.floor(elapsedTime) * 10);\n        score += timeBonus;\n        if (currentLevel < LEVELS.length - 1) {\n          currentLevel++;\n          startLevelTransition();\n        } else {\n          finishGame();\n        }\n      }\n    }\n\n    // Invincibility timer\n    if (player.invincible > 0) player.invincible--;\n\n    // Particles\n    for (let i = particles.length - 1; i >= 0; i--) {\n      const p = particles[i];\n      p.x += p.vx;\n      p.y += p.vy;\n      p.vy += 0.2;\n      p.life -= 0.03;\n      if (p.life <= 0) particles.splice(i, 1);\n    }\n\n    // Floating texts\n    for (let i = floatingTexts.length - 1; i >= 0; i--) {\n      const t = floatingTexts[i];\n      t.y -= 1.5;\n      t.life -= 0.02;\n      if (t.life <= 0) floatingTexts.splice(i, 1);\n    }\n\n    // Animation\n    player.animFrame += 0.2;\n\n    // Time\n    elapsedTime = (Date.now() - startTime) / 1000;\n    document.getElementById('score-display').textContent = score;\n    document.getElementById('lives-display').textContent = lives;\n    document.getElementById('time-display').textContent = formatTime(elapsedTime);\n  }\n\n  function formatTime(s) {\n    const m = Math.floor(s / 60);\n    const sec = Math.floor(s % 60);\n    return m + ':' + sec.toString().padStart(2, '0');\n  }\n\n  // --- Render ---\n  function render() {\n    // Background gradient\n    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);\n    bgGrad.addColorStop(0, '#0d0d1a');\n    bgGrad.addColorStop(0.5, '#1a1a2e');\n    bgGrad.addColorStop(1, '#16213e');\n    ctx.fillStyle = bgGrad;\n    ctx.fillRect(0, 0, W, H);\n\n    // Stars in background (parallax)\n    ctx.fillStyle = 'rgba(255,255,255,0.3)';\n    for (let i = 0; i < 60; i++) {\n      const sx = (i * 137 - cameraX * 0.3) % W;\n      const sy = (i * 97) % (H * 0.6);\n      const tw = 1 + Math.sin(Date.now() / 1000 + i) * 0.5;\n      ctx.fillRect(sx < 0 ? sx + W : sx, sy, tw, tw);\n    }\n\n    // Distant mountains (parallax)\n    ctx.fillStyle = 'rgba(78,204,163,0.06)';\n    for (let i = 0; i < 8; i++) {\n      const mx = i * 200 - cameraX * 0.4;\n      ctx.beginPath();\n      ctx.moveTo(mx, H);\n      ctx.lineTo(mx + 100, H - 120);\n      ctx.lineTo(mx + 200, H);\n      ctx.fill();\n    }\n\n    // Save camera\n    ctx.save();\n    ctx.translate(-cameraX, 0);\n\n    // Draw platforms\n    for (const p of platforms) {\n      if (p.type === 'ground') {\n        // Dirt block\n        ctx.fillStyle = '#4a3728';\n        ctx.fillRect(p.x, p.y, p.w, p.h);\n        // Top grass\n        ctx.fillStyle = '#4ecca3';\n        ctx.fillRect(p.x, p.y, p.w, 6);\n        // Texture dots\n        ctx.fillStyle = 'rgba(0,0,0,0.2)';\n        ctx.fillRect(p.x + 6, p.y + 14, 4, 4);\n        ctx.fillRect(p.x + 20, p.y + 20, 4, 4);\n        ctx.fillStyle = 'rgba(255,255,255,0.05)';\n        ctx.fillRect(p.x + 14, p.y + 10, 3, 3);\n      } else if (p.type === 'platform') {\n        // Floating platform\n        ctx.fillStyle = '#3a5a40';\n        ctx.fillRect(p.x, p.y, p.w, p.h);\n        ctx.fillStyle = '#588157';\n        ctx.fillRect(p.x, p.y, p.w, 4);\n        ctx.fillStyle = 'rgba(0,0,0,0.3)';\n        ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);\n      } else if (p.type === 'moving-v' || p.type === 'moving-h') {\n        // Moving platform\n        ctx.fillStyle = '#5a4a8a';\n        ctx.fillRect(p.x, p.y, p.w, p.h);\n        ctx.fillStyle = '#8a7ab5';\n        ctx.fillRect(p.x, p.y, p.w, 4);\n        ctx.fillStyle = 'rgba(255,255,255,0.55)';\n        if (p.type === 'moving-v') {\n          // Up/down arrow\n          ctx.fillRect(p.x + p.w / 2 - 1, p.y + 4, 2, p.h - 8);\n          ctx.beginPath();\n          ctx.moveTo(p.x + p.w / 2, p.y + 3);\n          ctx.lineTo(p.x + p.w / 2 - 3, p.y + 6);\n          ctx.lineTo(p.x + p.w / 2 + 3, p.y + 6);\n          ctx.fill();\n        } else {\n          // Left/right arrow\n          ctx.fillRect(p.x + 4, p.y + p.h / 2 - 1, p.w - 8, 2);\n          ctx.beginPath();\n          ctx.moveTo(p.x + p.w - 3, p.y + p.h / 2);\n          ctx.lineTo(p.x + p.w - 6, p.y + p.h / 2 - 3);\n          ctx.lineTo(p.x + p.w - 6, p.y + p.h / 2 + 3);\n          ctx.fill();\n        }\n      }\n    }\n\n    // Draw spikes\n    for (const sp of spikes) {\n      ctx.fillStyle = '#e94560';\n      const numSpikes = 4;\n      const spikeW = sp.w / numSpikes;\n      for (let i = 0; i < numSpikes; i++) {\n        ctx.beginPath();\n        ctx.moveTo(sp.x + i * spikeW, sp.y + sp.h);\n        ctx.lineTo(sp.x + i * spikeW + spikeW / 2, sp.y);\n        ctx.lineTo(sp.x + (i + 1) * spikeW, sp.y + sp.h);\n        ctx.fill();\n      }\n      // Highlight\n      ctx.fillStyle = 'rgba(255,255,255,0.3)';\n      for (let i = 0; i < numSpikes; i++) {\n        ctx.beginPath();\n        ctx.moveTo(sp.x + i * spikeW + spikeW / 2 - 1, sp.y + 2);\n        ctx.lineTo(sp.x + i * spikeW + spikeW / 2 + 1, sp.y + 2);\n        ctx.lineTo(sp.x + i * spikeW + spikeW / 2, sp.y);\n        ctx.fill();\n      }\n    }\n\n    // Draw stars\n    for (const s of stars) {\n      if (s.collected) continue;\n      const sy = s.y + Math.sin(s.bob) * 4;\n      // Glow\n      const glowGrad = ctx.createRadialGradient(s.x + 8, sy + 8, 0, s.x + 8, sy + 8, 20);\n      glowGrad.addColorStop(0, 'rgba(255,215,0,0.3)');\n      glowGrad.addColorStop(1, 'rgba(255,215,0,0)');\n      ctx.fillStyle = glowGrad;\n      ctx.fillRect(s.x - 12, sy - 12, 40, 40);\n      // Star shape\n      ctx.fillStyle = '#ffd700';\n      drawStar(ctx, s.x + 8, sy + 8, 5, 8, 4);\n      // Inner highlight\n      ctx.fillStyle = '#fff5b0';\n      drawStar(ctx, s.x + 8, sy + 8, 5, 4, 2);\n    }\n\n    // Draw coins\n    for (const c of coins) {\n      if (c.collected) continue;\n      const wScale = Math.abs(Math.cos(c.spin));\n      const cw = c.w * wScale;\n      const cx = c.x + (c.w - cw) / 2;\n      // Glow\n      ctx.fillStyle = 'rgba(255,159,67,0.2)';\n      ctx.beginPath();\n      ctx.arc(c.x + 8, c.y + 8, 12, 0, Math.PI * 2);\n      ctx.fill();\n      // Coin\n      ctx.fillStyle = '#ff9f43';\n      ctx.fillRect(cx, c.y, cw, c.h);\n      ctx.fillStyle = '#ffd93d';\n      ctx.fillRect(cx, c.y + 2, cw, c.h - 8);\n      // Shine\n      if (wScale > 0.3) {\n        ctx.fillStyle = 'rgba(255,255,255,0.5)';\n        ctx.fillRect(cx + cw * 0.3, c.y + 4, cw * 0.2, 4);\n      }\n    }\n\n    // Draw enemies\n    for (const e of enemies) {\n      if (!e.alive) continue;\n      const wob = Math.sin(e.anim) * 2;\n      // Body\n      ctx.fillStyle = '#e94560';\n      ctx.fillRect(e.x, e.y + wob, e.w, e.h);\n      // Eyes\n      ctx.fillStyle = '#fff';\n      ctx.fillRect(e.x + 4, e.y + 6 + wob, 6, 6);\n      ctx.fillRect(e.x + 14, e.y + 6 + wob, 6, 6);\n      ctx.fillStyle = '#000';\n      const eyeDir = e.vx > 0 ? 3 : 0;\n      ctx.fillRect(e.x + 5 + eyeDir, e.y + 8 + wob, 3, 3);\n      ctx.fillRect(e.x + 15 + eyeDir, e.y + 8 + wob, 3, 3);\n      // Feet\n      ctx.fillStyle = '#c81e3a';\n      const footOff = Math.sin(e.anim * 2) * 2;\n      ctx.fillRect(e.x + 2, e.y + e.h - 4 + wob, 8, 4);\n      ctx.fillRect(e.x + 14, e.y + e.h - 4 + wob, 8, 4);\n      // Angry brow\n      ctx.fillStyle = '#8b0000';\n      ctx.fillRect(e.x + 3, e.y + 4 + wob, 7, 2);\n      ctx.fillRect(e.x + 14, e.y + 4 + wob, 7, 2);\n    }\n\n    // Draw flag\n    if (flag) {\n      // Pole\n      ctx.fillStyle = '#aaa';\n      ctx.fillRect(flag.x + 2, flag.y, 3, flag.h);\n      // Flag\n      const fw = 20 + Math.sin(flag.wave) * 3;\n      ctx.fillStyle = '#4ecca3';\n      ctx.beginPath();\n      ctx.moveTo(flag.x + 5, flag.y);\n      ctx.lineTo(flag.x + 5 + fw, flag.y + 10);\n      ctx.lineTo(flag.x + 5, flag.y + 20);\n      ctx.fill();\n      // Flag text\n      ctx.fillStyle = '#1a1a2e';\n      ctx.fillRect(flag.x + 12, flag.y + 6, 6, 6);\n      // Base\n      ctx.fillStyle = '#666';\n      ctx.fillRect(flag.x - 4, flag.y + flag.h - 6, 15, 6);\n    }\n\n    // Draw player\n    if (player.deathTimer === 0 || Math.floor(player.deathTimer / 3) % 2 === 0) {\n      const blink = player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0;\n      if (!blink) {\n        const px = player.x;\n        const py = player.y;\n        const bob = player.onGround && Math.abs(player.vx) > 0.5 ? Math.sin(player.animFrame) * 1.5 : 0;\n\n        // Body\n        ctx.fillStyle = '#4ecca3';\n        ctx.fillRect(px, py + bob, player.w, player.h);\n\n        // Head accent\n        ctx.fillStyle = '#3aa882';\n        ctx.fillRect(px, py + bob, player.w, 4);\n\n        // Eyes\n        ctx.fillStyle = '#fff';\n        const eyeX = player.facing > 0 ? px + 11 : px + 4;\n        ctx.fillRect(eyeX, py + 8 + bob, 5, 5);\n        ctx.fillStyle = '#000';\n        const pupilX = player.facing > 0 ? eyeX + 2 : eyeX;\n        ctx.fillRect(pupilX, py + 9 + bob, 2, 3);\n\n        // Mouth\n        ctx.fillStyle = '#1a1a2e';\n        if (player.vy < -3) {\n          // Jumping - open mouth\n          ctx.fillRect(px + 8, py + 16 + bob, 4, 3);\n        } else {\n          ctx.fillRect(px + 7, py + 17 + bob, 6, 1);\n        }\n\n        // Legs\n        ctx.fillStyle = '#2d6a4f';\n        if (player.onGround && Math.abs(player.vx) > 0.5) {\n          const legOff = Math.sin(player.animFrame * 2) * 3;\n          ctx.fillRect(px + 3, py + player.h - 4 + bob, 5, 4 + Math.abs(legOff));\n          ctx.fillRect(px + 12, py + player.h - 4 + bob, 5, 4 + Math.abs(-legOff));\n        } else {\n          ctx.fillRect(px + 3, py + player.h - 3 + bob, 5, 3);\n          ctx.fillRect(px + 12, py + player.h - 3 + bob, 5, 3);\n        }\n\n        // Glow when invincible\n        if (player.invincible > 0) {\n          ctx.strokeStyle = 'rgba(78,204,163,0.4)';\n          ctx.lineWidth = 2;\n          ctx.strokeRect(px - 2, py - 2 + bob, player.w + 4, player.h + 4);\n        }\n      }\n    }\n\n    // Particles\n    for (const p of particles) {\n      ctx.globalAlpha = p.life;\n      ctx.fillStyle = p.color;\n      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);\n    }\n    ctx.globalAlpha = 1;\n\n    // Floating texts\n    for (const t of floatingTexts) {\n      ctx.globalAlpha = t.life;\n      ctx.fillStyle = t.color;\n      ctx.font = 'bold 14px monospace';\n      ctx.fillText(t.text, t.x, t.y);\n    }\n    ctx.globalAlpha = 1;\n\n    ctx.restore();\n\n    // Vignette\n    const vGrad = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.7);\n    vGrad.addColorStop(0, 'rgba(0,0,0,0)');\n    vGrad.addColorStop(1, 'rgba(0,0,0,0.4)');\n    ctx.fillStyle = vGrad;\n    ctx.fillRect(0, 0, W, H);\n  }\n\n  function drawStar(ctx, cx, cy, spikes, outer, inner) {\n    let rot = Math.PI / 2 * 3;\n    let x = cx;\n    let y = cy;\n    const step = Math.PI / spikes;\n    ctx.beginPath();\n    ctx.moveTo(cx, cy - outer);\n    for (let i = 0; i < spikes; i++) {\n      x = cx + Math.cos(rot) * outer;\n      y = cy + Math.sin(rot) * outer;\n      ctx.lineTo(x, y);\n      rot += step;\n      x = cx + Math.cos(rot) * inner;\n      y = cy + Math.sin(rot) * inner;\n      ctx.lineTo(x, y);\n      rot += step;\n    }\n    ctx.lineTo(cx, cy - outer);\n    ctx.closePath();\n    ctx.fill();\n  }\n\n  // --- Game loop ---\n  function gameLoop() {\n    update();\n    render();\n    requestAnimationFrame(gameLoop);\n  }\n\n  // --- Input handling ---\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;\n    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;\n    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { keys.jump = true; e.preventDefault(); }\n  });\n  document.addEventListener('keyup', (e) => {\n    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;\n    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;\n    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.jump = false;\n  });\n\n  // Mobile controls\n  const btnLeft = document.getElementById('btn-left');\n  const btnRight = document.getElementById('btn-right');\n  const btnJump = document.getElementById('btn-jump');\n\n  function bindTouch(el, prop) {\n    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[prop] = true; }, { passive: false });\n    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[prop] = false; }, { passive: false });\n    el.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[prop] = false; }, { passive: false });\n  }\n  bindTouch(btnLeft, 'left');\n  bindTouch(btnRight, 'right');\n  bindTouch(btnJump, 'jump');\n\n  // Button handlers\n  function startGame() {\n    initAudio();\n    document.getElementById('start-screen').classList.add('hidden');\n    document.getElementById('win-screen').classList.add('hidden');\n    document.getElementById('gameover-screen').classList.add('hidden');\n    document.getElementById('level-screen').classList.add('hidden');\n    document.getElementById('hud').classList.remove('hidden');\n    gameState = 'playing';\n    resetGame();\n    updateHudLevel();\n  }\n\n  document.getElementById('start-btn').addEventListener('click', startGame);\n  document.getElementById('replay-btn').addEventListener('click', startGame);\n  document.getElementById('retry-btn').addEventListener('click', startGame);\n\n  // Start loop\n  gameLoop();\n})();\n<\/script>\n\n</body>\n</html>\n"
