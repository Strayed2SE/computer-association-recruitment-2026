  {
    "id": "snake",
    "name": "贪色蛇",
    "tag": "贪吃蛇线",
    "tip": "方向键 / WASD 转向，只吃和蛇头同色的食物",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>贪色蛇 · Color Snake</title>\n<style>\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  body{\n    margin:0;padding:26px 18px;min-height:100vh;\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace;\n    color:#e6f0ff;\n    background:\n      radial-gradient(860px 480px at 10% -8%, rgba(78,204,163,.10) 0%, rgba(228,236,255,0) 62%),\n      radial-gradient(760px 500px at 94% 108%, rgba(233,69,96,.09) 0%, rgba(255,230,228,0) 60%),\n      #0d0d1a;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .app{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1000px;width:100%}\n\n  .stage{position:relative;background:#fff;border-radius:22px;padding:14px;\n         box-shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.40);border:1px solid #26304a}\n  canvas{display:block;border-radius:13px;touch-action:none}\n\n  .panel{width:272px;flex:0 0 auto}\n  .card{background:#fff;border-radius:18px;padding:18px;border:1px solid #26304a;box-shadow:0 10px 30px rgba(0,0,0,.40)}\n  .card + .card{margin-top:13px}\n\n  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b98b8;font-weight:600}\n\n  .headColor{display:flex;align-items:center;gap:11px;margin-top:12px}\n  .swatch{width:38px;height:38px;border-radius:12px;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}\n  .headColor .t1{font-size:15px;font-weight:700;line-height:1.2}\n  .headColor .t2{font-size:11.5px;color:#8b98b8;margin-top:2px}\n\n  .cycle{display:flex;align-items:center;gap:5px;margin-top:13px}\n  .cycle .cd{width:22px;height:22px;border-radius:50%;opacity:.28;transition:.18s}\n  .cycle .cd.on{opacity:1;transform:scale(1.18);box-shadow:0 0 0 3px rgba(0,0,0,.05)}\n  .cycle .sep{color:#55617f;font-size:12px}\n\n  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}\n  .stat{background:#1b2136;border-radius:12px;padding:9px 5px;text-align:center}\n  .stat b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}\n  .stat span{font-size:11px;color:#8b98b8}\n\n  .btns{display:flex;gap:8px;margin-top:13px}\n  button{flex:1;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:11px;\n         padding:10px 8px;border:1px solid #2b3550;background:#fff;color:#c3d0e6;transition:.16s}\n  button:hover{background:#1b2136;transform:translateY(-1px)}\n  button.primary{background:#54e0e0;border-color:#54e0e0;color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.28)}\n  button.primary:hover{background:#3fb8c0}\n\n  .help{margin-top:13px;font-size:12px;line-height:1.85;color:#93a2c0}\n  .help b{color:#c3d0e6}\n  .keys{display:inline-block;background:#1b2136;border:1px solid #2b3550;border-radius:6px;\n        padding:1px 6px;font-size:11px;font-weight:700;color:#93a2c0}\n\n  .overlay{position:fixed;inset:0;background:rgba(6,8,18,.86);backdrop-filter:blur(4px);\n           display:grid;place-items:center;z-index:50;padding:20px}\n  .overlay.hide{display:none}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .overlay{animation:fade .2s}\n  .modal{background:#fff;border-radius:22px;padding:28px 30px;text-align:center;max-width:380px;width:100%;\n         box-shadow:0 30px 70px rgba(0,0,0,.70);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}\n  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}\n  .modal h2{margin:0 0 8px;font-size:23px}\n  .modal p{margin:0 0 8px;color:#93a2c0;font-size:13.5px;line-height:1.75}\n  .modal p.big{font-size:15px;color:#e6f0ff;margin-bottom:18px}\n  .modal b{color:#54e0e0}\n  .ruleline{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 20px;font-size:12.5px;color:#93a2c0}\n  .dotc{width:14px;height:14px;border-radius:50%}\n  .modal .btns{margin-top:0}\n\n  @media (max-width:720px){\n    .app{flex-direction:column;align-items:center}\n    .panel{width:100%;max-width:430px}\n  }\n\n  /* ===================== 像素街机主题 · 统一风格 ===================== */\n  body{\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace !important;\n    color:#e6f0ff !important;\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(78,204,163,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(233,69,96,.08) 0%, rgba(233,69,96,0) 60%),\n      #0d0d1a !important;\n  }\n  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;border-radius:4px !important}\n  #board{border-radius:0 !important}\n  h1,h2,h3{color:#e6f0ff !important}\n  .eyebrow{color:#4ecca3 !important;font-weight:700 !important;letter-spacing:.2em !important}\n  .tip,.modal p,.help,.enemySub,.empty{color:#93a2c0 !important}\n  .modal p.big{color:#e6f0ff !important}\n  .card,.stage,.board-wrap,.enemy,.modal{border-radius:6px !important}\n  .card,.enemy{\n    background:#141a2e !important;border:3px solid #26304a !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 26px rgba(78,204,163,.07) !important;\n  }\n  .stage,.board-wrap{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.20) !important;\n  }\n  .modal{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 8px 0 #05070f, 0 0 60px rgba(78,204,163,.28) !important;\n  }\n  .overlay{background:rgba(6,8,18,.86) !important;backdrop-filter:blur(3px) !important}\n  .stat,.sc,.floorBadge,.keys,.comboTag,.shieldTag{\n    background:#1b2136 !important;border:1px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:3px !important;\n  }\n  .stat span,.sc span{color:#8b98b8 !important}\n  .keys{border:1px solid #3a4767 !important;color:#e6f0ff !important}\n  .swatch{box-shadow:inset 0 -3px 0 rgba(0,0,0,.4) !important;border-radius:4px !important}\n  button{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:4px !important;font-weight:700 !important;box-shadow:0 3px 0 #05070f !important;\n  }\n  button:hover:not(:disabled){background:#243052 !important;border-color:#4ecca3 !important;color:#e6f0ff !important}\n  button.primary{\n    background:#4ecca3 !important;border-color:#3aa882 !important;color:#0b1220 !important;\n    box-shadow:0 4px 0 #2d6a4f, 0 0 20px rgba(78,204,163,.35) !important;\n  }\n  button.primary:hover:not(:disabled){background:#5fd9b0 !important;border-color:#4ecca3 !important;color:#0b1220 !important}\n\n  /* 贪色蛇：轮转指示点去掉浅色投影 */\n  .cycle .cd.on{box-shadow:0 0 0 3px rgba(78,204,163,.25) !important}\n  .cycle .sep{color:#3a4767 !important}\n  </style>\n</head>\n<body>\n\n<div class=\"app\">\n  <div class=\"stage\"><canvas id=\"cv\"></canvas></div>\n\n  <aside class=\"panel\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">Color Snake · 颜色匹配</div>\n\n      <div class=\"headColor\">\n        <div class=\"swatch\" id=\"headSw\"></div>\n        <div>\n          <div class=\"t1\" id=\"headName\">蛇头 · 红</div>\n          <div class=\"t2\">只能吃这个颜色的食物</div>\n        </div>\n      </div>\n\n      <div class=\"cycle\" id=\"cycle\"></div>\n\n      <div class=\"stats\">\n        <div class=\"stat\"><b id=\"sScore\">0</b><span>得分</span></div>\n        <div class=\"stat\"><b id=\"sLevel\">1</b><span>等级</span></div>\n        <div class=\"stat\"><b id=\"sLen\">3</b><span>长度</span></div>\n      </div>\n\n      <div class=\"btns\">\n        <button id=\"btnPause\">暂停</button>\n        <button id=\"btnSound\">音效 开</button>\n      </div>\n      <div class=\"btns\">\n        <button class=\"primary\" id=\"btnRestart\">重新开始</button>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"help\">\n        <span class=\"keys\">↑↓←→</span> / <span class=\"keys\">WASD</span> 转向，<span class=\"keys\">空格</span> 暂停<br>\n        <b>同色食物</b>才能吃，吃完蛇头换成下一色。<br>\n        <b>异色食物、墙、自己</b> 碰到即死。<br>\n        最高分：<b id=\"sBest\">0</b>\n      </div>\n    </div>\n  </aside>\n</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"modal\">\n    <h2 id=\"mTitle\">贪色蛇</h2>\n    <p id=\"mBody\">蛇头是红色，就只吃红色的食物。</p>\n    <div class=\"ruleline\">\n      <span class=\"dotc\" style=\"background:#e94560\"></span>\n      <span>安全</span>\n      <span style=\"color:#55617f\">/</span>\n      <span class=\"dotc\" style=\"background:#54e0e0;opacity:.35\"></span>\n      <span>致命</span>\n    </div>\n    <div class=\"btns\">\n      <button class=\"primary\" id=\"mStart\" style=\"width:100%\">开始</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* =========================================================\n   贪色蛇 —— 经典贪吃蛇 + 「颜色匹配」一层\n   蛇头有颜色，只能吃同色食物；吃掉后蛇头轮转到下一色。\n   ========================================================= */\nconst COLS = 20, ROWS = 20;\n\nconst PAL = {\n  red  : {main:'#e94560', dark:'#c81e3a', glow:'rgba(233,69,96,.50)',  name:'红'},\n  blue : {main:'#54e0e0', dark:'#2f9fa8', glow:'rgba(84,224,224,.45)', name:'蓝'},\n  amber: {main:'#ffd24a', dark:'#c99a1e', glow:'rgba(255,210,74,.45)', name:'黄'}\n};\n\nconst cv  = document.getElementById('cv');\nconst ctx = cv.getContext('2d');\nlet CELL = 28, W = 0, H = 0;\n\n/* ---------- 状态 ---------- */\nlet snake, foods, headColor, dir, queue;\nlet score, level, state, acc, last, deathT, shake, particles;\nlet best = +(localStorage.getItem('cs_best') || 0);\nlet muted = false;\n\nconst activeKeys = () => level >= 3 ? ['red','blue','amber'] : ['red','blue'];\nconst foodCount  = () => level >= 4 ? 4 : (level >= 2 ? 3 : 2);\nconst tickMs     = () => Math.max(68, 170 - (level - 1) * 15);\n\nfunction nextColor(k){\n  const ks = activeKeys();\n  const i = ks.indexOf(k);\n  return ks[(i + 1) % ks.length];\n}\n\n/* ---------- 音效（WebAudio，无外部资源） ---------- */\nlet actx = null;\nfunction audio(){\n  if(!actx){\n    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }\n  }\n  if(actx && actx.state === 'suspended') actx.resume();\n  return actx;\n}\nfunction beep(freq, dur, type, vol, slideTo){\n  if(muted) return;\n  const a = audio(); if(!a) return;\n  const o = a.createOscillator(), g = a.createGain();\n  o.type = type || 'sine';\n  o.frequency.setValueAtTime(freq, a.currentTime);\n  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), a.currentTime + dur);\n  g.gain.setValueAtTime(vol || .05, a.currentTime);\n  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);\n  o.connect(g); g.connect(a.destination);\n  o.start(); o.stop(a.currentTime + dur);\n}\nconst sfx = {\n  eat  : () => { beep(620, .09, 'triangle', .06); setTimeout(()=>beep(930,.09,'triangle',.05), 55); },\n  die  : () => { beep(300, .5, 'sawtooth', .07, 60); },\n  level: () => { [0,90,180,300].forEach((d,i)=>setTimeout(()=>beep([523,659,784,1046][i],.14,'triangle',.055), d)); },\n  turn : () => { beep(1400, .025, 'square', .012); }\n};\n\n/* ---------- 尺寸 ---------- */\nfunction fit(){\n  const avail = Math.min(560, window.innerWidth - 56);\n  CELL = Math.max(15, Math.floor(avail / COLS));\n  W = CELL * COLS; H = CELL * ROWS;\n  cv.style.width = W + 'px'; cv.style.height = H + 'px';\n  const dpr = window.devicePixelRatio || 1;\n  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\n\n/* ---------- 初始化 ---------- */\nfunction newGame(){\n  const cr = Math.floor(ROWS / 2), cc = Math.floor(COLS / 2);\n  snake = [\n    {c:cc,   r:cr, pc:cc,   pr:cr, color:'red'},\n    {c:cc-1, r:cr, pc:cc-1, pr:cr, color:'red'},\n    {c:cc-2, r:cr, pc:cc-2, pr:cr, color:'red'}\n  ];\n  dir = {x:1, y:0}; queue = [];\n  foods = []; headColor = 'red';\n  score = 0; level = 1;\n  acc = 0; last = 0; deathT = 0; shake = 0;\n  particles = [];\n  for(let i = 0; i < foodCount(); i++) spawnFood();\n  ensurePlayable();\n  state = 'ready';\n  document.getElementById('overlay').classList.remove('hide');\n  document.getElementById('mTitle').textContent = '贪色蛇';\n  document.getElementById('mBody').textContent = '蛇头是红色，就只吃红色的食物。';\n  document.getElementById('mStart').textContent = '开始';\n  syncPanel();\n}\n\nfunction occupiedSet(){\n  const s = new Set();\n  for(const x of snake) s.add(x.c + ',' + x.r);\n  for(const f of foods) s.add(f.c + ',' + f.r);\n  return s;\n}\n\nfunction spawnFood(){\n  const occ = occupiedSet();\n  const free = [];\n  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) if(!occ.has(c + ',' + r)) free.push({c, r});\n  if(!free.length) return;\n  const p = free[Math.floor(Math.random() * free.length)];\n  const ks = activeKeys();\n  foods.push({c:p.c, r:p.r, color:ks[Math.floor(Math.random()*ks.length)], ph:Math.random()*6.28, flash:0});\n}\n\n/* 保证场上永远有至少一枚「能吃」的食物，否则玩家必死 */\nfunction ensurePlayable(){\n  if(foods.some(f => f.color === headColor)) return;\n  const f = foods[Math.floor(Math.random() * foods.length)];\n  if(f){ f.color = headColor; f.flash = 1; }\n}\n\n/* ---------- 输入 ---------- */\nfunction turn(nx, ny){\n  if(state === 'ready'){\n    document.getElementById('overlay').classList.add('hide');   // 直接按键也能开局，不必先点按钮\n    state = 'playing';\n  }\n  if(state !== 'playing') return;\n  const base = queue.length ? queue[queue.length - 1] : dir;\n  if(base.x === nx && base.y === ny) return;\n  if(base.x === -nx && base.y === -ny) return;\n  if(queue.length < 2){ queue.push({x:nx, y:ny}); if(!muted) sfx.turn(); }\n}\n\n/* ---------- 一帧逻辑 ---------- */\nfunction tick(){\n  if(queue.length) dir = queue.shift();\n\n  const head = snake[0];\n  const nc = head.c + dir.x, nr = head.r + dir.y;\n\n  if(nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS){ die('撞到墙了'); return; }\n\n  const bodyHit = snake.some((s, i) => i < snake.length - 1 && s.c === nc && s.r === nr);\n  if(bodyHit){ die('咬到自己了'); return; }\n\n  const fi = foods.findIndex(f => f.c === nc && f.r === nr);\n  if(fi >= 0 && foods[fi].color !== headColor){\n    die('吃到了异色食物');\n    return;\n  }\n\n  for(const s of snake){ s.pc = s.c; s.pr = s.r; }\n  snake.unshift({c:nc, r:nr, pc:head.c, pr:head.r, color:headColor});\n\n  if(fi < 0){ snake.pop(); return; }\n\n  /* —— 吃到同色 —— */\n  const f = foods[fi];\n  burst(f.c, f.r, PAL[f.color].main);\n  sfx.eat();\n  shake = Math.min(6, shake + 2.2);\n  score++;\n  foods.splice(fi, 1);\n\n  const nl = Math.min(9, Math.floor(score / 5) + 1);\n  const leveled = nl > level;\n  level = nl;\n  headColor = nextColor(headColor);\n\n  if(leveled){\n    while(foods.length < foodCount()) spawnFood();\n    sfx.level();\n    shake = Math.min(9, shake + 4);\n  }\n  while(foods.length < foodCount()) spawnFood();\n  ensurePlayable();\n}\n\nfunction die(reason){\n  state = 'dying';\n  deathT = 0;\n  shake = 11;\n  sfx.die();\n  const h = snake[0];\n  for(let i = 0; i < 26; i++) burst(h.c, h.r, i % 2 ? '#e94560' : '#8b98b8', 1.6);\n  if(score > best){ best = score; localStorage.setItem('cs_best', best); }\n  document.getElementById('mTitle').textContent = '结束';\n  document.getElementById('mBody').textContent = reason + '。';\n  document.getElementById('mStart').textContent = '再来一次';\n  setTimeout(() => {\n    if(state !== 'dying') return;\n    state = 'over';\n    document.getElementById('overlay').classList.remove('hide');\n  }, 850);\n}\n\n/* ---------- 粒子 ---------- */\nfunction burst(c, r, color, mul){\n  const n = Math.round(14 * (mul || 1));\n  for(let i = 0; i < n; i++){\n    const a = Math.random() * 6.283, sp = (0.6 + Math.random() * 2.4) * (mul || 1);\n    particles.push({\n      x:(c + .5) * CELL, y:(r + .5) * CELL,\n      vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - .6,\n      life:1, decay:.018 + Math.random() * .022,\n      size:2 + Math.random() * 3.5, color\n    });\n  }\n}\nfunction stepParticles(){\n  for(const p of particles){\n    p.x += p.vx; p.y += p.vy;\n    p.vy += .075; p.vx *= .975; p.vy *= .975;\n    p.life -= p.decay;\n  }\n  particles = particles.filter(p => p.life > 0);\n}\n\n/* ---------- 绘制 ---------- */\nfunction rr(x, y, w, h, r){\n  ctx.beginPath();\n  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r);\n  else{\n    ctx.moveTo(x + r, y);\n    ctx.arcTo(x + w, y,     x + w, y + h, r);\n    ctx.arcTo(x + w, y + h, x,     y + h, r);\n    ctx.arcTo(x,     y + h, x,     y,     r);\n    ctx.arcTo(x,     y,     x + w, y,     r);\n    ctx.closePath();\n  }\n}\n\nfunction render(t){\n  ctx.save();\n  ctx.clearRect(-40, -40, W + 80, H + 80);\n  if(shake > .05){\n    ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);\n    shake *= .86;\n  } else shake = 0;\n\n  ctx.fillStyle = '#0d0d1a';\n  ctx.fillRect(0, 0, W, H);\n\n  ctx.strokeStyle = '#1b2136';\n  ctx.lineWidth = 1;\n  for(let c = 1; c < COLS; c++){ ctx.beginPath(); ctx.moveTo(c*CELL+.5, 0); ctx.lineTo(c*CELL+.5, H); ctx.stroke(); }\n  for(let r = 1; r < ROWS; r++){ ctx.beginPath(); ctx.moveTo(0, r*CELL+.5); ctx.lineTo(W, r*CELL+.5); ctx.stroke(); }\n\n  /* 食物 */\n  const now = performance.now();\n  for(const f of foods){\n    const safe = f.color === headColor;\n    const pulse = 1 + Math.sin(now / 260 + f.ph) * (safe ? .10 : .05);\n    const base = CELL * .29;\n    const R = base * pulse * (safe ? 1.12 : .92);\n    const cx = (f.c + .5) * CELL, cy = (f.r + .5) * CELL;\n    const col = PAL[f.color];\n\n    if(f.flash > 0){\n      ctx.globalAlpha = f.flash * .85;\n      ctx.fillStyle = col.glow; ctx.beginPath(); ctx.arc(cx, cy, R * 2.4, 0, 6.283); ctx.fill();\n      ctx.globalAlpha = 1; f.flash -= .05; if(f.flash < 0) f.flash = 0;\n    }\n\n    if(safe){\n      ctx.fillStyle = col.glow;\n      ctx.beginPath(); ctx.arc(cx, cy, R * 1.95, 0, 6.283); ctx.fill();\n      ctx.strokeStyle = col.main; ctx.lineWidth = 2.5;\n      ctx.beginPath(); ctx.arc(cx, cy, R * 1.42, 0, 6.283); ctx.stroke();\n    }\n\n    ctx.globalAlpha = safe ? 1 : .42;\n    ctx.fillStyle = col.main;\n    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();\n    ctx.fillStyle = 'rgba(255,255,255,.5)';\n    ctx.beginPath(); ctx.arc(cx - R*.28, cy - R*.3, R * .34, 0, 6.283); ctx.fill();\n    ctx.globalAlpha = 1;\n  }\n\n  /* 蛇身（含插值，转向时是连续移动而非跳格） */\n  const dying = state === 'dying';\n  const flash = dying ? (Math.floor(deathT / 90) % 2 === 0) : false;\n  for(let i = snake.length - 1; i >= 0; i--){\n    const s = snake[i];\n    const x = (s.pc + (s.c - s.pc) * t) * CELL;\n    const y = (s.pr + (s.r - s.pr) * t) * CELL;\n    const inset = i === 0 ? 1.2 : 2.4;\n    const col = flash ? {main:'#ff9aa8', dark:'#ff8fa3'} : PAL[s.color];\n\n    ctx.fillStyle = col.main;\n    rr(x + inset, y + inset, CELL - inset*2, CELL - inset*2, i === 0 ? CELL*.36 : CELL*.3);\n    ctx.fill();\n\n    if(i === 0){\n      ctx.fillStyle = 'rgba(255,255,255,.34)';\n      rr(x + inset + 2, y + inset + 2, CELL - inset*2 - 4, (CELL - inset*2) * .42, CELL*.26);\n      ctx.fill();\n      const px = dir.y, py = dir.x;        // 与前进方向垂直\n      for(const sgn of [-1, 1]){\n        const ox = dir.x * CELL*.20 + px * sgn * CELL*.21;\n        const oy = dir.y * CELL*.20 + py * sgn * CELL*.21;\n        ctx.fillStyle = '#fff';\n        ctx.beginPath(); ctx.arc(x + CELL/2 + ox, y + CELL/2 + oy, CELL*.105, 0, 6.283); ctx.fill();\n        ctx.fillStyle = '#20222e';\n        ctx.beginPath();\n        ctx.arc(x + CELL/2 + ox + dir.x*CELL*.03, y + CELL/2 + oy + dir.y*CELL*.03, CELL*.055, 0, 6.283);\n        ctx.fill();\n      }\n    }\n  }\n\n  /* 粒子 */\n  for(const p of particles){\n    ctx.globalAlpha = Math.max(0, p.life);\n    ctx.fillStyle = p.color;\n    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + p.life * .6), 0, 6.283); ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  if(state === 'ready'){\n    ctx.fillStyle = 'rgba(13,13,26,.72)';\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = '#8b98b8';\n    ctx.font = '600 ' + Math.round(CELL * .62) + 'px \"Courier New\",monospace';\n    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    ctx.fillText('按方向键开始', W/2, H/2);\n  }\n  if(state === 'paused'){\n    ctx.fillStyle = 'rgba(13,13,26,.70)';\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = '#93a2c0';\n    ctx.font = '600 ' + Math.round(CELL * .7) + 'px \"Courier New\",monospace';\n    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    ctx.fillText('已暂停', W/2, H/2);\n  }\n  ctx.restore();\n}\n\n/* ---------- 主循环 ---------- */\nfunction loop(ts){\n  requestAnimationFrame(loop);\n  if(!last) last = ts;\n  const dt = Math.min(60, ts - last);\n  last = ts;\n\n  if(state === 'playing'){\n    acc += dt;\n    let guard = 0;\n    while(acc >= tickMs() && state === 'playing' && guard++ < 4){\n      acc -= tickMs();\n      tick();\n    }\n  } else acc = 0;\n\n  if(state === 'dying'){ deathT += dt; stepParticles(); }\n  else stepParticles();\n\n  const t = state === 'playing' ? Math.min(1, acc / tickMs()) : 1;\n  render(t);\n  syncPanel();\n}\n\n/* ---------- 侧栏 ---------- */\nfunction syncPanel(){\n  const col = PAL[headColor];\n  const sw = document.getElementById('headSw');\n  sw.style.background = col.main;\n  document.getElementById('headName').textContent = '蛇头 · ' + col.name;\n  document.getElementById('sScore').textContent = score;\n  document.getElementById('sLevel').textContent = level;\n  document.getElementById('sLen').textContent = snake.length;\n  document.getElementById('sBest').textContent = best;\n\n  const ks = activeKeys();\n  const cyc = document.getElementById('cycle');\n  const sig = ks.join(',') + '|' + headColor;\n  if(cyc.dataset.sig !== sig){\n    cyc.dataset.sig = sig;\n    cyc.innerHTML = ks.map((k, i) =>\n      `<span class=\"cd ${k === headColor ? 'on' : ''}\" style=\"background:${PAL[k].main}\"></span>` +\n      (i < ks.length - 1 ? `<span class=\"sep\">›</span>` : '')\n    ).join('');\n  }\n}\n\n/* ---------- 绑定 ---------- */\nconst KEY = {\n  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],\n  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],\n  W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]\n};\nwindow.addEventListener('keydown', e => {\n  if(e.key === ' ' || e.key === 'p' || e.key === 'P'){\n    e.preventDefault();\n    if(state === 'playing') state = 'paused';\n    else if(state === 'paused') state = 'playing';\n    return;\n  }\n  const k = KEY[e.key];\n  if(!k) return;\n  e.preventDefault();\n  turn(k[0], k[1]);\n}, {passive:false});\n\nlet tx = 0, ty = 0, touching = false;\ncv.addEventListener('touchstart', e => { touching = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});\ncv.addEventListener('touchend', e => {\n  if(!touching) return; touching = false;\n  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;\n  if(Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;\n  if(Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);\n  else turn(0, dy > 0 ? 1 : -1);\n}, {passive:true});\n\ndocument.getElementById('btnPause').onclick = () => {\n  if(state === 'playing') state = 'paused';\n  else if(state === 'paused') state = 'playing';\n};\ndocument.getElementById('btnRestart').onclick = () => newGame();\ndocument.getElementById('btnSound').onclick = e => {\n  muted = !muted;\n  e.target.textContent = '音效 ' + (muted ? '关' : '开');\n  if(!muted) audio();\n};\ndocument.getElementById('mStart').onclick = () => {\n  audio();\n  if(state === 'over') newGame();\n  document.getElementById('overlay').classList.add('hide');\n  state = 'playing';\n};\nwindow.addEventListener('resize', () => { fit(); });\n\n/* ---------- 启动 ---------- */\nif(typeof window !== 'undefined' && window.__CS_TEST__ === undefined){\n  fit();\n  newGame();\n  requestAnimationFrame(loop);\n}\n<\/script>\n</body>\n</html>\n"
  },
  {
    "id": "maze",
    "name": "光影迷宫",
    "tag": "解谜线",
    "tip": "点击镜子旋转 90°，把所有水晶点亮",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>光影迷宫 · Light Maze</title>\n<style>\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  html,body{height:100%}\n  body{\n    margin:0;padding:28px 18px;\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace;\n    color:#e6f0ff;\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(232,230,255,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(255,159,67,.08) 0%, rgba(255,238,221,0) 60%),\n      #0d0d1a;\n    min-height:100%;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .app{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1000px;width:100%}\n\n  .board-wrap{\n    background:#fff;border-radius:22px;padding:14px;\n    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.40);\n    border:1px solid #26304a;\n  }\n  #board{display:block;line-height:0;border-radius:14px;overflow:hidden}\n  #board svg{display:block;max-width:min(64vw,520px);height:auto;cursor:pointer}\n\n  .panel{width:286px;flex:0 0 auto}\n  .card{background:#fff;border-radius:18px;padding:18px 18px 16px;border:1px solid #26304a;box-shadow:0 10px 30px rgba(0,0,0,.40)}\n  .card + .card{margin-top:14px}\n\n  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b98b8;font-weight:600}\n  h1{margin:6px 0 4px;font-size:19px;letter-spacing:.01em}\n  .tip{margin:8px 0 0;font-size:13px;line-height:1.65;color:#93a2c0}\n\n  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}\n  .stat{background:#1b2136;border-radius:12px;padding:9px 6px;text-align:center}\n  .stat b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}\n  .stat span{font-size:11px;color:#8b98b8}\n  .stat.hot b{color:#4ecca3}\n\n  .btns{display:flex;gap:8px;margin-top:14px}\n  button{\n    flex:1;font:inherit;font-size:13px;font-weight:600;cursor:pointer;\n    border-radius:11px;padding:10px 8px;border:1px solid #2b3550;background:#fff;color:#c3d0e6;\n    transition:.16s;\n  }\n  button:hover{background:#1b2136;border-color:#3a4767;transform:translateY(-1px)}\n  button:active{transform:translateY(0)}\n  button.primary{background:#4ecca3;border-color:#4ecca3;color:#fff;box-shadow:0 6px 16px rgba(91,91,239,.28)}\n  button.primary:hover{background:#3aa882}\n  button:disabled{opacity:.42;cursor:not-allowed;transform:none}\n\n  .legend{margin-top:14px;display:grid;gap:7px;font-size:12px;color:#93a2c0}\n  .legend div{display:flex;align-items:center;gap:9px}\n  .chip{width:20px;height:20px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}\n  .chip.m{background:#4ecca3}\n  .chip.s{background:#ff9f43}\n  .chip.t{background:#ffd24a}\n  .chip.w{background:#2b3550}\n  .chip.e{background:#54e0e0}\n\n  .lvlbar{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap}\n  .dot{\n    width:29px;height:29px;border-radius:9px;border:1px solid #2b3550;background:#fff;\n    font-size:12px;font-weight:700;color:#8b98b8;cursor:pointer;display:grid;place-items:center;transition:.16s;\n  }\n  .dot:hover{border-color:#3a4767}\n  .dot.on{background:#e6f0ff;border-color:#e6f0ff;color:#fff}\n  .dot.done{background:#eef7ee;border-color:#cfe6cf;color:#3d8b52}\n\n  .overlay{\n    position:fixed;inset:0;background:rgba(6,8,18,.86);backdrop-filter:blur(4px);\n    display:none;place-items:center;z-index:50;padding:20px;\n  }\n  .overlay.on{display:grid;animation:fade .22s ease}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .modal{\n    background:#fff;border-radius:22px;padding:28px 30px;text-align:center;max-width:360px;width:100%;\n    box-shadow:0 30px 70px rgba(0,0,0,.70);animation:pop .28s cubic-bezier(.2,1.3,.4,1);\n  }\n  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}\n  .modal h2{margin:0 0 6px;font-size:23px}\n  .modal p{margin:0 0 20px;color:#93a2c0;font-size:13.5px;line-height:1.7}\n  .stars{font-size:26px;letter-spacing:6px;margin-bottom:12px}\n  .modal .btns{margin-top:0}\n\n  @media (max-width:760px){\n    .app{flex-direction:column;align-items:center}\n    .panel{width:100%;max-width:520px}\n    #board svg{max-width:88vw}\n  }\n\n  /* ===================== 像素街机主题 · 统一风格 ===================== */\n  body{\n    font-family:'Courier New',ui-monospace,Consolas,'Microsoft YaHei',monospace !important;\n    color:#e6f0ff !important;\n    background:\n      radial-gradient(900px 520px at 12% -8%, rgba(78,204,163,.10) 0%, rgba(78,204,163,0) 62%),\n      radial-gradient(760px 480px at 92% 108%, rgba(233,69,96,.08) 0%, rgba(233,69,96,0) 60%),\n      #0d0d1a !important;\n  }\n  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;border-radius:4px !important}\n  #board{border-radius:0 !important}\n  h1,h2,h3{color:#e6f0ff !important}\n  .eyebrow{color:#4ecca3 !important;font-weight:700 !important;letter-spacing:.2em !important}\n  .tip,.modal p,.help,.enemySub,.empty{color:#93a2c0 !important}\n  .modal p.big{color:#e6f0ff !important}\n  .card,.stage,.board-wrap,.enemy,.modal{border-radius:6px !important}\n  .card,.enemy{\n    background:#141a2e !important;border:3px solid #26304a !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 26px rgba(78,204,163,.07) !important;\n  }\n  .stage,.board-wrap{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 6px 0 #05070f, 0 0 30px rgba(78,204,163,.20) !important;\n  }\n  .modal{\n    background:#141a2e !important;border:3px solid #4ecca3 !important;\n    box-shadow:0 0 0 1px #05070f, 0 8px 0 #05070f, 0 0 60px rgba(78,204,163,.28) !important;\n  }\n  .overlay{background:rgba(6,8,18,.86) !important;backdrop-filter:blur(3px) !important}\n  .stat,.sc,.floorBadge,.keys,.comboTag,.shieldTag{\n    background:#1b2136 !important;border:1px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:3px !important;\n  }\n  .stat span,.sc span{color:#8b98b8 !important}\n  .keys{border:1px solid #3a4767 !important;color:#e6f0ff !important}\n  .swatch{box-shadow:inset 0 -3px 0 rgba(0,0,0,.4) !important;border-radius:4px !important}\n  button{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;color:#c3d0e6 !important;\n    border-radius:4px !important;font-weight:700 !important;box-shadow:0 3px 0 #05070f !important;\n  }\n  button:hover:not(:disabled){background:#243052 !important;border-color:#4ecca3 !important;color:#e6f0ff !important}\n  button.primary{\n    background:#4ecca3 !important;border-color:#3aa882 !important;color:#0b1220 !important;\n    box-shadow:0 4px 0 #2d6a4f, 0 0 20px rgba(78,204,163,.35) !important;\n  }\n  button.primary:hover:not(:disabled){background:#5fd9b0 !important;border-color:#4ecca3 !important;color:#0b1220 !important}\n\n  /* 光影迷宫：关卡点 / 图例 / 棋盘 */\n  #board svg{background:#0a0e1a}\n  .dot{\n    background:#1b2136 !important;border:2px solid #2b3550 !important;color:#6f7d9c !important;\n    border-radius:4px !important;box-shadow:0 2px 0 #05070f !important;\n  }\n  .dot:hover{border-color:#4ecca3 !important;color:#c3d0e6 !important}\n  .dot.on{background:#4ecca3 !important;border-color:#3aa882 !important;color:#0b1220 !important}\n  .dot.done{background:#16342a !important;border-color:#2d6a4f !important;color:#4ecca3 !important}\n  .stat.hot b{color:#4ecca3 !important}\n  .chip{border-radius:3px !important}\n  .chip.m{background:#8a7ab5 !important;color:#120b22 !important}\n  .chip.s{background:#ff9f43 !important;color:#2a1400 !important}\n  .chip.t{background:#ffd700 !important;color:#2a1f00 !important}\n  .chip.w{background:#2b3550 !important;color:#8b98b8 !important}\n  .chip.e{background:#4ecca3 !important;color:#0b1220 !important}\n  </style>\n</head>\n<body>\n<div class=\"app\">\n  <div class=\"board-wrap\"><div id=\"board\"></div></div>\n\n  <aside class=\"panel\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">Light Maze · 光路解谜</div>\n      <h1 id=\"lvName\">第一道光</h1>\n      <p class=\"tip\" id=\"lvTip\"></p>\n      <div class=\"stats\">\n        <div class=\"stat hot\"><b id=\"sMoves\">0</b><span>已转动</span></div>\n        <div class=\"stat\"><b id=\"sPar\">–</b><span>最少步数</span></div>\n        <div class=\"stat\"><b id=\"sLit\">0/1</b><span>水晶</span></div>\n      </div>\n      <div class=\"btns\">\n        <button id=\"btnReset\">重来</button>\n        <button id=\"btnHint\">提示</button>\n      </div>\n      <div class=\"btns\">\n        <button id=\"btnPrev\">上一关</button>\n        <button class=\"primary\" id=\"btnNext\">下一关</button>\n      </div>\n      <div class=\"lvlbar\" id=\"lvlbar\"></div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"legend\">\n        <div><span class=\"chip m\">/</span> 镜面 · 点击旋转 90°</div>\n        <div><span class=\"chip s\">✦</span> 分光镜 · 一束劈成两束</div>\n        <div><span class=\"chip t\">◆</span> 水晶 · 被光照到即点亮</div>\n        <div><span class=\"chip e\">▶</span> 光源 · 光从这里射出</div>\n        <div><span class=\"chip w\">■</span> 石墙 · 挡住光束</div>\n      </div>\n    </div>\n  </aside>\n</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"modal\">\n    <div class=\"stars\" id=\"mStars\">★★★</div>\n    <h2 id=\"mTitle\">通关！</h2>\n    <p id=\"mBody\"></p>\n    <div class=\"btns\">\n      <button id=\"mRetry\">再来一次</button>\n      <button class=\"primary\" id=\"mNext\">下一关</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* ---------- 方向: 0右 1下 2左 3上 ---------- */\nconst DIRS = [[0,1],[1,0],[0,-1],[-1,0]];\nconst CS = 64;                       // 单元格像素尺寸\nconst CH_EMIT = {'>':0,'v':1,'<':2,'^':3};\n\nconst LEVELS = [\n  {\n    name: \"第一道光\",\n    tip: \"点击镜子让它转动 90°，把光束引到水晶上。\",\n    grid: [\n      \"......\",\n      \"......\",\n      \".>./..\",\n      \"...T..\",\n      \"......\",\n      \"......\"\n    ]\n  },\n  {\n    name: \"双镜回廊\",\n    tip: \"两块镜子接力，光束要连拐两个弯。\",\n    grid: [\n      \".......\",\n      \".>../..\",\n      \".......\",\n      \".......\",\n      \".......\",\n      \"..../T.\",\n      \".......\"\n    ]\n  },\n  {\n    name: \"绕墙而行\",\n    tip: \"石墙会吞掉光束，先在心里画好路线再动手。\",\n    grid: [\n      \"........\",\n      \".>./....\",\n      \"........\",\n      \".../../.\",\n      \"..##....\",\n      \"..##..T.\",\n      \"........\",\n      \"........\"\n    ]\n  },\n  {\n    name: \"三晶回廊\",\n    tip: \"水晶可以让光继续穿过 —— 一束光能连点三颗。\",\n    grid: [\n      \"........\",\n      \".>.../..\",\n      \"........\",\n      \"..T..T..\",\n      \"........\",\n      \"../T.\\\\..\",\n      \"........\",\n      \"........\"\n    ]\n  },\n  {\n    name: \"分光之镜\",\n    tip: \"分光镜会把一束光劈成两束，同时点亮两条路线。\",\n    grid: [\n      \"........\",\n      \"........\",\n      \"........\",\n      \">..S.T/.\",\n      \"........\",\n      \"...T..T.\",\n      \"........\",\n      \".../.T..\"\n    ]\n  },\n  {\n    name: \"迷城终章\",\n    tip: \"九格迷宫，四面镜 —— 一条光路点亮全部水晶。\",\n    grid: [\n      \">....T./.\",\n      \".........\",\n      \"T/....#..\",\n      \".T...#...\",\n      \"./.T.T./.\",\n      \".....#...\",\n      \"...#.....\",\n      \".........\",\n      \".........\"\n    ]\n  }\n];\n\n/* ---------- 状态 ---------- */\nlet li = 0, N = 0, grid = [], moves = 0, finished = false;\nlet parMap = {};        // 每关最少步数（暴力求解得出）\nlet parSolution = {};   // 每关解法\n\n/* ---------- 解析关卡 ---------- */\nfunction parse(def){\n  const g = def.grid;\n  N = g.length;\n  grid = [];\n  for(let r=0;r<N;r++){\n    const row = [];\n    for(let c=0;c<N;c++){\n      const ch = g[r][c];\n      if(ch === '#') row.push({type:'wall'});\n      else if(ch === 'T') row.push({type:'target'});\n      else if(ch === '.') row.push({type:'empty'});\n      else if(ch in CH_EMIT) row.push({type:'emitter', dir:CH_EMIT[ch]});\n      else if(ch === '/') row.push({type:'mirror', rot:0});\n      else if(ch === '\\\\') row.push({type:'mirror', rot:1});\n      else if(ch === 'S') row.push({type:'splitter', rot:1});\n      else if(ch === 'Z') row.push({type:'splitter', rot:0});\n      else row.push({type:'empty'});\n    }\n    grid.push(row);\n  }\n}\n\nconst rotatable = t => t.type === 'mirror' || t.type === 'splitter';\nconst reflect = (d, rot) => rot === 0 ? 3 - d : (d ^ 1);\n\n/* ---------- 光路追踪 ---------- */\nfunction trace(){\n  const paths = [], lit = new Set();\n  const q = [];\n  for(let r=0;r<N;r++) for(let c=0;c<N;c++){\n    if(grid[r][c].type === 'emitter') q.push({r, c, dir:grid[r][c].dir});\n  }\n  let guard = 0;\n  while(q.length && guard++ < 240){\n    let {r, c, dir} = q.shift();\n    const pts = [c*CS + CS/2, r*CS + CS/2];\n    const limit = N*N + 6;\n    for(let s=0; s<limit; s++){\n      const [dr, dc] = DIRS[dir];\n      r += dr; c += dc;\n      if(r<0 || c<0 || r>=N || c>=N) break;\n      const t = grid[r][c];\n      if(t.type === 'wall') break;\n      pts.push(c*CS + CS/2, r*CS + CS/2);\n      if(t.type === 'target'){ lit.add(r + ',' + c); continue; }\n      if(t.type === 'mirror'){ dir = reflect(dir, t.rot); continue; }\n      if(t.type === 'splitter'){ q.push({r, c, dir:reflect(dir, t.rot)}); continue; }\n    }\n    paths.push(pts);\n  }\n  return {paths, lit};\n}\n\nfunction targets(){\n  const out = [];\n  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c].type === 'target') out.push([r,c]);\n  return out;\n}\nfunction clear(){\n  const {lit} = trace();\n  const ts = targets();\n  for(const [r,c] of ts) if(!lit.has(r + ',' + c)) return false;\n  return true;\n}\n\n/* ---------- 求解器：暴力枚举所有可转动物的朝向 ---------- */\nfunction solve(def){\n  const keep = grid, keepN = N;\n  parse(def);\n  const cells = [];\n  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(rotatable(grid[r][c])) cells.push([r,c]);\n  const k = cells.length;\n  if(k > 16){ grid = keep; N = keepN; return null; }\n  const init = cells.map(([r,c]) => grid[r][c].rot);\n  let best = null;\n  for(let mask=0; mask < (1<<k); mask++){\n    let cost = 0;\n    for(let i=0;i<k;i++){\n      const rot = (mask >> i) & 1;\n      grid[cells[i][0]][cells[i][1]].rot = rot;\n      if(rot !== init[i]) cost++;\n    }\n    if(best !== null && cost >= best) continue;\n    if(clear()) best = cost;\n  }\n  // 复原为初始朝向\n  for(let i=0;i<k;i++) grid[cells[i][0]][cells[i][1]].rot = init[i];\n  const res = {cells, init, best};\n  grid = keep; N = keepN;\n  return res;\n}\n\n/* ---------- 渲染 ---------- */\nconst boardEl = document.getElementById('board');\n\nfunction render(){\n  const {paths, lit} = trace();\n  const S = N * CS;\n  let s = `<svg viewBox=\"0 0 ${S} ${S}\" width=\"${S}\" height=\"${S}\" xmlns=\"http://www.w3.org/2000/svg\">`;\n\n  // 定义\n  s += `<defs>\n    <linearGradient id=\"gold\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"#ffd700\"/><stop offset=\"1\" stop-color=\"#f09a1a\"/>\n    </linearGradient>\n    <linearGradient id=\"beamG\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"#7fe3c0\"/><stop offset=\"1\" stop-color=\"#3aa882\"/>\n    </linearGradient>\n    <filter id=\"glow\" x=\"-60%\" y=\"-60%\" width=\"220%\" height=\"220%\">\n      <feGaussianBlur stdDeviation=\"5\" result=\"b\"/>\n      <feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge>\n    </filter>\n  </defs>`;\n\n  // 地板\n  for(let r=0;r<N;r++) for(let c=0;c<N;c++){\n    const t = grid[r][c], x = c*CS, y = r*CS;\n    if(t.type === 'wall'){\n      s += `<rect x=\"${x+3}\" y=\"${y+3}\" width=\"${CS-6}\" height=\"${CS-6}\" rx=\"10\" fill=\"#2b3550\"/>`;\n      s += `<rect x=\"${x+10}\" y=\"${y+10}\" width=\"${CS-20}\" height=\"${CS-20}\" rx=\"6\" fill=\"#3a4767\"/>`;\n    } else {\n      s += `<rect x=\"${x+3}\" y=\"${y+3}\" width=\"${CS-6}\" height=\"${CS-6}\" rx=\"10\" fill=\"#151c30\" stroke=\"#26304a\"/>`;\n    }\n  }\n\n  // 光束\n  for(const pts of paths){\n    if(pts.length < 4) continue;\n    const p = pts.join(' ');\n    s += `<polyline points=\"${p}\" fill=\"none\" stroke=\"url(#beamG)\" stroke-width=\"12\"\n            stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".26\" filter=\"url(#glow)\"/>`;\n    s += `<polyline points=\"${p}\" fill=\"none\" stroke=\"#4ecca3\" stroke-width=\"4.5\"\n            stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".92\"/>`;\n    s += `<polyline points=\"${p}\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.8\"\n            stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"7 13\" opacity=\".9\">\n            <animate attributeName=\"stroke-dashoffset\" from=\"40\" to=\"0\" dur=\"0.9s\" repeatCount=\"indefinite\"/>\n          </polyline>`;\n  }\n\n  // 棋子\n  for(let r=0;r<N;r++) for(let c=0;c<N;c++){\n    const t = grid[r][c], x = c*CS, y = r*CS, cx = x + CS/2, cy = y + CS/2;\n\n    if(t.type === 'emitter'){\n      const [dr, dc] = DIRS[t.dir];\n      const ax = cx + dc*15, ay = cy + dr*15;\n      const nx = -dc, ny = -dr;\n      const p1 = `${ax + nx*9},${ay + ny*9}`, p2 = `${ax - nx*9},${ay - ny*9}`;\n      s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"19\" fill=\"#1b2136\" stroke=\"#3a4767\" stroke-width=\"2\"/>`;\n      s += `<polygon points=\"${ax},${ay} ${p1} ${p2}\" fill=\"#4ecca3\"/>`;\n      s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"6\" fill=\"#fff\"/>`;\n    }\n\n    if(t.type === 'target'){\n      const on = lit.has(r + ',' + c);\n      if(on){\n        s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"22\" fill=\"#ffd700\" opacity=\".35\" filter=\"url(#glow)\"/>`;\n        s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"15\" fill=\"url(#gold)\" stroke=\"#c99a1e\" stroke-width=\"2\"/>`;\n        s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"6\" fill=\"#fff8e0\"/>`;\n      } else {\n        s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"15\" fill=\"#1b2136\" stroke=\"#3a4767\" stroke-width=\"2\"/>`;\n        s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"6\" fill=\"#ffd700\"/>`;\n      }\n    }\n\n    if(t.type === 'mirror' || t.type === 'splitter'){\n      const isSplit = t.type === 'splitter';\n      const col = isSplit ? '#ff9f43' : '#8a7ab5';\n      const w = isSplit ? 5 : 7;\n      // 底板\n      s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"23\" fill=\"${isSplit ? 'rgba(255,159,67,.16)' : 'rgba(138,122,181,.16)'}\" opacity=\".85\"/>`;\n      let x1, y1, x2, y2;\n      if(t.rot === 0){ x1 = x + 13; y1 = y + CS - 13; x2 = x + CS - 13; y2 = y + 13; }\n      else           { x1 = x + 13; y1 = y + 13;      x2 = x + CS - 13; y2 = y + CS - 13; }\n      s += `<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"#fff\" stroke-width=\"${w+5}\" stroke-linecap=\"round\"/>`;\n      s += `<line x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${col}\" stroke-width=\"${w}\" stroke-linecap=\"round\"/>`;\n      if(isSplit){\n        // 分光镜：再加一条平行短线 + 光晕，视觉上区分\n        const ox = (y2 - y1), oy = -(x2 - x1);\n        const len = Math.hypot(ox, oy) || 1;\n        const ux = ox/len*5, uy = oy/len*5;\n        s += `<line x1=\"${x1+ux}\" y1=\"${y1+uy}\" x2=\"${x2+ux}\" y2=\"${y2+uy}\"\n                stroke=\"#4ecca3\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".8\" stroke-dasharray=\"4 5\"/>`;\n      }\n    }\n  }\n  s += `</svg>`;\n  boardEl.innerHTML = s;\n}\n\n/* ---------- 交互 ---------- */\nboardEl.addEventListener('click', e => {\n  const svg = boardEl.querySelector('svg');\n  if(!svg || finished) return;\n  const rect = svg.getBoundingClientRect();\n  const scale = (N * CS) / rect.width;\n  const c = Math.floor((e.clientX - rect.left) * scale / CS);\n  const r = Math.floor((e.clientY - rect.top) * scale / CS);\n  if(r < 0 || c < 0 || r >= N || c >= N) return;\n  const t = grid[r][c];\n  if(!rotatable(t)) return;\n\n  t.rot = t.rot === 0 ? 1 : 0;\n  moves++;\n  render(); updateHUD();\n  if(clear()) win();\n});\n\n/* ---------- HUD ---------- */\nfunction updateHUD(){\n  const {lit} = trace();\n  const ts = targets();\n  let n = 0;\n  for(const [r,c] of ts) if(lit.has(r + ',' + c)) n++;\n  document.getElementById('sMoves').textContent = moves;\n  document.getElementById('sLit').textContent = n + '/' + ts.length;\n  const p = parMap[li];\n  document.getElementById('sPar').textContent = (p === null || p === undefined) ? '–' : p;\n}\n\nfunction drawLevelBar(){\n  const bar = document.getElementById('lvlbar');\n  bar.innerHTML = LEVELS.map((l, i) =>\n    `<div class=\"dot ${i === li ? 'on' : ''}\" data-i=\"${i}\" title=\"${l.name}\">${i+1}</div>`\n  ).join('');\n}\n\n/* ---------- 关卡流程 ---------- */\nfunction load(i){\n  li = Math.max(0, Math.min(LEVELS.length - 1, i));\n  const def = LEVELS[li];\n  parse(def);\n  moves = 0; finished = false;\n  if(!(li in parMap)){\n    const res = solve(def);\n    parMap[li] = res ? res.best : null;\n    parSolution[li] = res;\n  }\n  document.getElementById('lvName').textContent = def.name;\n  document.getElementById('lvTip').textContent = def.tip;\n  document.getElementById('btnPrev').disabled = (li === 0);\n  document.getElementById('btnNext').disabled = (li === LEVELS.length - 1);\n  document.getElementById('overlay').classList.remove('on');\n  drawLevelBar(); render(); updateHUD();\n}\n\nfunction win(){\n  finished = true;\n  const p = parMap[li];\n  const perfect = (p !== null && moves <= p);\n  let stars = '★☆☆';\n  if(moves <= p) stars = '★★★';\n  else if(moves <= p + 2) stars = '★★☆';\n  document.getElementById('mStars').textContent = stars;\n  document.getElementById('mTitle').textContent = li === LEVELS.length - 1 ? '全部通关！' : '光路贯通！';\n  document.getElementById('mBody').innerHTML =\n    `用了 <b>${moves}</b> 步${p !== null ? `，最少只需 <b>${p}</b> 步` : ''}。` +\n    (perfect ? '<br>完美解，一次没浪费。' : '');\n  const last = li === LEVELS.length - 1;\n  document.getElementById('mNext').style.display = last ? 'none' : '';\n  document.getElementById('overlay').classList.add('on');\n  // 标记已完成\n  drawLevelBar();\n}\n\ndocument.getElementById('lvlbar').addEventListener('click', e => {\n  const d = e.target.closest('.dot');\n  if(d) load(+d.dataset.i);\n});\ndocument.getElementById('btnReset').onclick = () => load(li);\ndocument.getElementById('btnPrev').onclick  = () => load(li - 1);\ndocument.getElementById('btnNext').onclick  = () => load(li + 1);\ndocument.getElementById('mRetry').onclick   = () => load(li);\ndocument.getElementById('mNext').onclick    = () => load(li + 1);\ndocument.getElementById('overlay').onclick  = e => {\n  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('on');\n};\n\ndocument.getElementById('btnHint').onclick = () => {\n  const res = parSolution[li];\n  if(!res || res.best === null) return;\n  const {cells, init} = res;\n  const k = cells.length;\n  // 重放一遍最优 mask（与 solve 中的判据一致）\n  let bestMask = 0, bestCost = Infinity;\n  for(let mask=0; mask < (1<<k); mask++){\n    let cost = 0;\n    for(let i=0;i<k;i++){\n      const rot = (mask >> i) & 1;\n      grid[cells[i][0]][cells[i][1]].rot = rot;\n      if(rot !== init[i]) cost++;\n    }\n    if(cost < bestCost && clear()){ bestCost = cost; bestMask = mask; }\n  }\n  let changed = 0;\n  for(let i=0;i<k;i++){\n    const rot = (bestMask >> i) & 1;\n    grid[cells[i][0]][cells[i][1]].rot = rot;\n    if(rot !== init[i]) changed++;\n  }\n  moves += changed;\n  render(); updateHUD();\n  if(clear()) win();\n};\n\n/* ---------- 启动 ---------- */\nload(0);\n<\/script>\n</body>\n</html>\n"
